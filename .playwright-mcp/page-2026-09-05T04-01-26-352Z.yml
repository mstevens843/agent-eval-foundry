          - text: "calls taken before and after a second build that reuses the same resource name, and treating disagreement as failure; this is not what a \"does the verifier see the disallowed path\" self-check naturally does (that check compares target lists/content visibility, not source-path freshness across sequential builds) — predicted risk LOW. D2's rule requires confirming a captured artifact's content is not merely present but genuinely originates from the container's own filesystem rather than being reachable through it; an agent that already writes content-hash comparisons is closer to covering this incidentally — predicted risk LOW-MODERATE. Recorded combined score: LOW-MODERATE natural-coverage risk (full reasoning and the score must be written into the family's own preregistration artifact before trial authorization — see killConditions). This is a real, falsifiable, applied prediction, not a promise to build one later, and it is explicitly flagged as a pre-trial estimate to be recalibrated against actual submission transcripts once trials run, exactly as estimatedUplift already is."
        - paragraph [ref=f7e2763]: (7) Controls → positive-work / no-op / always-refuse / unconditional-success / hardcoding / evidence-forging — detailed in the controls field below, now scoped to both D1 and D2.
        - paragraph [ref=f7e2764]: (8) Deterministic scenario fuzzing → fuzzed across the five dimensions the family itself names, crossed with fixture behavior class, requiring the frozen grid to contain fixtures where D1 alone is activated, D2 alone is activated, and both are inert (non-activating controls).
