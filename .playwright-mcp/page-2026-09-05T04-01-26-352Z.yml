            - code [ref=f7e3844]: harbor analyze
            - text: before accepting a reward-0 task) and
            - code [ref=f7e3845]: tb-rubric-proposal
            - text: "'s \"Spec-ambiguity-driven verifier divergence\" (\"if two reasonable people read the problem description... a well-specified problem should result in both of them writing verification algorithms so that anyone who passed one of the verifiers would also pass the other\") are the review"
            - emphasis [ref=f7e3846]: principles
            - text: that justify several of the rejections elsewhere in this section — they are criteria, not candidates.
          - listitem [ref=f7e3847]:
            - code [ref=f7e3848]: tb-rubric-proposal
            - text: "'s \"Disallowed-lookup scope expansion\" and"
            - code [ref=f7e3849]: tb-rubric-implementation
            - text: "'s \"Process constraints stated in instructions but not mechanically verified\" both describe the same governance gap (a soft behavioral rule like \"don't search the internet\" graded only by an optional transcript pass) restated across two rubric documents."
          - listitem [ref=f7e3850]:
            - code [ref=f7e3851]: tb-rubric-implementation
            - text: "'s \"Self-referential ground truth defeats a stated but unenforced 'do-not-modify' authority constraint\" is explicitly a fixture TB built to test"
            - emphasis [ref=f7e3852]: its own
