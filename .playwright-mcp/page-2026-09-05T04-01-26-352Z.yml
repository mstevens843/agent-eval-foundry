              - cell [ref=f7e1915]:
                - text: Trial-Time Tool Shim Poisoning (
                - code [ref=f7e1916]: trial-time-tool-shim-poisoning
                - text: )
              - cell "An agent with write access to a shared environment can pre-poison a binary or PATH entry (e.g. curl) that a nominally-independent, later-running verification step will invoke, causing that 'independent' check to silently consume attacker- or agent-controlled output." [ref=f7e1917]
              - cell "Agent must either, as a builder, harden a verifier against trial-time tool shimming by baking external dependencies into a sealed, version-pinned image, or, as a security-review agent, identify that a verifier's live network/tool fetch is exploitable this way and demonstrate or propose the fix." [ref=f7e1918]
              - cell "verifier-trust-boundary-integrity" [ref=f7e1919]
              - cell "security-adjacent CI / eval-harness engineering" [ref=f7e1920]
              - cell "tb3-repo-root, tb-review-automation" [ref=f7e1921]
              - cell "fresh-external" [ref=f7e1922]
              - cell "Tools/binaries invoked by a later verification step are meant to sit outside the agent's turn's causal influence; shared-filesystem execution silently breaks that boundary, and a verifier's fetch/tool-invocation step is only trustworthy if it resolves to a binary the agent had no opportunity to influence." [ref=f7e1923]
              - cell "The compromise is invisible from the verifier's own output -- a poisoned curl still 'succeeds' and returns data -- so detecting it requires inspecting the actual binary/PATH state independently of the verifier's report." [ref=f7e1924]
              - cell "which binary/tool is shimmable; whether external deps are baked into a sealed image vs fetched live; timing of the shim relative to verifier invocation; detection tooling present." [ref=f7e1925]
              - cell "An agent may not realize a common binary name is both agent-writable and verifier-invoked, either accidentally leaving a broken shim, or a security-review agent missing that the underlying tool was replaced earlier in the same session, because the poisoned output is plausible and well-formed." [ref=f7e1926]
              - cell "Documented real attack class (the cited RDI/Berkeley 89/89 case) with a well-defined mechanistic fix (sealed, version-pinned dependencies); reasoning about shared-execution trust boundaries is legitimate security-engineering skill." [ref=f7e1927]
