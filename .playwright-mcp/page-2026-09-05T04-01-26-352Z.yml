        - paragraph [ref=f7e2138]:
          - text: Each submission gets a 0-3 coverage count (how many of the three surfaces its own reasoning/tooling visibly covered), computed the same conservative way as the existing module (credit only when structure is present in agent-written source outside the graded artifact). This count is surfaced as a new non-blocking field on
