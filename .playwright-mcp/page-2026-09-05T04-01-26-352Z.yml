            - code [ref=f7e2627]: "202"
            - text: — this is one defect location and is never stated · that decisionLog.ts's precedence rule (confirmation-order authority vs. naive recency) is a second, independent fault surface distinct from the entryOutcome.ts/resume.ts divergence, and which of the two (or both) is mutated in a given scenario · the chunk-size threshold that forces a multi-chunk batch · the exact ordering used when a scenario injects a duplicate or out-of-order async completion relative to the next submission cycle · which specific reject reasons a given scenario's mock policy treats as terminal versus retryable beyond what POLICY.md documents in general terms · mutant identifiers and what each one changes.
          - listitem [ref=f7e2628]:
            - strong [ref=f7e2629]: "Visible-test strategy:"
            - text: "Four passing suites ship with the starter: a happy-path single-cycle submission, a single-cycle submission with synchronous per-entry rejects (correct report + correct retry subset), a duplicate-retry idempotency check, and a suite that calls"
            - code [ref=f7e2630]: reconcile()
            - text: "twice within the same process to \"prove\" restart-safety. The gap is realistic rather than contrived: none of these exercise a"
            - code [ref=f7e2631]: "202"
            - text: async-pending entry, none construct a batch large enough to require chunking, none inject an async completion that resolves after the next cycle has begun, and the double-in-process call is the standard substitute teams reach for when writing a true kill-and-restart test is inconvenient — it passes because in-memory state survives an in-process re-call in a way it would not survive an actual restart, so the suite reports restart-safety as covered when the two code paths that actually run under a real restart or a real out-of-order completion (resume.ts and decisionLog.ts) are never invoked by any visible test.
          - listitem [ref=f7e2632]:
            - strong [ref=f7e2633]: "Private verifier architecture:"
            - text: "A separate verifier process, run after the subject's scenario completes, that (a) queries the mock HIE's resource store directly by business identifier for every event the scenario generated — the sole ground truth for \"landed\"; (b) reads the exchange's independent, root-owned, hash-chained append-only audit/async-completion log to check invariants no subject report can fake: no business identifier acquired two distinct server-assigned ids, no permanently-rejected identifier was retried past policy, and no identifier's confirmed terminal status was overturned by a later signal; (c) verifies the ledger's hash chain is unbroken before trusting it, refusing the run as void if it is broken; (d) compares the subject's report.json against that independently derived truth and grades the comparison, never the report alone; (e) runs the b6-style rig-integrity triad on every invocation — the reference must pass, a targeted narrow mutant must fail, and a missing or malformed report.json must be refused as a void run; (f) applies a self-check-coverage predictor per scenario, now with three named baselines (revised this cycle from two, specifically to close the loophole a skeptic review identified): (1) a shallow self-check (\"did the POST return 200?\"), (2) a per-entry-aware but non-resume-requerying implementation (\"does report.json list every identifier I sent, based on the synchronous response alone?\"), and (3) a generically-diligent-by-habit implementation that re-derives committed state from the exchange on every resume — fixing the resume/async-convergence axis purely out of a general \"never trust local state after a restart\" habit — but that has no confirmation-order precedence logic, no chunk-boundary care, and no cross-cycle async attribution. Scenarios where any of the three would already reach the correct verdict are down-weighted or excluded, so the graded set is concentrated on cases where even a competent default restart habit is insufficient, not merely on cases where a shallow self-check would already succeed."
