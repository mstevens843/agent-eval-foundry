        - paragraph [ref=f7e3606]:
          - code [ref=f7e3607]: probabilityFullRecipe
          - text: "is this project's standing per-trial clean-pass convention — the same one Phase 17 registered in advance for CAA V1 (\"per-trial failure probability: 0.15\") and scored against a binomial interval after the fact. Reading it that way, a family's probability of producing a genuine"
          - strong [ref=f7e3608]: clean 5/6-or-6/6 failure
          - text: "across up to 6 independent trials is:"
        - blockquote [ref=f7e3609]:
