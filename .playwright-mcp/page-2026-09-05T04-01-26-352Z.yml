            - text: "- A consumer that dedupes solely on object id, ignoring event type and order entirely, nonetheless passes the full graded scenario set."
          - listitem [ref=f7e2237]: A pure last-write-wins-by-receipt-order implementation passes any graded scenario.
          - listitem [ref=f7e2238]:
            - text: The
            - code [ref=f7e2239]: platform_sim
            - text: truth log or delivery/ack ledger proves reachable or inferable from inside the subject's own process under the
            - code [ref=f7e2240]: fs-sandbox
            - text: boundary actually in force (not the unbuilt container boundary).
          - listitem [ref=f7e2241]:
            - text: "NEW: the"
