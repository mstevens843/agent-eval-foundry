        - heading "7. Research preregistration" [level=2] [ref=f7e1488]
        - paragraph [ref=f7e1489]: "{ \"sourceChannels\": [ \"hard-benchmark-tasks-trajectories (target n=14; feeds other-foundry section; classified FRESH-EXTERNAL): trajectories/write-ups of hard tasks from >=12 external agent benchmarks/foundries, mined for candidate mechanisms and shapes already proven to stress agents.\", \"verifier-repairs-review-feedback (target n=10; feeds other-foundry section; classified FRESH-EXTERNAL): cases where a benchmark's verifier/checker was repaired after review exposed a gap, mined for verification-strategy and anti-cheat mechanism material.\", \"agent-solve-patches-failed-attempts (target n=2; feeds other-foundry section; classified FRESH-EXTERNAL): agent patches/attempts (solved or failed) examined for the causal reason behind the outcome, not for the patch content itself.\", \"klavis-mcp-cross-tool-workflows (target n=6; feeds klavis section; classified FRESH-EXTERNAL): cross-tool MCP workflows drawn from Klavis repositories, mined for authority-boundary and multi-tool-coordination mechanisms.\", \"authoritative-incident-upstream-fix (target n=9; feeds mechanism-mining section, fresh-incidents subarea; classified FRESH-EXTERNAL): real production incidents carrying a documented upstream fix -- the highest-provenance channel, since causal identity and remediation are both attested by the source.\", \"boundary-first-system-inspection (target n=12; feeds mechanism-mining section, boundaries subarea; classified FRESH-EXTERNAL): direct inspection of real systems' authority/trust boundaries, independent of any known incident, to surface latent mechanisms before they have failed publicly.\", \"foundry-candidates-invalidly-packaged (target n=2; feeds mechanism-mining section, local-foundry-review subarea; classified REBUILT-FROM-INVENTORY -- counts toward the <=8 rebuilt cap, never toward the >=12 fresh-external floor): candidates already inside this foundry's own inventory (data/mechanisms.json, src/families/registry.ts, existing mutants.json entries) that failed packaging/validity checks, re-examined for whether the underlying mechanism is salvageable as a fresh family rather than a repaired old one. Source pool for this channel is exclusively this project's own prior candidates -- never a third-party system.\", \"agent-self-check-failure (target n=1; feeds mechanism-mining section, external-verification-review subarea; classified FRESH-EXTERNAL -- counts toward the >=12 floor, never toward the <=8 rebuilt cap): a case where an EXTERNAL agent's self-verification/self-check step failed or proved gameable, examined as a candidate verification-strategy mechanism. Source pool is exclusively third-party agent/system trajectories drawn from the same external benchmark and write-up corpora as hard-benchmark-tasks-trajectories and verifier-repairs-review-feedback; it is never this foundry's own agent runs or inventory. Disambiguation note (closes a fresh/rebuilt classification ambiguity present in an earlier draft): despite sitting in the mechanism-mining section, this channel is kept in its own external-verification-review subarea, separate from foundry-candidates-invalidly-packaged's local-foundry-review subarea, precisely so its FRESH-EXTERNAL classification is fixed and unambiguous at registration time, not a per-candidate judgment call made later.\", \"tb-official / Terminal-Bench requirements -- NOTE: this is explicitly NOT one of the 8 counted source channels and contributes 0 of the 56 raw-sweep units and 0 raw mechanisms: consulted only as a downstream filter and as the estimation input for the per-family 'probability of passing official Terminal-Bench task review' figure. It must never be tallied against the 8-channel count, the 56-unit sweep cap, or the 40-raw floor.\" ], \"extractionLimits\": \"This is a PREREGISTRATION written before any of the 56 source units have been examined; the counts below are targets fixed in advance, not results. Sweep is capped at exactly 56 source units, distributed across the eight counted channels at their registered counts (14/10/2/6/9/12/2/1) -- no channel is over- or under-sampled relative to its cap without an explicit, timestamped, logged deviation from this document. One canonical extraction per source incident: an incident that appears to carry two mechanisms is resolved by selecting the single dominant causal one and logging the discarded alternative in an appendix, never split into two raw entries -- this bounds the raw pool at <=56 regardless of how mechanism-rich any one incident looks, and means the floor-vs-ceiling arithmetic below is tight by design, not by accident. A source unit that fails inclusionCriteria at extraction time yields zero raw entries and is logged as a rejected unit with its rejection reason, never silently dropped from the audit trail. Each channel's fresh-external vs. rebuilt-from-inventory classification is fixed at registration (see sourceChannels) and applies to every unit drawn from that channel uniformly -- it is never re-decided per candidate during extraction, closing the earlier ambiguity around agent-self-check-failure. Any encounter with durable-outbox or CAA (via boundary-first-system-inspection or authoritative-incident-upstream-fix in particular, since both channels could plausibly re-surface either anchor) is logged and tagged \"anchor,\" contributing to neither the raw pool count nor the final 20. Anchor tagging is an IDENTITY match, not an AXIS match: a raw candidate is tagged \"anchor\" only when its (mechanism, professional workflow, authority boundary, verification strategy) tuple is substantially the same as durable-outbox's or CAA's registered tuple in data/mechanisms.json. A candidate that merely shares the same causal axis with an anchor (e.g., another idempotency-boundary case or another confused-deputy case that is not itself a re-identification of durable-outbox or CAA) is NOT tagged anchor, is not discarded, and proceeds into the raw pool and later dedup as an ordinary candidate, bound only by the ordinary <=2-families-per-causal-axis constraint like any other pair of families sharing that axis. This identity-vs-axis distinction is applied at extraction time by the investigator logging the encounter, who records the matched and differing tuple elements in the anchor log entry so the call is auditable rather than a bare judgment tag. Given realistic per-channel yield (rich, purpose-selected channels such as hard-benchmark-tasks-trajectories and authoritative-incident-upstream-fix expected near 75-85%; supporting-evidence channels such as verifier-repairs-review-feedback expected nearer 50-65%; the three single-digit channels contributing at most 5 raw entries combined even at 100% yield), the sweep is expected to land close to, and not comfortably above, the 40-raw floor -- see expectedRawCount and gaps.\", \"inclusionCriteria\": \"A source unit is admitted to the raw pool only if all of the following hold: (1) it documents or directly evidences a genuine causal failure pattern (a MECHANISM) tied to a real system, incident, benchmark trajectory, reviewer finding, or inspected boundary -- never an invented scenario; (2) the professional workflow, the authority boundary, and at least a plausible verification strategy around the mechanism are sketchable from the source material, so a downstream TASK FAMILY determination is possible without further invention; (3) its difficulty does not rely primarily on obscure trivia, clerical volume, unavailable knowledge, or hidden semantics -- any candidate whose difficulty appears to trace mainly to one of these is rejected outright at extraction time, logged, and excluded from the raw count, not merely down-scored later; (4) it produces exactly one canonical extraction under the one-incident-one-extraction rule; (5) it is not a re-identification of durable-outbox or CAA presented as new -- those are tagged calibration anchors on sight and never enter the raw pool as candidate new families, per the identity-vs-axis distinction registered in extractionLimits (only a full-tuple match triggers this exclusion; sharing the causal axis alone does not). A unit may fail admission and still be logged for calibration purposes (e.g., a near-miss on an anchor mechanism) without counting toward the 40-raw floor.\", \"familyDefinition\": \"Restated verbatim as the governing definition for this track: TASK FAMILY -- a reusable combination of core mechanism + professional workflow + authority boundary + safety/liveness obligations + verification strategy, supporting multiple materially different task packages without changing causal identity. This is distinguished, per the definitions in force for R1, from a TASK SHAPE (the abstract interaction topology alone, with no professional workflow, authority boundary, or verification strategy attached), a TASK INSTANCE (one immutable, hashed challenge package -- changing only a seed/identifier/threshold/scenario is not a new instance and never a new family), and a CONSTRUCTION RECIPE (reusable building techniques layered onto a family, never part of the family's own definition). Every raw extraction and every final family in this study is classified against this exact five-part definition; an extraction that names only a mechanism or only a shape, without a professional workflow, an authority boundary, and a verification strategy at least sketchable, is not yet a family candidate and is logged as a shape/mechanism fragment pending further evidence, not promoted into the raw-family pool.\", \"deduplicationRule\": \"Candidates are clustered for semantic dedup on the tuple (core causal mechanism/axis, professional workflow, authority boundary, verification strategy), never on surface wording or source phrasing; near-duplicate raw items collapse into one family entry that retains the single strongest/most authoritative source citation and logs the discarded duplicates. The raw pool (>=40 entries, collected before any dedup pass begins) must deduplicate down to EXACTLY 20 final families, no more and no fewer. Four hard constraints are enforced on the resulting 20, checked pairwise/globally after clustering rather than only within a cluster: (a) no more than 2 final families may share the same core causal axis; (b) the 20 must span at least 8 distinct professional domains; (c) the 20 must span at least 8 distinct failure axes; (d) at least 12 of the 20 must originate from the seven channels registered FRESH-EXTERNAL (authoritative-incident-upstream-fix, boundary-first-system-inspection, klavis-mcp-cross-tool-workflows, hard-benchmark-tasks-trajectories, verifier-repairs-review-feedback, agent-solve-patches-failed-attempts, agent-self-check-failure -- the last is fresh-external because its source material is always a third-party agent/system per its channel disambiguation note, never this foundry's own inventory), and no more than 8 may be rebuilt/reconstructed from the current foundry inventory (data/mechanisms.json, src/families/registry.ts, existing mutants.json entries) -- only the foundry-candidates-invalidly-packaged channel (2 units) is registered REBUILT, and its units count toward the <=8 cap by construction. This fresh/rebuilt tag is fixed per-channel at registration, not decided per-candidate after the fact, so no raw candidate's fresh/rebuilt status is ambiguous at dedup time. Durable-outbox and CAA are excluded from both the 20-family count and the 12/8 split in either direction -- they are referenced only as calibration anchors when scoring or sanity-checking new candidates, never selected as one of the 20; a fresh family that merely shares an anchor's causal axis without matching its full mechanism/workflow/boundary/verification tuple is not an anchor and is eligible for the 20, subject only to the ordinary <=2-per-axis constraint (see extractionLimits' identity-vs-axis rule). If two raw candidates trace to the same source incident, that is treated as an extraction-time protocol violation (see extractionLimits' one-incident-one-extraction rule) to be caught and corrected before this dedup stage runs, not resolved by dedup itself. If no clustering of the raw pool satisfies all four constraints simultaneously with exactly 20 clusters, the study does not relax a constraint silently -- see stoppingRule.\", \"scoringRubric\": \"Restated verbatim, FIXED weights, do not alter: Family Opportunity Score (0-100) = authoritativeProvenance(10) + economicValue(10) + latentDiagnosisReasoningBurden(15) + naturalAdversarialScenarioSpace(15) + subjectInaccessibleAuthority(10) + verifierAntiCheatFeasibility(10) + constructionOperatorCompatibility(10) + materiallyDistinctInstanceCapacity(10) + implementationTrialTractability(5) + noveltyPortfolioContribution(5) = 100. Separately, for each of the 20 final families, register two decision priors on a 5-point-increment scale (0, 5, 10, ..., 100), each stated as a plausible range (e.g. \"40-55\") plus a confidence label (low/medium/high): P(clean 5/6-or-6/6 | ordinary competent package) and P(clean 5/6-or-6/6 | full construction recipe applied). These are decision priors elicited from provenance, workflow, and boundary characteristics -- never measured frequencies -- and must never be derived from mutant-fatality counts, mechanism-axis counts, reader approval, contract score, or reward-zero outcomes caused by a specification, package, verifier, or infrastructure defect (per the TARGET EVENT definition, a defect-caused reward-zero is not a clean target result and must not leak into either prior). Also register per family, as separate estimates: probability of passing official Terminal-Bench task review; probability the family can produce at least 10 materially distinct task instances without changing causal identity; estimated expert build hours for the first package; estimated marginal build hours once reusable infrastructure for the family exists.\", \"expectedRawCount\": 41, \"expectedFinalCount\": 20, \"stoppingRule\": \"The sweep attempts up to 56 source units (the registered per-channel caps), stopping a channel early only if it is exhausted of qualifying units before its cap is reached -- never stopping early merely because the 40-raw floor has already been reached, since domain/axis diversity and the fresh/rebuilt split are only checkable once the full sweep's admissible pool is known. If, after the full 56-unit sweep, the raw admissible pool is below 40, the study does not lower inclusionCriteria to manufacture additional raw entries; it instead declares the sweep under-target, reports the shortfall and its per-channel breakdown, and treats extending a specific channel (or stopping the track short of family selection) as a separate, explicit, logged decision -- never a silent bar-lowering. If the raw pool is >=40 but no clustering into exactly 20 families satisfies all four dedup constraints (<=2 families per causal axis, >=8 domains, >=8 axes, >=12 fresh-external/<=8 rebuilt using the per-channel classification fixed in sourceChannels, anchors excluded from all counts via the identity-vs-axis rule in extractionLimits), the study stops and reports the shortfall (e.g. \"19 families satisfy every constraint; no 20th candidate clears the bar\") rather than relaxing any constraint to force a round number. R1 is complete only when: exactly 20 final families satisfy every dedup constraint; every one of the 20 has been scored on the full fixed-weight Family Opportunity Score rubric; and every one of the 20 carries all six supplementary estimates (the two clean-target-result priors, TB-review-pass probability, >=10-distinct-tasks probability, first-build hours, marginal-build hours).\", \"gaps\": [ \"Raw-count headroom is thin by design: 56 planned units against a 40-raw floor leaves only ~16 units (29%) of slack once the one-incident-one-extraction rule and realistic per-channel yield are applied; the central yield estimate (expectedRawCount=41) lands barely above the floor, not comfortably above it, so a modestly worse-than-expected sweep could fail the floor outright. This is a disclosed statistical-power risk, not a violation of the >=40 commitment itself, which the stoppingRule handles explicitly (declare under-target, never lower inclusionCriteria).\", \"Three channels (agent-solve-patches-failed-attempts n=2, foundry-candidates-invalidly-packaged n=2, agent-self-check-failure n=1) supply only 5 of the 56 units combined; any final family whose best evidence comes from one of these axes rests on a fragile base where a single dead-end unit removes most of the channel's contribution. Note this no longer creates classification ambiguity (each channel's fresh/rebuilt tag is now fixed at registration), only yield fragility.\", \"Domain (>=8) and axis (>=8) coverage are stated as floors on the dedup OUTPUT, but the sweep's INPUT is not pre-stratified by domain or axis -- nothing in the channel design guarantees the 56 units land across 8+ professional domains rather than clustering around a few shapes (e.g. dev-tooling/CI-adjacent incidents are likely over-represented in hard-benchmark-tasks-trajectories and verifier-repairs-review-feedback), so hitting the coverage floors may force discarding otherwise-valid raw candidates and could shrink the effectively usable pool below expectedRawCount.\", \"Elicitation process for the two clean-target-result priors and the four supplementary per-family estimates is not specified beyond the rubric itself: no rater independence, blinding, or order-randomization is registered, so if one investigator scores all 20 families in a single sitting, early families risk anchoring the scale for later ones -- a real threat to the priors being genuinely predictive rather than self-consistent.\" ], \"completenessOk\": true }"
        - heading "8. Raw-source and deduplication funnel" [level=2] [ref=f7e1490]
        - list [ref=f7e1491]:
          - listitem [ref=f7e1492]: "Source units swept: 56 (of 56 attempted; 0 failed or thin: none)"
          - listitem [ref=f7e1493]: "Raw mechanisms/shapes collected: 164 (preregistered floor: 40)"
          - listitem [ref=f7e1494]: "Research channels covered: hard-benchmark-tasks-trajectories, verifier-repairs-review-feedback, agent-solve-patches-failed-attempts, klavis-mcp-cross-tool-workflows, authoritative-incident-upstream-fix, boundary-first-system-inspection, foundry-candidates-invalidly-packaged, agent-self-check-failure"
          - listitem [ref=f7e1495]: "Dedup repair passes required: 0"
          - listitem [ref=f7e1496]: "Final constraint check: all constraints satisfied"
          - listitem [ref=f7e1497]: "Reconciler reasoning: Method: normalized all 60 raw entries across the three passes (18+21+21, each already excluding or separately handling durable-outbox/caa) onto a fingerprint of (causal axis, subject-action contract), then collapsed every cluster of entries describing the same underlying mechanism into one canonical family, taking the strongest/most complete definition, taskShape, authorityBoundary, subjectInaccessibleWitness, and whyFair language across whichever pass(es) wrote it best. Major collapses: (1) the withdrawn-oracle-standalone-generalization mechanism (P1 risk-scorer-replay-stale-oracle / P2 oracle-withdrawal-standalone-generalization) was ultimately left OUT of the final 20 rather than force a third family onto an already-full axis (see exclusions below); (2) OAuth refresh scope-narrowing (P1 oauth-refresh-scope-narrowing / P3 credential-scope-narrowing-on-refresh) merged to one family; (3) payment idempotency (P1 payment-idempotency-key-discipline / P3 idempotent-payment-retry-ambiguous-completion) merged, keeping the payments-ledger-specific scope and leaving SQS/queue-visibility-timeout material for a separate (ultimately excluded) family; (4) webhook duplicate/reorder handling (P1 + P3) merged; (5) worker/partition-rebalance callback dedup (P2 worker-rebalance-callback-dedup / P3 partition-rebalance-duplicate-callback) merged; (6) Knight-Capital dormant-flag rollback (P1 uninformed-rollback-reactivates-defect / P2 dormant-flag-reactivation-audit / P3 rollback-amplifies-latent-defect) merged into one family, three-way agreement on mechanism despite disagreement on axis label (resolved to partial-effect-reconciliation-rollback, matching 2 of 3 passes); (7) CDN/DNS cache staleness (P1 cdn-cache-invalidation-reconciliation-window / P2 cdn-cache-purge-staleness-verification / P3 cache-staleness-verification-gap, folding in the DNS TTL boundary doc) merged into one family under stale-authority (majority axis label across P2/P3); (8) the three verifier-isolation-boundary write-ups (P1 verifier-shared-environment-trust-compromise / P2 verifier-container-isolation-boundary / P3 shared-container-verifier-leakage) merged, since all three restate the same shared-container/artifact-contract mechanism drawn from the same tb3/tb-review/tb-rubric source documents; (9) the two tool-shim-poisoning write-ups (P2 trial-time-tool-shim-attack-surface / P3 trial-time-tool-shim-poisoning) merged as a distinct mechanism from (8) -- passive state inheritance vs. active binary poisoning; (10) self-authored-verification (P1 self-authored-verification-false-pass / P2 self-authored-verification-integrity) merged; (11) the UI-replay/DOM-mutation-timing cluster (P1 ui-replay-dom-mutation-timing / P2 ui-action-record-replay / P3 dom-mutation-batch-ordering-verification) -- all three independently flagged as hardening the foundry's only two SHIP families with the strongest measured local capability gap (5/5 failed trials) -- merged into one rebuilt-from-foundry family rather than kept as three; (12) CRM pagination-locator resilience (P1/P2/P3 all present a near-identical version) merged; (13) the large-tool-catalog-selection cluster (P1 large-tool-catalog-selection-collapse / P2 multi-app-tool-selection-under-scale / P3 bot-user-identity-tool-collapse) merged into one family since P1's own definition already explicitly names bot/user identity mirrors as part of the same mechanism; (14) fuzzy tool-discovery + cross-server dependency threading (P1 fuzzy-instruction-cross-server-tool-discovery / P3 cross-server-dependency-planning-collapse) merged; (15) long-horizon multi-app coordination (near-identical across all three passes, Toolathlon-sourced) merged; (16) multi-day/long-horizon terminal-state drift (P1 multi-day-state-carryforward-drift / P2 long-horizon-terminal-state-drift) merged."
        - paragraph [ref=f7e1498]: "Families NOT carried into the final 20, and why: oracle-withdrawal-standalone-generalization (ML/model-risk audit) -- strong but redundant in spirit with the two retained verification-strategy-failure families and had no open axis slot; queue-redelivery-poison-message-handling (SQS visibility timeout/DLQ, P2) -- retries-duplicate-side-effects axis already at its 2-family cap; wallet-delegated-scope-reconciliation and oauth-token-persistence-leak (both rebuilt-from-foundry) -- authority-boundary-scope-violation axis already at cap with two fresh-external families (oauth-refresh-scope-narrowing, sql-identifier-injection-scope-expansion), and admitting both would have pushed rebuilt-from-foundry count up without added axis/domain diversity; compound-request-partial-fulfillment, transactional-audit-rollback-tension/transactional-rollback-vs-durable-audit-logging, cross-system-record-propagation, live-cutover-zero-downtime-migration, compound-fault-pipeline-without-stage-recovery -- partial-effect-reconciliation-rollback axis already at cap with the two strongest, most externally-evidenced entries (Knight Capital rollback, FHIR batch masking); spec-ambiguity-sole-authority-scoping/underspecified-issue-text-authority and confounded-verification-gate-crux -- the specification-ambiguity axis was judged less load-bearing than the 11 axes retained and cutting it kept the total at exactly 20 without violating any floor; interactive-tui-editor-trap -- weaker, single-source, narrower mechanism than the other tool-selection-failure candidates; ui-collateral-misclick-scope-expansion -- kept its sibling state-diff-collateral-damage-verification instead since the latter has a cleaner, more rigorously specified evaluation methodology (full world-state diff) and avoids redundancy with the large-tool-catalog GUI-click-precision material."
        - paragraph [ref=f7e1499]: durable-outbox and caa-revalidation (all three passes' names for these two calibration anchors) are excluded entirely from the families array per instructions -- they are reference points, not part of the scored 20, and both were treated in every pass as isCalibrationAnchor=true with evidenceType=calibration-anchor; no version of either is present above.
        - paragraph [ref=f7e1500]: "Constraint verification on the final 20: (a) causal-axis cap -- 11 distinct axes used (stale-authority-replay-against-changed-state: 2; retries-duplicate-side-effects: 2; partial-effect-reconciliation-rollback: 2; authority-boundary-scope-violation: 2; verifier-trust-boundary-integrity: 2; verification-strategy-failure: 2; async-out-of-order-completion: 2; pagination-partial-observation: 1; tool-selection-failure: 2; long-horizon-planning-execution-monitoring: 2; scope-expansion-collateral-damage: 1), no axis exceeds 2, satisfying both the <=2-per-axis cap and the >=8-distinct-axes floor with room to spare. (b) professionalDomain -- 20 distinct domain strings (CDN/network ops, DB administration, payments backend infra, distributed streaming infra, fintech trading deployment ops, healthcare interoperability, IAM/OAuth2, data warehousing security, CI/CD grading infra, security-adjacent eval-harness eng, QA/test authoring, CLI self-verification, browser/UI automation, subscription webhook ops, CRM data eng, MCP aggregation platform design, cross-domain tool-mediated knowledge work, cross-app SaaS ops, cross-domain terminal work, multi-app personal/enterprise automation), well over the >=8 floor. (c) Evidence mix -- 19 of 20 are evidenceType=fresh-external and exactly 1 (ui-action-replay-dom-mutation-timing, unanimously classified rebuilt-from-foundry by all three source passes) is rebuilt-from-foundry, satisfying both >=12 fresh-external and <=8 rebuilt-from-foundry without needing to stretch any classification; two families (rollback-reactivates-dormant-defect and oauth-refresh-scope-narrowing) had a split verdict across the source passes on evidenceType, and both were resolved to fresh-external on majority/plurality grounds and because their primary grounding (a public SEC-documented incident; an RFC) is genuinely external material rather than a repackaging of an internal foundry family -- this was a deliberate accuracy call, not an attempt to inflate the fresh-external count, since the count would have cleared the >=12 floor either way. No numeric claims about Phase 17/18 CAA results or the durable-outbox differential were carried into any of the 20 family descriptions, consistent with keeping those two artifacts strictly as excluded calibration anchors.\""
