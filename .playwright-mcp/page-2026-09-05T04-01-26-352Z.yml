        - list [ref=f7e2017]:
          - listitem [ref=f7e2018]:
            - strong [ref=f7e2019]: "Base family definition:"
            - text: A payments/subscription-lifecycle webhook consumer receives an inbound event stream the platform does not guarantee to be ordered, deduplicated, or singly delivered. Two distinct event identifiers can represent one logical change to one object (a split-representation duplicate pair), and a logically-earlier event can arrive after a logically-later one has already been applied (an out-of-order pair). The consumer may mutate its local materialized state for an object only when it can establish, from delivered evidence alone, that the change is both new and current — no single locally-observed signal, taken alone, is sufficient evidence of either property, and no ordering or single-delivery guarantee is granted. Separately, a human operator's manual resend of a stuck delivery is one attempt layered onto the platform's own independent, off-band automatic retry schedule; one acknowledged manual attempt does not by itself establish that the platform's own retries have stopped. Both failure surfaces are the same underlying mistake — a locally observed signal is treated as if it were the externally authoritative fact that only the platform actually holds.
