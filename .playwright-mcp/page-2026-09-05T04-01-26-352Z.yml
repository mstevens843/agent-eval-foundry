              - cell "Each tool variant carries distinct authority/attribution; selecting the wrong one produces an action under the wrong authority (e.g. bot vs human identity) even when the call technically succeeds." [ref=f7e1899]
              - cell "Which of several near-identical schemas is correct for a step is not marked in the schema; the resulting misattribution or wrong-system action is only visible to a grader checking true authorship/state, not to the agent from the call's own successful-looking result." [ref=f7e1900]
              - cell "number of aggregated servers/tools exposed; presence of bot/user identity mirrors; naming similarity; availability of a discovery/router layer." [ref=f7e1901]
              - cell "The aggregator's own design rationale documents this exact failure, so an agent without scoped discovery plausibly picks a wrong-server, wrong-tool, or wrong-identity option returning a normal-looking success that never touches the intended system." [ref=f7e1902]
              - cell "A directly evidenced, real engineering problem the industry itself builds mitigations for (discovery/router layers); testing discrimination professionals genuinely need, derivable straight from the tools' own documented schemas." [ref=f7e1903]
