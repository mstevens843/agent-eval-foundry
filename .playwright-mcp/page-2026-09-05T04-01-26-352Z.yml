            - strong [ref=f7e2185]: "Cheapest package-validity probe:"
            - text: Build the minimal consumer scaffold, the
            - code [ref=f7e2186]: platform_sim
            - text: sidecar (plus its
            - code [ref=f7e2187]: leaky-facade-canary
            - text: variant), the reference implementation, and the three narrow mutants (
            - code [ref=f7e2188]: dedupe-by-event-id
            - text: ","
            - code [ref=f7e2189]: order-by-created
            - text: ","
            - code [ref=f7e2190]: resend-closes-incident
            - text: ", one per decision surface). Run one scenario containing an out-of-order pair, a split-duplicate pair, and a resend-during-active-retry case; confirm the reference passes, all three narrow mutants fail on genuinely distinct check lines, the always-refuse/no-op controls fail cleanly, and the"
            - code [ref=f7e2191]: leaky-facade-canary
            - text: is detected as leaking. Also run the self-check-coverage predictor over the reference's own natural artifacts as a smoke test that the three
            - code [ref=f7e2192]: GradedRule
            - text: definitions actually fire. ~6-8 hours — the added canary and predictor checks reuse existing, validated code (
            - code [ref=f7e2193]: C8-witness-isolation-with-canary
            - text: ","
            - code [ref=f7e2194]: src/screens/self-check-coverage.ts
            - text: ) rather than new infrastructure, so the incremental cost over the pre-reconciliation ~4-6 hour estimate is small.
          - listitem [ref=f7e2195]:
            - strong [ref=f7e2196]: "Three example instances:"
            - list [ref=f7e2197]:
              - listitem [ref=f7e2198]: "Subscription lifecycle reconciliation (the family's calibration instance): subscription.updated/past_due/canceled events, a split-duplicate arising from a plan change that emits both an update and a delayed cancellation-superseding event pair, and a manual resend of a stuck renewal-failure webhook layered onto the platform's still-active daily retry cadence — exercising all three decision surfaces (identity/type collapse, freshness precedence, retry authority) jointly."
              - listitem [ref=f7e2199]: "Invoice/dispute reconciliation for a billing ledger: invoice.paid/invoice.payment_failed/charge.dispute.created events, a split-duplicate arising from one disputed charge emitting both a dispute-created and a funds-withdrawn event carrying overlapping dispute-state fields, and a dispute-unacknowledged SLA incident subject to the same manual-resend/auto-retry trap."
              - listitem [ref=f7e2200]: "Marketplace fulfillment webhook consumer: order.fulfilled/order.canceled/order.return_initiated events from a shipping platform, a split-duplicate arising from partial-shipment splitting (two ship-events for one logical fulfillment), and a carrier-scan-overdue SLA page that must not close on one manual re-ping while the carrier's own automated status-poll retry is still scheduled."
          - listitem [ref=f7e2201]:
            - strong [ref=f7e2202]: "Estimated ordinary-to-recipe uplift:"
            - text: "Ordinary package ~15% → full-recipe ~35% (25-50%, low-to-medium confidence; not additive across operators). This revision does not raise the point estimate — there is still no MEASURED 0/N instantiation of this exact mechanism (evidenceType \"fresh-external,\" isCalibrationAnchor false) — but it closes three concretely-identified epistemic gaps that would otherwise have independently predicted a VALID-BUT-EASY outcome by the CAA V1 precedent: a single-decision reference (now three independently-sized, independently-failable surfaces), no self-check-coverage signal (now a real, wired, non-blocking predictor), and an unproven isolation claim (now backed by a validated canary control). What improves is confidence that the FAIRNESS and DIFFICULTY claims underlying this number are checkable and defensible, not the number itself."
          - listitem [ref=f7e2203]:
            - strong [ref=f7e2204]: "Main fairness/validity risks:"
            - strong [ref=f7e2205]: "Revision note (2026-09-04): reconciled against 3/3 REFUTED skeptic verdicts."
            - text: "All three skeptics independently converged on the same four gaps, grounded in this repo's own Phase 17 CAA V1 postmortem. Rather than dispute them, this revision makes four concrete, checkable fixes:"
