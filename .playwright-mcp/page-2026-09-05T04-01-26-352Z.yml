          - listitem [ref=f7e2790]:
            - strong [ref=f7e2791]: "Public outcome requirements:"
            - text: "Stated only as required behavior, never as defect description, and re-scrubbed to remove all implementation-naming found by adversarial review: (1) the verifier container's filesystem view must, on every run, be limited to content baked into its own image at build time, the artifact snapshot taken from the declared paths strictly after the agent container has fully exited, and a persistent sidecar volume where the task declares one. (2) The agent's container must be independently confirmed exited — not merely instructed to stop — before the verifier container is created. (3) A grading outcome must depend only on that declared surface and must be reproducible from it alone. (4) The pipeline must continue to pass its existing test suite unchanged. A deliverable that is a persistent process or service, not only a file, must be validated by a readiness check established fresh, from the verifier's own vantage point, after both containers have reached their final declared state; the same check must produce the same result if repeated. (5) Every run must emit a structured, machine-readable report of exactly which surfaces (baked / snapshot / sidecar) were exposed to the verifier and confirmation of teardown-before-start ordering — a self-check the grading process cross-validates rather than trusts. (6) Any host resource identified by a name shared between the agent's and verifier's container builds within one orchestration run must reflect that resource's current state as reported by the container runtime for the verifier's build, never a value carried over from an earlier build in the same run. (7) A declared artifact must be captured as the literal content that existed inside the now-destroyed agent container at the moment it stopped; content that instead lives somewhere else and is merely referenced by the declared path must not be accepted as satisfying the artifact contract."
          - listitem [ref=f7e2792]:
