        - heading "2. Definitions and target event" [level=2] [ref=f7e403]
        - paragraph [ref=f7e404]: "MECHANISM: a causal failure pattern (stale authority, identity collapse, replay against changed state, partial-effect reconciliation, scope expansion, etc). TASK FAMILY: a reusable combination of core mechanism + professional workflow + authority boundary + safety/liveness obligations + verification strategy, supporting multiple materially different task packages without changing causal identity. TASK SHAPE: the abstract interaction topology (e.g. reconcile local intent with an external ledger; repair a replay engine against a changing DOM; restore state while preserving post-snapshot work). TASK INSTANCE: one immutable challenge package (own codebase, instruction, verifier, solution, scenario suite, hash). Changing only a seed/identifier/threshold/scenario is NOT a new task. CONSTRUCTION RECIPE: reusable task-building techniques layered onto a family; not part of the family's definition. FAMILY-NATIVE OPERATOR: a difficulty operator justified by the target workflow itself. TARGET EVENT: \"clean target result\" = at least 5 of 6 countable frontier trials (3 current Codex-family + 3 current Claude-family, unless repo evidence specifies otherwise) produce reward 0, WITHOUT any specification, package, verifier, or infrastructure defect causing those failures. Never conflate this with \"agent solve\" (reward 1) or \"task difficulty success\" (reward 0, singular)."
