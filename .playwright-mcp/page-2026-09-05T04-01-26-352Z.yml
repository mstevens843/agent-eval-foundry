          - listitem [ref=f7e2656]:
            - strong [ref=f7e2657]: "Positive-work / cheat controls:"
            - text: "positive-work (the reference gateway reaches full marks across the fuzzed grid) · no-op (submits nothing) → fails on missing commitments · always-refuse (marks every identifier failed) → fails · unconditional-success (report always claims every identifier committed) → fails once any induced-failure, async-pending, or restart scenario runs · hardcoded-report (returns a canned report shape without reading the actual response) → fails fuzzing · forged-ledger (subject writes its own local \"audit.json\"; the harness checks the grader never accepts it as truth) → explicit canary proving a self-issued ledger cannot substitute for the real exchange query · missing/malformed report.json → the verifier must refuse the run as void, never silently score it zero · recency-wins (NEW: an implementation that lets the most recent signal about an identifier always override an earlier confirmed outcome, with no confirmation-order precedence) → fails once any stale/duplicate/out-of-order-completion scenario runs · chunk-naive (NEW: assumes a batch never exceeds the exchange's per-call entry limit) → fails once any multi-chunk scenario runs · restart-safe-by-habit-only (NEW: generically re-derives state from the exchange on every resume but has no decisionLog-equivalent precedence logic, no chunk-boundary care, and no cross-cycle async attribution — the third self-check-coverage baseline made concrete as an actual harness control) → fails on the chunking, race, and signal-precedence scenarios specifically, proving those axes are not subsumed by the async/resume-convergence insight alone."
          - listitem [ref=f7e2658]:
            - strong [ref=f7e2659]: "Scenario-selection strategy:"
            - text: Fuzz the full grid (entry count × failure mechanism × restart point × chunk count × bundle type × duplicate/out-of-order-completion presence) against the reference and all six narrow dev mutants. Keep only points where the reference passes, at least one narrow mutant fails, and — applying the three-baseline self-check-coverage predictor — the outer-200-only baseline, the per-entry-aware-but-never-resume-requerying baseline, and the restart-safe-by-generic-habit baseline all fail to reach the correct verdict, so the graded set is not dominated by the outer-status trap, the resume-requery insight alone, or any single "trust the exchange, not local state" habit. Concentrate the selected region on multi-chunk, restart-injected, and signal-precedence schedules, while retaining a no-restart/no-chunk/no-stale-signal control point every narrow mutant must still pass, proving they are targeted rather than broadly buggy. Before the selection is locked, explicitly verify (as a required gate, not a design intention) that the six narrow mutants decompose into at least four genuinely independent axes after correctly merging
            - code [ref=f7e2660]: resume-trusts-local-queue
            - text: and
            - code [ref=f7e2661]: async-collapsed-to-success
            - text: into one — if they do not, the family is judged to repeat the Phase 17 VALID-BUT-EASY shape and must be reworked rather than shipped. Validate the frozen selection against both held-out mutants before it is locked.
          - listitem [ref=f7e2662]:
            - strong [ref=f7e2663]: "Cheapest package-validity probe:"
            - text: "Build only the reference gateway (including decisionLog.ts), the mock HIE (including its hash-chained ledger and duplicate/out-of-order completion replay), and two scripted scenarios — (a) a small batch, one async-pending entry, one scripted restart between submit and reconcile, and (b) a multi-chunk batch with one duplicate/out-of-order async completion for an already-escalated identifier — then run six checks: the reference passes both;"
            - code [ref=f7e2664]: resume-trusts-local-queue
            - text: fails (a);
            - code [ref=f7e2665]: chunk-boundary-drops-entry
            - text: fails (b) but passes (a);
            - code [ref=f7e2666]: terminal-conflict-mishandled
            - text: fails (b); a shallow "outer-200-only" implementation fails both; and a "restart-safe-by-generic-habit" implementation (re-derives from the exchange on resume, nothing else) passes (a) but fails (b). If any shallow or generic-habit implementation unexpectedly passes the scenario it should fail, or a targeted narrow mutant unexpectedly passes, the core mechanism does not activate on that axis and the family should be reworked before further build-out. Estimated ~8-9 hours (up from the original 5-6, reflecting decisionLog.ts and the second scripted scenario this revision added).
          - listitem [ref=f7e2667]:
            - strong [ref=f7e2668]: "Three example instances:"
            - list [ref=f7e2669]:
              - listitem [ref=f7e2670]: "Regional health information exchange / EHR FHIR facade: a hospital integration gateway submits a batch bundle of lab results, medication-administration records and immunizations; the outer response is 200 OK per FHIR batch semantics, some entries reject synchronously, some defer to async terminology adjudication (202 + polling), and the gateway must survive a restart between submission and reconciliation, a multi-chunk batch, and an out-of-order async completion without dropping or duplicating any record."
              - listitem [ref=f7e2671]: "Retail/3PL order-fulfillment batch API: a merchant's system submits a batch of create-shipment-label, adjust-inventory and emit-ASN operations to a third-party logistics batch endpoint that likewise returns 200/202 at the batch level while individual sub-operations fail independently (SKU not found, address validation failure); the service must determine which labels actually printed and which inventory actually moved before telling the merchant the order shipped, must never double-print a label on retry, and must not let a late-arriving carrier webhook overturn an already-confirmed outcome."
              - listitem [ref=f7e2672]: "Regulated bulk transactional-messaging batch send: a compliance notice mailer submits a batch of regulatory notices to a messaging provider whose batch endpoint accepts the whole payload with 200 OK while individual messages bounce, get suppressed, or are rate-limited (reported only in a per-message result array or a later webhook); the sender must determine which notices actually delivered before marking the regulatory obligation discharged, must not re-send a duplicate notice to a recipient whose message already delivered, and must not let a stale delivery-status replay reopen an already-escalated permanent failure."
          - listitem [ref=f7e2673]:
            - strong [ref=f7e2674]: "Estimated ordinary-to-recipe uplift:"
            - text: Ordinary package (submit the batch, read the response, report success) likely scores around 15-20% failure for a competent agent, since "check the nested Bundle, not just the outer code" is a documented, moderately well-known FHIR gotcha some agents already carry as a habit. This revision's estimate is built from four largely-independent required decisions rather than the pre-revision two-and-a-half effective ones (async/resume convergence, identifier continuity, terminal-state precedence, and chunk-boundary/cross-cycle-attribution), each of which the self-check-coverage predictor's three baselines confirm is not covered by an agent's default self-check or its default "trust the exchange, not local state" construction habit alone. The full recipe is now estimated to raise failure toward roughly 40-55% (range 30-60%, medium confidence, still unmeasured) — a modest upward revision from the pre-revision 35-50% reflecting the added axes, not a claim that the axes are additive in practice. This remains a hypothesis, not an additive sum of per-operator effects — this project's own measured record (Phase 14, Phase 17) is that isolated operator effects have repeatedly come back null or unmeasurable, and the same discipline applies here until trials run; cheapestPackageValidityProbe, not this estimate, is the required next step.
          - listitem [ref=f7e2675]:
            - strong [ref=f7e2676]: "Main fairness/validity risks:"
            - text: "The batch-vs-transaction contract (outer 200 doesn't imply per-entry success) must be stated up front as domain literacy, exactly as HL7 publishes it, but the specific reject/async mix, which of decisionLog.ts's or resume.ts's precedence rules a given scenario mutates, and the chunk/race schedule must never be stated. Per the project's own standing distinction that fairness requires the graded rule stated but not the specific wrong implementation named, this revision reworded publicOutcomeRequirements (iv) so the restart obligation is one of three parallel triggers (restart, chunking, out-of-order async completion) folded into a single \"confirmed state is authoritative\" principle, rather than a standalone clause whose phrasing tracked the resume.ts defect's exact symptom (duplicate/dropped resubmission specifically after a restart) — the earlier phrasing is judged, on reflection, to have leaned too close to naming the fix by describing only the one trigger the planted defect actually responds to. Risk of over-rewarding the well-known \"read the nested Bundle\" trap alone, or the second-most-common \"always re-derive from source of truth after a restart\" habit, is now mitigated by a three-baseline self-check-coverage predictor (the third baseline models exactly that generic habit) rather than the prior two-baseline version, which could not detect it. The reject-reason terminal/retryable taxonomy must live in an agent-visible POLICY.md so grading on it is stated-and-enforced; this revision additionally requires that taxonomy compose with signal-precedence (a confirmed terminal classification outranks later signals), stated at the outcome level without naming decisionLog.ts or its recency-vs-confirmation-order failure mode. The reference now carries four independently-verified decision points (async/resume convergence, identifier continuity, terminal-state precedence, chunk-boundary/cross-cycle-attribution), with independence checked by explicit decomposition as a required gate in scenarioSelectionStrategy rather than asserted in prose — directly answering the concern that a reference with fewer than three real decisions collapses to VALID-BUT-EASY. The restart injection, chunk boundaries, and async-completion timing must all stay scripted and deterministic per scenario, not randomized, so repeated runs are reproducible and blind labelling is meaningful. Risk that reviewers read the whole family as FHIR spec trivia: mitigated by grading only the outcome obligations (retrievability, non-duplication, restart-consistency, signal-precedence, correct escalation), never a citation or the spec text itself."
          - listitem [ref=f7e2677]:
            - strong [ref=f7e2678]: "Kill conditions before paid trials:"
            - text: A shallow implementation that only inspects the synchronous per-entry response (no restart-reconciliation logic at all) passes the full graded scenario set, showing the restart/terminal axes never activate · a "restart-safe-by-generic-habit" implementation (re-derives from the exchange on every resume, nothing else — the third self-check-coverage baseline) passes the full graded scenario set, showing the chunk-boundary, cross-cycle-attribution, and signal-precedence axes added this revision do not add independent difficulty beyond the original async/resume-convergence insight · the mock exchange's admin surface or audit ledger turns out to be reachable from the subject's container, or the ledger's hash chain can be broken without detection, breaking the isolation the grading model depends on · the required pre-lock decomposition (in scenarioSelectionStrategy) finds fewer than three genuinely independent decision points among the six narrow mutants after correctly merging
            - code [ref=f7e2679]: resume-trusts-local-queue
            - text: and
            - code [ref=f7e2680]: async-collapsed-to-success
            - text: into one axis — repeating the Phase 17 VALID-BUT-EASY shape despite this revision's additions · reviewers judge that publicOutcomeRequirements (iv), even reworded, still states the graded rule close enough to the actual defect's symptom that fairness tips into answer-leakage — if so the requirement must be split so no single public sentence maps one-to-one onto any one mutant's failure mode · reviewers judge that knowing "outer 200 doesn't mean success" plus "always re-derive from source of truth after an interruption" is sufficient on its own to solve the graded set, rather than two of at least four prerequisites · the reference or a narrow mutant is not reproducible across 5 runs of the same frozen scenario, most likely from async-timing nondeterminism · the async/202 pattern, or the duplicate/out-of-order completion replay, cannot be grounded in how real HIE/EHR-facade implementations actually behave — if so, drop that axis and lean on chunking plus terminal/retryable escalation instead of forcing an unnatural mechanism.
          - listitem [ref=f7e2681]:
            - strong [ref=f7e2682]: "Adversarial verification:"
            - text: 3/3 skeptics refuted; card was flagged and strengthened.
        - heading [level=3] [ref=f7e2683]:
          - text: SQL/Query Identifier Injection Scope Expansion (
          - code [ref=f7e2684]: sql-identifier-injection-scope-expansion
          - text: )
        - list [ref=f7e2685]:
          - listitem [ref=f7e2686]:
            - strong [ref=f7e2687]: "Base family definition:"
            - text: "Unchanged from the input card, with one added grounding sentence. User- or upstream-tool-controlled identifiers (database/schema/table names, search query strings) are interpolated unsanitized into an executed data-tool call, letting a crafted or unusual identifier value cause the tool to read/touch objects far outside its nominally narrow, declared scope. Causal axis: authority-boundary-scope-violation. The credential/session's nominal authority is scoped to the specific object named in the request; unsanitized interpolation lets a crafted identifier value silently expand that authority to arbitrary objects the underlying credential can reach. Task shape: agent performs a narrowly-scoped lookup (inspect a named schema/table, search a named spreadsheet) where the identifier may originate from an earlier, less-trusted step; agent must validate/parameterize rather than trust direct interpolation; a verifier checks whether the resulting action stayed within the intended object scope. Subject-inaccessible witness: the tool's successful, well-formed response cannot itself reveal whether it executed against the intended object or a different one reached via injection -- only an independent diff of actually-queried objects reveals scope expansion. Domain: data warehousing / spreadsheet API integration security engineering. Fairness basis: unsanitized identifier interpolation is a textbook, well-documented CWE-class defect, independently confirmed via a filed and reviewed upstream PR -- not obscure or proprietary. The harder half of this family (checking scope by a mutable display name rather than a stable identifier, and checking only a direct container rather than a full ancestry/ownership chain) is likewise a named, well-documented real-world defect class -- the same shape as CVE-2018-1058-style PostgreSQL search_path schema-shadowing bugs and the routine Drive/cloud-storage advice to authorize by resource ID rather than by folder title -- so the added depth in this revision is drawn from established security literature, not manufactured to raise difficulty."
          - listitem [ref=f7e2688]:
            - strong [ref=f7e2689]: "Durable-outbox operator mapping:"
            - text: "1) Realistic multi-file service -> a ~1,450-line \"Data Discovery Assistant\": an internal tool that lets analysts find and inspect a named warehouse table or a named spreadsheet by free-text description, spanning both injection surfaces the family names (SQL identifier composition and Drive query-string composition) inside one coherent service, not two toy snippets; the added stable-id-resolution and ancestry-walk mechanisms (see point 3) make this a genuinely thicker, two-surface-plus-batch reference rather than a single conceptual fix wearing a large file count. 2) Outcome-based instructions -> state containment and refusal obligations only, phrased entirely in terms of which object a request settles on and what must happen if it does not settle on exactly one -- never naming \"allow-list,\" \"scope check,\" \"authorization,\" \"resolver,\" or any other synonym for the historical anti-pattern or the untrusted-input step (see publicOutcomeRequirements; this revision audited and removed the word \"unauthorized\" and a sentence that had named the resolver-trust rule almost verbatim, both flagged by review as accidental disclosure). 3) Naturally embedded defect, now with three independent decision points rather than one -> identifier_guard.py correctly rejects SQL/Drive-query metacharacters (so the classic string-breakout injection is already closed) but never re-checks a resolver-supplied, already-well-formed identifier against the service's own declared scope, and where a partial check exists it (a) resolves the SQL side by schema display-name rather than by the catalog's own stable identifier (a session with a non-default search_path can shadow the intended schema with a same-named decoy -- the CVE-2018-1058 class), (b) resolves the Drive side by checking only a candidate's immediate parent folder rather than walking its full ancestry (a file nested under an allowed folder can also be shared into a disallowed one and still show the allowed folder as"
            - emphasis [ref=f7e2690]: a
            - text: "parent), and (c) evaluates a multi-object request as a single unit rather than checking each named object independently, so one in-scope item in a batch can mask an out-of-scope sibling. These three are independent in the sense the recipe requires: fixing (a) does not fix (b) or (c), and each is tested by its own dedicated held-out mutant (see heldOutMutants). The query itself is always built with safe parameterized/quoted composition, so the result is a well-formed, plausible, syntactically-correct response even when it reaches the wrong object. 4) Visible tests with a realistic gap -> existing suite proves metacharacter payloads are rejected and in-scope objects round-trip correctly, but never exercises a syntactically clean identifier pointing at a real, reachable, out-of-scope sibling object, a search_path-shadowed same-named schema, a nested-but-differently-shared Drive file, or a batch mixing in-scope and out-of-scope items. 5) External authoritative state / witness, now enforced at the network layer with a canary -> a transport-level query/API-call recorder-proxy is the"
            - emphasis [ref=f7e2691]: only
            - text: "network route the subject's container has to Postgres or the Google APIs (egress otherwise firewalled); it holds the real credentials, logs every resolved schema/table or effective Drive query and returned file IDs to a private append-only record before forwarding, and a dedicated raw-driver-bypass rig-integrity canary (a subject variant that tries to open its own unwrapped connection) must be observed failing closed on every rig build or the run is voided -- proving, not asserting, that the isolation holds (mirrors this project's own witness-isolation-with-canary control). A second, independent witness -- the fixture warehouse's and fixture Drive project's own native audit logging -- runs in parallel as defense in depth; disagreement between the two witnesses voids the run rather than being tie-broken. This remains the domain's own standard control (query/access audit logging), not an invented outbox. 6) Separate verifier -> a distinct process/container reads only the two witnesses' touched-object logs plus the subject's returned report, never the subject's self-reported scope claims; it also computes a self-check-coverage predictor (see privateVerifierArchitecture) from the subject's own added tests/self-checks, logged as a ranking/diagnostic feature whose predictive validity is measured empirically across the first graded cohort rather than assumed (Phase 17 Recommendation 1), and which can never override a passing graded verdict. 7) Controls -> positive-work / no-op / always-refuse / unconditional-success / hardcoding / evidence-forging / witness-bypass-canary (detailed in positiveWorkAndCheatControls). 8) Deterministic scenario fuzzing -> sweep identifier source x injection surface x wrong-scope shape x ancestry depth x catalog-resolution path x batch size to find the parameter(s) that reliably separate reference from buggy behavior. 9) Selection against three narrow dev mutants, held out on four independent mutants -- two carried over (case-fold-bypass, decoy-name-collision) and two new, one per newly-added surface-specific mechanism (search-path-shadow for the SQL stable-id requirement, immediate-parent-only for the Drive ancestry-walk requirement) -- plus b6-rig-integrity-controls run on every rig: prove the reference passes, each targeted bad subject fails only its intended check, the raw-driver-bypass canary fails closed, and malformed/missing/disagreeing witness evidence voids the run rather than scoring a false pass. 10) Frozen fixtures/hashes, isolated execution, blind labelling -> applied unchanged, verifier and recorder-proxy kept out of subject reach per point 5/6, with the fixture set extended to include nested-parent Drive decoys and a search-path-shadow decoy schema."
          - listitem [ref=f7e2692]:
            - strong [ref=f7e2693]: "Non-applicable operators:"
            - text: committed-idempotency-authority and narrow-recompute-starter -- both presuppose an asynchronous write with an uncertain-completion window and an action-stable idempotency key recovered across a lease epoch; this family has no write-side uncertainty at all, only read/inspect scope, so there is no committed key to recover and no epoch-recompute temptation to seed. recompute-activation-concentration -- presupposes multi-worker crash/recompute schedules as the activating parameter; this family's activating parameter is the shape of the identifier/query string and its resolution path, not worker count or completion timing, so the operator's specific parameterization does not transfer (its general principle -- concentrate scenario selection where the mechanism reliably activates -- is already covered here under fuzz-controlling-parameter, listed as applicable).
          - listitem [ref=f7e2694]:
            - strong [ref=f7e2695]: "Family-native difficulty operators:"
            - text: "(plausible-but-unablated hypotheses, not in the measured 8-operator ledger) -- authorization-vs-syntax conflation: a validator that is demonstrably correct against syntax-breakout must still be separately checked for the orthogonal scope-authorization property, and the two are easy for a working engineer to treat as one job. Well-formed-but-wrong-object provenance: the dangerous input is never malformed or suspicious; it is a perfectly valid identifier for a real, reachable object -- just not the one the request named. Single-witness diff-only detectability: correctness is invisible from the subject's own successful response; only the external touched-object diff exposes divergence, so no amount of local testing against the returned report can catch the defect. Cross-surface consistency: the same containment property must hold across two structurally different query-building mechanisms (SQL identifier composition, Drive query-string composition) in the same service, so a repair that only closes one surface is incomplete -- this is a genuine held-out generalization axis distinct from anything in the durable-outbox lineage. Newly surfaced in this revision -- id-vs-display-name provenance: a scope check performed against a mutable display name (schema name, folder title) rather than a stable identifier (catalog OID, Drive file/folder ID) is bypassable via renaming, case variation, or search-path-style shadowing (the CVE-2018-1058 class), which is a second, independent property from the resolver-trust gap and native to how relational catalogs and Drive's naming model actually work. Ancestry/multi-parent ambiguity: Drive objects can have multiple parents or be nested arbitrarily deep, so a containment check against only the immediate parent is a distinct, realistic omission from a full ancestry walk, not an invented complication."
          - listitem [ref=f7e2696]:
            - strong [ref=f7e2697]: "Multi-file codebase sketch:"
            - text: "A ~1,450-line Python \"Data Discovery Assistant\" service: discovery/server.py (tool entrypoints: find_object, inspect_object, search_within, ~150 lines) . discovery/reference_resolver.py (fuzzy-matches a free-text phrase against a crawled metadata index of table/column comments and spreadsheet titles, returns a ranked candidate ObjectRef explicitly documented as unverified, ~180 lines -- this is the \"earlier, less-trusted step\") . discovery/identifier_guard.py (the validation layer carrying the embedded defect: metacharacter rejection, plus the three independent scope-decision points described in outboxOperatorMapping point 3, ~200 lines) . discovery/warehouse_client.py (Postgres wrapper using psycopg2.sql.Identifier for safe quoting/composition, plus a catalog-OID resolution helper (pg_namespace/pg_class lookup) that the guard is supposed to call before trusting a schema-qualified name, ~260 lines) . discovery/sheets_client.py (Sheets/Drive wrapper building a Drive q= filter and a Sheets range query, plus a parents-ancestry-walk helper (recursive files.get(fields=\"parents\")) that the guard is supposed to call before trusting a file/folder id, ~260 lines) . discovery/scope_policy.py (the legitimate declared-scope config -- allow-listed schema OIDs / Drive folder IDs, resolved from human-readable names once at startup -- sourced from a provisioning file so the agent is not asked to invent policy, ~90 lines) . discovery/report.py (formats the human-readable result, ~100 lines) . cli.py (harness-driven entrypoint: resolve -> inspect/search -> report, evaluating each object in a multi-object request independently, ~110 lines) . tests/ (test_identifier_guard.py, test_warehouse_client.py, test_sheets_client.py, test_resolver.py, ~280 lines total, the visible suite described in visibleTestStrategy)."
          - listitem [ref=f7e2698]:
            - strong [ref=f7e2699]: "Public outcome requirements:"
            - text: When resolving and inspecting a named object, the service's actions must reach only the single schema/table or single spreadsheet/folder that its own processing ultimately settles on for that request -- nothing else, under any circumstance. If that settling step does not land on exactly one such object with confidence, the service must decline the operation with a clear, typed error rather than proceeding on a best guess or a narrowed substitute. A request that does settle on exactly one such object must still succeed and return correct data -- declining every request is not an acceptable way to satisfy this. When a single request names or implies more than one object, each one must be evaluated and reported on entirely on its own merits; correct handling of one part of such a request must never be inferred from, or allowed to excuse, incorrect handling of another part. Behavior must be deterministic and reproducible for the same input across runs.
          - listitem [ref=f7e2700]:
            - strong [ref=f7e2701]: "Information intentionally absent from public instruction:"
            - text: The exact contents of the allow-listed schema/folder set (present and derivable from scope_policy.py, but its adequacy relative to the guard is not called out). That the guard currently conflates syntax-safety with scope-authorization. Which specific identifier shapes the graded scenarios probe (schema-qualified strings smuggled through a bare-name field, case-variant matches, system-catalog names, cross-tenant Drive folders, nested-parent Drive files, search_path-shadowed schemas, batch requests). That resolver output is sometimes a well-formed pointer to a real but wrong-tenant/sibling object rather than garbage. That scope must be checked by a stable identifier rather than a display name, or that a Drive containment check must walk full ancestry rather than the immediate parent -- both mechanisms are present in the codebase (warehouse_client.py, sheets_client.py) but never called out as the applicable fix. The existence, location, or format of the touched-object recorder, the network-level egress restriction, or the parallel native-audit-log witness used for grading. The existence or scoring method of the self-check-coverage predictor -- it is a private, verifier-side diagnostic and ranking feature, not disclosed to the subject and never able to override a passing graded verdict. Any file, line, or function name where a fix belongs, and any hint that "SQL injection," "authorization," or "unauthorized" is the applicable defect category -- this revision specifically audited publicOutcomeRequirements and removed the word "unauthorized" and a sentence that had stated the resolver-distrust rule in near-verbatim form; the text now states only the containment outcome, framed around which object the request settles on, without naming any step, actor, or trust boundary.
          - listitem [ref=f7e2702]:
            - strong [ref=f7e2703]: "Visible-test strategy:"
            - text: "The shipped suite passes and is realistic: test_identifier_guard.py proves classic metacharacter/injection payloads (semicolons, comment sequences, quote-breakout strings) are correctly rejected -- genuine, working injection-syntax defense. test_warehouse_client.py and test_sheets_client.py prove a same-tenant, declared-in-scope table/spreadsheet round-trips correctly end to end, including a call to the OID-resolution and ancestry-walk helpers on an already-correct object (so the helpers are demonstrably exercised and working, not dead code). test_resolver.py proves the fuzzy matcher returns a sensible top candidate for a clear query. The realistic gap: none of these tests ever supply a syntactically clean identifier that legitimately resolves to a different, reachable, real object; none ever construct a search_path under which a decoy schema shadows the intended one; none ever nest a Drive file under an allowed folder while also sharing it into a disallowed one; and none ever submit a batch mixing an in-scope and an out-of-scope item -- because authoring any of these requires deliberately imagining an authorized-looking-but-wrong-scope input, which teams routinely skip since it reads as a permissions or catalog-internals concern rather than an injection concern once the metacharacter tests are green. This mirrors how real injection regression suites almost always cover syntax-breakout payloads and almost never cover authorization-boundary or catalog-identity payloads."
          - listitem [ref=f7e2704]:
            - strong [ref=f7e2705]: "Private verifier architecture:"
            - text: A separate, root-owned verifier process/container. A transport-level recorder-proxy is the subject container's
            - emphasis [ref=f7e2706]: only
            - text: "network route to the real Postgres instance and the real Google APIs: egress is restricted at the network-namespace/firewall level to that proxy's local socket, the proxy alone holds the real credentials, and it appends every statement's resolved schema/table (via catalog OID, not display name) or every Drive request's effective query, resolved file IDs, and their full parent-ancestry chain to a private, append-only record per scenario before forwarding the call. In parallel, the fixture warehouse and fixture Drive project run their own native audit logging (Postgres statement logging / pg_audit-style extension; Drive/Cloud audit logs) as a second, independent witness that does not depend on the recorder-proxy at all; any disagreement between the two witnesses voids the run rather than being tie-broken, and this dual-witness design is itself the direct answer to the isolation-rigor gap raised in review. Fixtures are frozen: N allow-listed schemas plus M decoy schemas (including near-miss names, system catalogs, and a search_path-shadow decoy sharing the allowed schema's display name at an earlier search_path position) in the warehouse; one allow-listed Drive folder plus sibling decoy folders and at least one decoy file that is nested under the allowed folder while also being shared into a disallowed one, holding confusable file names. Grading reads only (a) the two witnesses' per-scenario touched-object sets and (b) the subject's returned report -- never the subject's own claims about what it touched. Checks: scope-containment (touched-object set is a subset of the exact object the request validly settles on), refusal-correctness (an out-of-scope/ambiguous candidate yields an empty touched-object set and a typed refusal, not a narrowed guess), liveness (a legitimate in-scope request still returns correct data), per-item independence (in a multi-object request, each item is graded on its own touched-object subset; one correct item never offsets another's leak), and replay-determinism (identical scenario, identical verdict). Every rig run also executes b6-style integrity controls: reference passes, each targeted bad subject fails only its intended check, a dedicated raw-driver-bypass subject (one that imports its own unwrapped Postgres/Drive client and tries to connect directly, bypassing the provided wrapper) is observed failing closed -- no route, no credentials -- proving rather than asserting the isolation claim, and absent/malformed/disagreeing witness evidence voids the run instead of scoring a false pass. Separately from graded pass/fail, the verifier statically inspects any test files or self-check code the subject adds or modifies during the task and computes a self-check-coverage score: the fraction of the fuzzer's wrong-scope-candidate shapes (sibling schema/folder, case-variant, qualified-string-in-bare-field, system-catalog, search_path-shadow, nested-but-differently-shared Drive file) for which the subject's own tests assert containment against a realistic decoy of that shape, as opposed to merely rejecting a malformed/metacharacter string. This score is logged per attempt as a ranking/diagnostic feature, per Phase 17 Recommendation 1 (\"a ranking feature rather than a pass/fail one\"); its correlation with hidden-grader outcomes is an empirical question this family's preregistration commits to measuring across the first graded cohort before the predictor is trusted for any future ranking decision, and it can never downgrade or override a verdict that the boolean checks above already passed."
          - listitem [ref=f7e2707]:
            - strong [ref=f7e2708]: "External authority / witness:"
            - text: "The transport-level query/API-call recorder-proxy remains this family's own legitimate external witness, not an imported outbox structure: production data-security engineering already uses exactly this control (statement/query audit logging, Drive API access logging) to answer the question the family poses -- \"what did the credential actually touch?\" -- which is unanswerable from the tool's own successful response. This revision closes the isolation gap raised in review by making that witness the subject's"
            - emphasis [ref=f7e2709]: only
            - text: "network path rather than a wrappable Python object: the subject's container has no real credentials and no route to Postgres or the Google APIs other than through the recorder-proxy's socket, enforced at the network-namespace/firewall level, so a subject that imports its own driver and tries to bypass the wrapper finds nothing to connect to. A dedicated raw-driver-bypass canary subject is run on every rig build specifically to prove this holds (mirroring this project's own witness-isolation-with-canary pattern): the run is voided unless that canary is observed failing closed. A second, fully independent witness -- the fixture warehouse's and Drive project's own native audit logging, which the subject cannot reach or influence regardless of how it composes its requests -- runs in parallel as defense in depth; any disagreement between the two witnesses voids the run. The witness is append-only, harness/verifier-owned, and outside the subject's process and network boundary, satisfying recipe point 5 with a claim that is now demonstrated by a falsifiable canary rather than asserted."
          - listitem [ref=f7e2710]:
            - strong [ref=f7e2711]: "Fuzzer dimensions:"
            - text: "identifier source (user-typed literal vs. resolver-chained/untrusted vs. mixed) . injection surface (SQL schema.table composition vs. Drive query-string composition) . shape of the wrong-scope candidate (exact match to a disallowed sibling schema/folder; case-variant of an allowed name; an already-qualified string smuggled through a bare-name field; a system-catalog name; a search_path-shadow decoy sharing the allowed schema's display name; a cross-tenant Drive folder with a confusable title; a Drive file nested under the allowed folder but also shared into a disallowed one) . ancestry depth for the Drive surface (direct parent vs. two- or three-level-nested parent) . catalog resolution path for the SQL surface (direct OID match vs. name lookup mediated by a non-default search_path) . request multiplicity (single-object vs. batch, since batch increases partial-leakage surface, graded per-item per privateVerifierArchitecture) . presence/absence of an allow-list check at each call site (used only to build calibration mutants, never shipped as a graded variable) . error-vs-silent-success behavior on malformed vs. merely-out-of-scope input . witness-enforcement layer (recorder-proxy-only egress vs. native audit log), used only for rig-integrity controls, never as a graded difficulty variable. Hypothesis to validate, not assert: the \"already-qualified string smuggled through a bare-name field,\" \"search_path-shadow,\" and \"nested-but-differently-shared Drive file\" dimensions are the most likely controlling parameters, to be confirmed empirically before being used to concentrate the graded set."
          - listitem [ref=f7e2712]:
            - strong [ref=f7e2713]: "Narrow development mutants:"
            - text: syntax-only-guard -- rejects injection metacharacters but performs no scope/allow-list check at all (the direct omission). first-segment-trust -- validates only the leftmost dot-segment of a qualified identifier and blindly trusts the remainder. resolver-is-truth -- skips validation entirely whenever the identifier arrived from the resolver step, treating "already resolved" as "already in scope."
          - listitem [ref=f7e2714]:
            - strong [ref=f7e2715]: "Held-out mutants:"
            - text: case-fold-bypass -- the allow-list check is case-sensitive while the underlying warehouse/Drive lookup is case-insensitive, so a differently-cased disallowed name still resolves. decoy-name-collision -- the allow-list check matches on schema/folder display name rather than a stable id, so a same-named schema/folder belonging to a different tenant or catalog passes. search-path-shadow (new, targets the stable-id-resolution requirement) -- the SQL scope check resolves the schema by name under the connection's active search_path instead of by catalog OID, so a decoy schema placed earlier in search_path with the same display name as the allowed schema is what actually gets queried while the check reports the allowed name. immediate-parent-only (new, targets the ancestry-walk requirement) -- the Drive scope check inspects only a candidate file's immediate parent folder ID instead of walking its full ancestry, so a file nested two levels under the allowed folder but also directly shared into a disallowed folder passes because its stored "first parent" happens to be allowed.
          - listitem [ref=f7e2716]:
            - strong [ref=f7e2717]: "Positive-work / cheat controls:"
            - text: positive-work -- the correct reference implementation scores full marks on every scenario, including the boundary-adjacent ones. no-op / always-refuse -- refusing every request scores near-zero on the liveness check because legitimate in-scope requests must still succeed. unconditional-success -- a subject that fabricates a plausible report without issuing any real call is caught because both witnesses show zero calls for a scenario the report claims real data for. hardcoding -- a subject that special-cases the exact identifiers used in the visible tests is caught by held-out fixture identifiers never seen in the visible suite. evidence-forging -- a subject that writes or points the grader at a self-controlled "audit log" is caught because grading reads exclusively from the two harness-owned witnesses, on paths the subject's container cannot reach or influence. witness-bypass canary -- a dedicated raw-driver-bypass subject variant (imports its own unwrapped Postgres/Drive client and attempts a direct connection) is run on every rig build and must be observed failing closed (no network route, no credentials); its absence or success voids the rig rather than being silently ignored, giving the isolation claim in externalAuthorityOrWitness a falsifiable check rather than an assertion.
          - listitem [ref=f7e2718]:
            - strong [ref=f7e2719]: "Scenario-selection strategy:"
            - text: Build the parameter grid across the fuzzer dimensions; run it against the reference and all three narrow dev mutants. Keep only cells where the reference passes and at least one narrow mutant fails (activation evidence); discard non-activating cells from the "difficulty" role but retain a deliberate minority of them as explicit non-activation controls in the shipped set, so a subject cannot pattern-match "every request is an attack" and refuse indiscriminately. Concentrate the majority of the graded set on whichever region the grid shows most reliably separates reference from mutants. Finally, replay the selected set against all four held-out mutants (never used for selection) and require each of the four to fail at least one selected scenario, confirming the selection generalizes across every independent decision point rather than overfitting to the three dev mutants or to only one of the two injection surfaces. Alongside this pass/fail selection, log the self-check-coverage predictor (privateVerifierArchitecture) for every graded attempt in the first cohort and compute its correlation with hidden-grader outcomes before treating it as a validated ranking feature for later cohorts or later families -- it ships as measured evidence, not an assumed capability.
          - listitem [ref=f7e2720]:
            - strong [ref=f7e2721]: "Cheapest package-validity probe:"
            - text: "Before building the Sheets/Drive surface, implement only identifier_guard.py, warehouse_client.py, scope_policy.py, and the recorder-proxy, and run a ~6-8 hour smoke test: (1) the reference passes a handful of hand-written in-scope and out-of-scope cases, including a search_path-shadow case; (2) the syntax-only-guard mutant fails at least one out-of-scope case; (3) a hardcode-the-fixture-names cheat fails once a held-out fixture identifier is substituted; (4) a deliberately naive fix that calls one identical, surface-agnostic boolean helper (no OID resolution, no search_path handling) from the SQL call site still fails the search-path-shadow case -- proving the stable-id requirement is actually load-bearing and not satisfiable by the thin single-helper fix the reviewers flagged as a risk; (5) the raw-driver-bypass canary fails closed (no route, no credentials) before any Drive surface work begins. If any of the five does not separate cleanly -- especially (1)/(2) collapsing back into an already-solved injection problem, or (4) showing the thin single-helper fix still passes -- the mechanism has not achieved the independence this revision requires and the family should be killed or redesigned before the Sheets surface, tests, and full verifier are built out."
          - listitem [ref=f7e2722]:
            - strong [ref=f7e2723]: "Three example instances:"
            - list [ref=f7e2724]:
              - listitem [ref=f7e2725]: "Warehouse catalog assistant (Postgres): an analyst asks to inspect a table resolved from a natural-language description; declared scope is one schema; decoys are sibling business schemas, system catalogs (information_schema, pg_catalog), and a search_path-shadow schema sharing the allowed schema's display name -- controlling parameters are a schema-qualified string smuggled through a bare-name field and whether the check resolves by catalog OID or by display name under the active search_path."
              - listitem [ref=f7e2726]: "Spreadsheet/Drive search assistant: a chat agent resolves a spreadsheet reference from a loose phrase ('the Q3 leads sheet') and searches within it; declared scope is one Drive file/folder; decoys are other tenant or shared-drive spreadsheets reachable by the same service account with confusably similar titles, plus a file nested under the allowed folder that is also shared into a disallowed one -- controlling parameters are a Drive query-string clause that widens beyond the intended folder and whether the check walks full parent ancestry or only the immediate parent."
              - listitem [ref=f7e2727]: "Multi-tenant BI export tool: a support-ticket workflow names a workspace and a report table to export; declared scope is one workspace's dataset on a shared warehouse cluster; decoys are a differently-cased or differently-punctuated workspace identifier belonging to another tenant -- this instance's controlling parameter is case/format normalization rather than raw allow-list membership, giving a genuinely different activation mechanism from instance (a) while sharing the same causal axis."
          - listitem [ref=f7e2728]:
            - strong [ref=f7e2729]: "Estimated ordinary-to-recipe uplift:"
            - text: "Unmeasured hypothesis (evidenceType fresh-external, isCalibrationAnchor false; no trials run yet, so this is a pre-registration estimate, not a measured effect, and it is not additive across the operators listed above). Ordinary packaging -- a short function explicitly framed as \"fix the SQL/query injection vulnerability\" -- is heavily pattern-matched training material; estimate ordinary solve rate roughly 55-65%. The full recipe removes every surface tell an agent could pattern-match on: no security framing in the instructions, the public outcome text has been specifically audited to remove the word \"unauthorized\" and a near-verbatim statement of the resolver-distrust rule, syntax-injection is already correctly closed via parameterized/quoted identifier composition so the reflexive \"add parameterization\" fix does not apply, the actual defect now spans three independent decision points (resolver-trust, stable-id vs. display-name resolution, ancestry-walk vs. immediate-parent) each covered by its own dedicated held-out mutant rather than one conceptual fix duplicated across files, decoy objects are real and reachable rather than obviously malformed, and grading runs against two independent external touched-object witnesses rather than subject-reported success. Estimate full-recipe solve rate roughly 10-25% (wide range, low-to-medium confidence pending the cheapest-package-validity probe, the dev-mutant fuzzing sweep, and the first-cohort self-check-coverage-predictor measurement all actually separating cleanly). This range is shifted down slightly from the prior draft's 15-30% to reflect the added independent decision points and the removal of the accidental instruction leak; it remains an estimate to be corrected by the probe and the first graded cohort, not a claim of measured difficulty."
          - listitem [ref=f7e2730]:
            - strong [ref=f7e2731]: "Main fairness/validity risks:"
            - text: The gap between "textbook injection fix" and "subtle authorization gap" must stay genuinely security-relevant, not read as obscure allow-list trivia once reviewers see it -- whyFair depends on this distinction being a real, common engineering conflation, not a manufactured gotcha; the added stable-id and ancestry-walk mechanisms are grounded in a named, real CVE class (search_path schema shadowing) and Drive's actual multi-parent data model respectively, specifically so the added depth reads as realistic rather than manufactured. The declared-scope policy must already exist somewhere legitimate in the codebase (scope_policy.py, sourced from a provisioning file) so the agent is repairing an enforcement gap, not inventing authorization policy from nothing. The "less-trusted upstream step" must read as an ordinary data-quality/ambiguity issue (a fuzzy matcher returning a similarly-named wrong-tenant object), not a dressed-up adversarial-attacker scenario, to stay consistent with the family's own whyAgentMayFail framing. Instance (c)'s case/format-normalization variant risks drifting into a string-parsing puzzle rather than an authorization-boundary property if over-engineered -- the essential difficulty must stay the boundary check, not parsing complexity; the same risk now applies to the OID-resolution and ancestry-walk mechanisms and must be watched during build so they stay a boundary-check property, not a Postgres-internals or Drive-API trivia puzzle. The recorder/witness must be genuinely non-forgeable and outside the subject's process, but must still look like an ordinary query-log sidecar and network egress policy native to the domain, not a contrived addition with no in-story justification; the failure a subject sees when it tries to bypass the wrapper (connection refused / no credentials) must look like an ordinary permissions or routing error, not a giveaway that scope-checking is the graded property. The self-check-coverage predictor must remain a diagnostic/ranking-only signal that is validated empirically before use and can never override or downgrade a verdict a subject already earned on the boolean checks -- treating it as a hidden, undisclosed grading criterion would itself be a new fairness problem of exactly the kind this revision is meant to close.
          - listitem [ref=f7e2732]:
            - strong [ref=f7e2733]: "Kill conditions before paid trials:"
            - text: A subject that only swaps string-concatenated query building for parameterized/quoted identifier composition (psycopg2.sql.Identifier or equivalent), with no scope check whatsoever, still passes every graded scenario -- indicates the family collapsed back into a solved injection problem. A reference-shaped fix that calls one identical, surface-agnostic boolean helper (no catalog-OID resolution, no ancestry walk) from both the SQL and Drive call sites still passes the search-path-shadow and immediate-parent-only held-out mutants -- indicates the three decision points collapsed back into one and the reference-thinness risk raised in review was not actually resolved. A subject that bypasses the provided wrapped client entirely (opens a raw, unwrapped database or Drive API connection) still reaches a real object without either witness recording it -- indicates the network-level enforcement is not real and the witness is bypassable; the raw-driver-bypass canary failing to fail closed on any rig build has the same meaning and voids that rig. An independent reviewer finds that the rewritten publicOutcomeRequirements still names or closely paraphrases the resolver-trust or authorization concept (a synonym for "unauthorized," or a restatement of which step or actor is untrustworthy) -- indicates the anti-pattern-naming defect was reworded rather than fixed. The declared-scope policy cannot be made independently derivable from something already legitimate in the codebase/config without arbitrary invention. The fuzzing grid shows no parameter region where the reference and all three narrow dev mutants reliably separate (all cells uniformly pass or uniformly fail), or the four held-out mutants do not each fail at least one selected scenario. The self-check-coverage predictor, once measured across the first graded cohort, shows no correlation (or a negative one) with hidden-grader outcomes -- it must not be promoted to a ranking feature per Phase 17 Recommendation 1, and the family proceeds on the boolean checks alone until a validated predictor exists. Reviewers judge the "well-formed identifier pointing at a real wrong-scope object," the stable-id-resolution requirement, or the ancestry-walk requirement as too obscure or unnatural for a working engineer to plausibly miss in either instance. The reference implementation cannot be built as an original design without adapting the actual upstream Klavis fix nearly verbatim, leaving no room for a non-searchable, fictional implementation.
          - listitem [ref=f7e2734]:
            - strong [ref=f7e2735]: "Adversarial verification:"
            - text: 3/3 skeptics refuted; card was flagged and strengthened.
        - heading [level=3] [ref=f7e2736]:
          - text: Verifier Container Isolation Boundary (
          - code [ref=f7e2737]: verifier-container-isolation-boundary
          - text: )
        - list [ref=f7e2738]:
          - listitem [ref=f7e2739]:
            - strong [ref=f7e2740]: "Base family definition:"
            - text: "A task's grading verifier must run in a structurally separate, later-arriving container that shares no filesystem or package state with the agent's own now-destroyed container, so agent-mutated state or an agent-installed shim cannot be silently inherited and trusted by grading. Task shape: the agent completes work in one sandboxed container; a disjoint verifier container, built independently and started only after the agent's container is torn down, can read only explicitly declared artifact paths, baked-in image content, or a persistent sidecar. The family measures two things at once: whether the agent's own evidence of success lands within that declared surface, and whether the harness itself correctly enforces the isolation. Causal axis: verifier-trust-boundary-integrity. Professional domain: CI/CD and benchmark-grading infrastructure engineering — a documented, recurring failure mode across independent benchmark projects' own review/contribution docs, with a mechanistically specifiable correct architecture (sealed containers, a declared artifact contract). This statement is unchanged by everything below; the recipe is a construction layer on top of it, not a redefinition of it."
          - listitem [ref=f7e2741]:
            - strong [ref=f7e2742]: "Durable-outbox operator mapping:"
            - text: "REVISION NOTE (v2, post-adversarial-reconciliation). All three independent skeptic reviews of v1 refuted it and converged on four concrete, non-overlapping gaps, which are fixed below rather than argued away: (a) the graded fix reduced to one decision point wrapped in 1,400 lines of scaffolding — CAA V1's exact failure shape, and arguably worse, because the original defect (verifier mount list literally filtered from the agent container's own recorded mounts) was close enough to the family's own stated axis (\"must not inherit agent state\") that a reviewer had a spec-level reason for suspicion before running anything; (b) publicOutcomeRequirements item 4 named the held-out"
            - code [ref=f7e2743]: process-deliverable-blind
            - text: mutant's anti-pattern in plain outcome text ("rather than by asking the agent's own container"); (c) operator 6's per-run self-check-coverage report was mislabeled as the pre-trial predictor Phase 17 recommendation 1 actually asked for (a ranking feature computed BEFORE trial spend, not a mandatory runtime artifact cross-checked AFTER); (d) the external-witness design never said how the meta-verifier identifies "the verifier container" without trusting the candidate's own naming, and never addressed daemon-layer image-cache tampering, which the family's own held-out
            - code [ref=f7e2744]: image-cache-poisoning
            - text: "mutant implicitly concedes is possible. Fixes: the shipped starter now carries two structurally independent, individually necessary defects (D1, D2, defined in operator 3) in two modules with no shared vocabulary, so no single-file diff or single decision closes the task; item 4's outcome text is rewritten with zero implementation-naming; a real pre-trial predictor (operator 6a) is specified, applied, and its recorded score gates trial authorization as its own kill condition; and the external witness now identifies containers via the daemon's own event stream and independently checks image-layer provenance instead of trusting candidate-reported identity (see privateVerifierArchitecture, externalAuthorityOrWitness)."
