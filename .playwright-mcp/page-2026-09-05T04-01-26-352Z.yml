            - code [ref=f7e2614]: a2-explicit-terminal-state-repair
            - text: "'s literal ACKED/REVOKED vocabulary has no analog; its underlying idea (state explicitly which outcomes are terminal versus retryable) is retained and re-targeted at the reject-reason taxonomy, documented in an agent-visible POLICY.md. Separately: this family does not need an artificial append-only \"outbox table\" bolted onto its synchronous path, because FHIR already discloses per-entry outcome in-band in the nested response Bundle. One addition made in this revision, decisionLog.ts, is likewise not a second"
