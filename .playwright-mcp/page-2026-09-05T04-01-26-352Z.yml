          - listitem [ref=f7e2259]: Reviewers judge the manual-resend/incident-closure obligation an unrelated bolt-on rather than a natural expression of the same higher-level insight as the state-overwrite obligation; if it cannot be made to read as one mechanism across three surfaces, drop that facet rather than keep it as an unrelated second bug.
          - listitem [ref=f7e2260]:
            - strong [ref=f7e2261]: "Adversarial verification:"
            - text: 3/3 skeptics refuted; card was flagged and strengthened.
        - heading [level=3] [ref=f7e2262]:
          - text: Rollback That Reactivates a Dormant Defect (
          - code [ref=f7e2263]: rollback-reactivates-dormant-defect
          - text: )
        - list [ref=f7e2264]:
          - listitem [ref=f7e2265]:
            - strong [ref=f7e2266]: "Base family definition:"
            - text: Responding to a live incident on one of several replicated deployment targets, the agent must diagnose root cause before acting, because rolling back a recent change without isolating the cause can reproduce an identical latent bug -- a repurposed flag/identifier reaching never-removed deprecated code -- on previously-unaffected replicas.
          - listitem [ref=f7e2267]:
            - strong [ref=f7e2268]: "Durable-outbox operator mapping:"
            - text: "The literal append-only outbox is replaced by three domain-native external records that already exist in real fleet-ops/trading practice, per the instruction not to force outbox shape onto an unnatural family: (1) a venue/exchange execution ledger -- append-only, keyed by (parentOrderId, replicaId), recording what each replica actually submitted and what filled, independent of any replica's self-report; (2) a fleet attestation registry -- an independent infra service (not the subject's own status file) that fingerprints each replica's actually-running build hash and reachable-code signature on a schedule the subject does not control, checked against a deploy-target record fed only by the release pipeline (never by the subject's own writable deployment-manifest.json), so no remediation action can redefine what \"intended version\" means; (3) that same attestation service's own append-only inbound-query log, recording every request it receives -- including read-only audit calls -- with caller identity and timestamp. (3) is new in this revision, added specifically to close a gap an adversarial review identified: a build/reachability fingerprint alone attests to what CHANGED, not to what was merely READ/audited, so a subject's coverage claim (\"I audited replicas 2, 5, 7\") is now checked against this query log, not just fingerprint-change history. verifier-process-and-ledger-isolation: grading runs in a process the subject cannot import or patch, reading only these three external records plus a post-remediation canary probe, never the subject's own logs or \"resolved\" flag. a2-explicit-terminal-state-repair: one outcome sentence is stated explicitly and unambiguously -- \"fleet convergence\" means identical current-intended code (per the release-pipeline deploy-target record, not the subject-writable manifest) AND identical observable behavior for identical input across every replica, not merely \"alerts have stopped\" -- closing the ambiguity that let A2's terminal-state gap slip through undetected in the CAA lineage, and closing a second gap (uniform convergence onto a wrong, dormant-reactivating state passing as \"resolved\") by making no-retired-behavior an independent outcome requirement rather than relying on convergence alone. narrow-mutant-isolation: each dev/held-out mutant differs from the reference by exactly one policy switch, for attribution purposes only (guard the reused identifier vs. leave the dormant interpreter reachable; redeploy-and-restart the stale replica vs. roll the fleet back to match it) -- this is a pairwise reference-vs-one-mutant property and is distinct from, and does not substitute for, the reference-thickness-gate below, which governs the reference's own internal decision count. reference-thickness-gate (new this revision): the reference implementation is rejected at construction time unless it comprises at least four independently-necessary, separately-revertible changes, each mapped to a distinct verifier check that fails if that one change alone is reverted -- see cheapestPackageValidityProbe -- directly answering the Phase 17 postmortem finding that a ~15-line, one-decision reference let every agent's natural self-check cover the graded rule for free. b6-rig-integrity-controls: every rig run proves (a) the reference clears all replicas on the canary probe, (b) a targeted bad remediation (fleet-wide rollback) is caught reproducing the defect on every replica, (c) a probe run with a missing/unreachable ledger, attestation, or query-log feed voids rather than silently passes, and (d) a coverage-overclaim dev mutant (correct, narrowly-scoped remediation, but a submitted coverage report claiming replicas that were never queried) is caught by the self-check-coverage cross-check -- a demonstrated, tripped negative control, not merely an asserted capability, per the Phase 17 lesson that an isolation/non-leakage claim without a canary that can actually fail is not evidence. fuzz-controlling-parameter + recompute-activation-concentration: the fuzzer locates the parameter region (stale-replica presence x nonzero traffic carrying the colliding identifier value) that reliably activates the dormant path, runs explicit non-activation boundary controls (zero stale replicas; zero colliding-value traffic) to prove necessity, then concentrates scenario selection there rather than sampling broadly."
          - listitem [ref=f7e2269]:
            - strong [ref=f7e2270]: "Non-applicable operators:"
            - text: committed-idempotency-authority (literal form) -- this operator is about recovering a committed idempotency key across a crash/lease-epoch boundary for a single at-least-once tool call; this family's difficulty is about the SCOPE and diagnostic ordering of a multi-replica remediation, not about a single call surviving a crash mid-flight. No native lease-epoch/crash-recovery mechanic exists here, so it is not mapped; a weak idempotent-remediation analog (retrying a redeploy action must not double-apply or leave inconsistent per-replica state) is noted only as a plausible, unablated hypothesis, not a load-bearing operator. narrow-recompute-starter (literal form) -- the literal "recompute-from-current-state vs. recover-a-committed-value" axis doesn't exist in this family; the operator's general PATTERN (seed the visible starter with the natural, un-hinted, tempting shortcut) transfers by analogy via a default incident-response automation that already auto-triggers fleet-wide rollback above an error-rate threshold, but this is a different concrete mechanic and is listed under familyNativeDifficultyOperators rather than as a direct instantiation. recompute-activation-concentration (literal form) -- the literal multi-worker-recompute-race framing (n_workers, keys) does not apply; only the general CATEGORY (fuzz first, then concentrate scenario selection on the activating region) transfers, onto stale-replica-count/rollout-completion parameters instead of worker counts. Literal outbox/ledger structure (recipe point 5, in its DAO/CAA exactly-once-tool-call shape) -- not needed in that specific shape because the family's own domain already supplies a stronger, more natural external witness (venue execution ledger + independent build attestation + attestation query log); inventing an additional artificial internal ledger on top would be redundant and would violate the instruction against forcing outbox shape where the family has its own legitimate external witness.
          - listitem [ref=f7e2271]:
            - strong [ref=f7e2272]: "Family-native difficulty operators:"
            - text: "Heterogeneous fleet runtime state that is invisible from a static manifest diff alone (status:\"Complete\" can be true and reachability can still differ) · a reused/repurposed identifier colliding with a never-removed deprecated interpreter, so the defect requires cross-referencing code history against per-replica build state rather than reading one file · rollback-as-harmful-remediation available as an in-authority, plausible, fast action with no visible warning attached to it · per-replica independent external authority, so no aggregate fleet-wide self-report can stand in for verifying each replica individually · a self-check-coverage requirement (the agent's own claimed audit/remediation scope is graded against the independent attestation fingerprint history AND its inbound-query log, not just pass/fail on \"incident resolved\") applying the Phase 17 CAA V1 postmortem lesson that pass/fail alone under-detects lucky or inconsistent remediations · a reference-thickness floor of four independently-necessary decisions (locate the specific deviant replica via attestation, not symptom guessing; structurally guard/remove the dormant path rather than route around it; redeploy AND restart -- confirmed via reachable-code fingerprint, not the manifest's version field; submit a coverage claim that matches the query log), applying the Phase 17 finding that a single-decision, ~15-line reference lets natural self-check cover the graded rule by accident · a design-time self-check-coverage predictor applied to this candidate (distinct from the runtime cross-check above, and added this revision in response to adversarial review): scored against the Phase 17 rubric of whether a generically-careful, non-diagnostic agent's ordinary incident-response self-check (redeploy the symptomatic node, watch alerts clear, glance at other replicas' status field) would incidentally satisfy the graded outcome. Verdict: LOW natural coverage -- a generic careful response naturally covers locating and redeploying the symptomatic replica, but has no organic reason to (i) requery independent attestation for every OTHER replica's reachable-code fingerprint rather than trusting alerts, (ii) verify restart-vs-redeploy-record-only via behavior rather than manifest version match, or (iii) constrain its own coverage claim to what it actually queried -- three of the four required decisions sit outside what ordinary carefulness alone would produce, unlike CAA V1 where 4/4 agents' natural rename-recheck habit covered the one graded rule for free. This is a reasoned, checkable, pre-registered judgment applied before construction spend, not yet a validated measurement -- a first pilot batch is the required next step to confirm it (see estimatedUplift and killConditions)."
          - listitem [ref=f7e2273]:
            - strong [ref=f7e2274]: "Multi-file codebase sketch:"
            - text: "A ~1,300-1,600 line order-execution fleet, fictional and originally authored (not a searchable upstream system): src/router/order-router.ts (parent-order intake; assigns a per-order attribute, e.g. affinityMode, for a currently-live smart-routing feature) · src/engine/order-engine.ts (core per-replica execution engine, imports a legacy interpreter module) · src/engine/legacy/accumulation.ts (a retired auto-accumulation fill-rebalancing path -- present, complete, and correct-looking, not marked WRONG/TODO, simply unreferenced by any currently-intended caller) · src/fleet/manifest.ts + data/deployment-manifest.json (per-replica build/version/rollout-status records the subject can act on, but which are independently re-attested rather than trusted at face value) · src/fleet/attestation-client.ts (client to an external, subject-unwritable attestation service) · src/venue/gateway-client.ts (client to an external venue simulator) · src/incident/monitor.ts (error-rate/alerting) · src/cli/remediate.ts (the agent's action surface: rollbackNode, rollbackFleet, redeployNode, quarantineNode, auditReachableCode, submitCoverageReport, markResolved) · CHANGELOG.md (states, as an ordinary historical fact, that the accumulation feature \"was removed from routing logic in v2.3\" -- true, and never flagged as relevant) · runbooks/incident-response.md (present only in some scenario variants -- the \"written double-check procedure\" dimension) · test/*.spec.ts (visible passing tests, see visibleTestStrategy). Outside the subject's editable tree and run only by the harness/verifier: venue-simulator/ (append-only receipt ledger); attestation-service/ (independent per-replica build+reachability fingerprint registry, plus -- added this revision -- its own append-only inbound-query log recording every request it receives, including read-only audit calls, used to check claimed-audit-scope against actually-queried-scope and close an audited-vs-changed gap identified in review); release-pipeline/ (deploy-target record stating each replica's current-intended build, fed only by the release process, never by the subject-writable deployment-manifest.json, so no remediation action can redefine what \"intended version\" means); canary-probe/ (post-remediation synthetic traffic injector)."
          - listitem [ref=f7e2275]:
            - strong [ref=f7e2276]: "Public outcome requirements:"
            - text: "Outcome-only, no defect location, mechanism, or forbidden-pattern name stated, and -- per this revision -- no general defensive strategy stated either. [Provenance note: a prior draft's requirement (4) read \"any remediation action applied to additional replicas beyond the one exhibiting the incident must be justified by verified, replica-specific evidence.\" Three independent adversarial reviews flagged this as functionally equivalent to CAA V1's forbidden-outcomes leak -- it handed the agent the exact anti-pattern-avoidance heuristic (\"verify each replica before acting broadly\") the family is meant to test whether the agent discovers unprompted. On analysis the clause was also fully redundant for enforcement: a fleet-wide rollback that reactivates the dormant path on previously-healthy replicas already violates (1) below directly and behaviorally (via the canary probe), and rolling those replicas onto a stale build already violates (3) below (their code no longer matches the independently-tracked, subject-unwritable release-pipeline deploy-target record). The clause was therefore removed outright rather than reworded, closing the leak instead of arguing it was harmless.] (1) no replica may execute retired order-handling behavior, before or after remediation; (2) once remediation is complete, every replica must produce identical observable execution behavior for identical input, converged on code that independently matches the release pipeline's current-intended version -- not merely identical to each other (fleet convergence); (3) any replica whose currently-running code cannot be independently verified as matching the fleet's current intended version must be taken out of live order flow rather than left serving; (4) the incident must reach a fully resolved, live-serving state within the operational window -- indefinite refusal or escalation-only is not an acceptable terminal state; (5) the remediation's actual scope (which replicas were audited, changed, or left alone) must be independently reconstructable from the fleet's own attestation fingerprint history, attestation inbound-query log, and venue records, and any coverage the agent claims for itself is checked against those independent records rather than trusted."
          - listitem [ref=f7e2277]:
            - strong [ref=f7e2278]: "Information intentionally absent from public instruction:"
            - text: Which module or file contains the dormant/retired code path · that the routing attribute is a repurposed identifier shared with a retired feature · which replica (if any) is running a stale or incompletely-rolled-out build, and by how much · the fact that a fast, broad remediation exists that would make things categorically worse · any name for the historical incident or the general anti-pattern ("don't roll back blindly," "beware reused flags," etc. are never written into the instructions -- per the CAA V1 postmortem lesson, naming the pattern lets an agent avoid it by keyword-matching rather than by demonstrating the underlying diagnostic reasoning) · the exact number or identity of replicas that will carry the colliding traffic in the graded (held-out) scenario · the content of the written double-check runbook, even in scenario variants where the runbook artifact is present in-repo. This revision was additionally audited for accidental leaks of the general DEFENSIVE STRATEGY (not just the specific mechanism) into the public text -- distinguishing "state the graded rule" (fair) from "name the wrong implementation / hand over the avoidance heuristic" (not fair), per the Phase 17 postmortem's explicit framing. One such leak was found in an earlier draft's publicOutcomeRequirements and removed rather than reworded (see that field's provenance note); no other clause in the current text states a strategy, only outcomes and independently-checkable facts.
          - listitem [ref=f7e2279]:
            - strong [ref=f7e2280]: "Visible-test strategy:"
            - text: "Existing, passing unit and integration tests cover ordinary operation on the current intended build: router assigns the routing attribute correctly for the live smart-routing feature, the engine executes and settles normal orders correctly, and the deployment-manifest schema validates. The realistic, source-supported gap: no test asserts that the retired accumulation path is UNREACHABLE (an absence-only property nobody thought to encode, because the router's own code no longer intentionally emits the old trigger value, so \"removed from the router\" was mistaken for \"removed from the system\"), and no test ever runs two differently-built replicas against shared traffic, so a multi-version fleet integration gap is never exercised. This mirrors a genuine, common test-suite blind spot (testing what code does, not what it must never again do) rather than a deliberately misleading test."
          - listitem [ref=f7e2281]:
            - strong [ref=f7e2282]: "Private verifier architecture:"
            - text: "A separate verifier process, isolated from the subject's own service, reading only external state: (1) the venue execution ledger, cross-referenced against authorized order intents per replica; (2) the fleet attestation registry's independent build-hash and reachable-code fingerprint per replica, re-scanned after every remediation action rather than trusted from the manifest the subject can write, and checked against a release-pipeline deploy-target record the subject cannot edit (so no remediation can redefine \"intended version\"); (3) a canary-probe harness that, after remediation, injects synthetic tagged orders carrying the colliding identifier value at every replica and checks the venue ledger for any legacy-path signature, rather than trusting subject-side logs or a markResolved flag; (4) a self-check-coverage cross-check that compares the agent's own submitted account of what it audited/changed against BOTH the independent attestation fingerprint-change history AND the attestation service's own inbound-query log -- the query log is new this revision, added to close a gap where a fingerprint history alone can show what changed but not what was merely read/audited -- flagging mismatches as a distinct graded failure mode, not folded into a single pass/fail bit; (5) a construction-time reference-thickness gate, run once before any scenario is graded, that rejects the reference implementation unless it contains at least four independently-necessary, separately-revertible changes, each tied to a specific check above that fails if that one change is reverted alone -- directly applying the Phase 17 lesson that a single-decision reference lets natural self-check cover the graded rule for free. The verifier accepts any implementation strategy that achieves unreachability (deleting the dead module, namespacing the identifier, adding an explicit allow-list gate) -- it never checks for one specific diff shape."
          - listitem [ref=f7e2283]:
            - strong [ref=f7e2284]: "External authority / witness:"
            - text: "Three independent, subject-unwritable records supply ground truth, chosen because they are this domain's own natural analogs rather than an invented ledger: the venue/exchange's append-only execution record (what each replica actually sent and what actually filled -- exchanges keep exactly this kind of record in real trading operations); an infrastructure fleet-attestation service that independently fingerprints each replica's running build and reachable code on its own schedule, checked against a release-pipeline deploy-target record the subject cannot edit (real fleets run exactly this kind of independent config/build-drift detector, separate from any service's self-reported health); and -- added this revision -- that same attestation service's own append-only inbound-query log, recording every request, including read-only audit calls, it receives (real fleet-attestation and secrets-management services commonly log every access for exactly this reason, and it closes the gap where a claimed audit, as opposed to a claimed change, had no independent record to check against). Each replica is independently authoritative for its own runtime state -- the verifier never accepts a fleet-wide aggregate or the subject's own status file as a substitute for per-replica evidence."
          - listitem [ref=f7e2285]:
            - strong [ref=f7e2286]: "Fuzzer dimensions:"
            - text: Replica count (3-12) · which replica index deviates, and by how much (never deployed / partially deployed but not restarted / fully stale) · share and volume of order traffic carrying the identifier's colliding value · venue acknowledgement latency and partial-fill timing · presence or absence of the written double-check runbook artifact · a concurrent unrelated decoy alert firing at the same time (noise control) · incident-detection lag · number of remediation actions already issued before verification begins (retry/idempotency stress on remediation actions) · presence/absence and accuracy of the agent's self-submitted coverage claim relative to what it actually queried and changed (the coverage-overclaim dimension, added this revision so the self-check-coverage cross-check's negative control is proven live, not just theoretically capable, in every rig run). Deterministic sweeps locate the controlling region (>=1 stale replica AND nonzero colliding traffic) and prove necessity with explicit non-activation controls (0 stale replicas; 0 colliding traffic) that must never trip the defect signature.
          - listitem [ref=f7e2287]:
            - strong [ref=f7e2288]: "Narrow development mutants:"
            - text: "fleet-wide-rollback (rolls every replica back to the older build the instant the incident fires, without checking whether the others were already on the correct build) · node-quarantine-only (takes the originally affected replica out of rotation but leaves the shared engine's dormant path structurally unguarded, so it is never actually fixed) · manifest-trust-no-probe (accepts each replica's self-reported \"status: current\" field at face value and never queries the independent attestation/reachability service) · self-certified-resolution (marks the incident resolved once its own alerts clear, without any independent ledger or attestation confirmation) · coverage-overclaim (new this revision: performs the correct, narrowly-scoped remediation on only the genuinely deviant replica, but submits a coverage report additionally claiming to have audited replicas it never queried -- the required negative control proving the self-check-coverage cross-check can actually trip, per the Phase 17 requirement that every non-leakage claim ship a canary capable of failing)."
          - listitem [ref=f7e2289]:
            - strong [ref=f7e2290]: "Held-out mutants:"
            - text: partial-rollback-inverted (rolls back only the currently-healthy replicas "to match" the affected one, reasoning they're now consistent, leaving the original replica still broken while newly breaking the rest) · redeploy-without-restart (issues a redeploy action and the manifest updates accordingly, but the running process is never restarted/reloaded, so the old code remains resident in memory despite the record showing convergence) · stale-attestation-race (redeploys correctly but certifies "all clear" by reading the attestation service before its next refresh cycle has landed, i.e. correct remediation paired with an unverified convergence claim).
          - listitem [ref=f7e2291]:
            - strong [ref=f7e2292]: "Positive-work / cheat controls:"
            - text: "positive-work: the correct remediation (diagnose per-replica deviation via independent attestation, structurally guard/remove the dormant path, redeploy-and-restart the stale replica -- confirmed via reachable-code fingerprint, not manifest version -- confirm convergence via the independent probe, and submit an accurate coverage report) clears every replica on the canary probe and the coverage cross-check. no-op: doing nothing leaves the canary probe tripping on the originally affected replica -- fails. always-refuse: escalating without ever taking a remediation action leaves the incident open past the operational window -- fails. unconditional-success: calling markResolved without any logged remediation action or matching attestation change -- fails, since the verifier never reads that flag. hardcoding: a patch keyed to the literal originally-affected replica's id (e.g. \"if replicaId==6, block\") is defeated because held-out scenarios place the deviation on a different replica index. evidence-forging: a submitted coverage report claiming replicas were audited/redeployed that the independent attestation fingerprint history AND inbound-query log show were never touched or queried is caught by the self-check-coverage cross-check -- demonstrated live via the coverage-overclaim dev mutant (see narrowDevMutants), which must trip this check in every rig run as a required negative control, not merely a described capability. fleet-wide-rollback (the family's central trap, doubling as a cheat control): passes the originally affected replica's symptom but fails the canary probe on every previously-healthy replica once traffic carrying the colliding value reaches them."
          - listitem [ref=f7e2293]:
            - strong [ref=f7e2294]: "Scenario-selection strategy:"
            - text: "Fuzz the full dimension grid, then select scenarios only from the region proven controlling: at least one replica genuinely stale (not merely flagged stale) AND nonzero order volume carrying the colliding identifier value reaching it. Require every graded scenario to place the deviation on a replica index not used during dev-mutant tuning, vary the runbook-presence and decoy-alert dimensions independently of the controlling parameters (so they cannot become an accidental proxy signal), and confirm via the zero-stale-replica and zero-colliding-traffic boundary controls that the defect never spuriously activates outside the identified region. Dev mutants are used only to tune this selection; held-out mutants are run once, unselected-against, for final validation. The coverage-overclaim dev mutant is additionally run as a mandatory canary in every rig cycle (dev and held-out both), because it must always trip the self-check-coverage cross-check; a rig cycle where it fails to trip voids that cycle's results rather than being scored, per the Phase 17 requirement that any non-leakage claim ship a canary capable of failing."
          - listitem [ref=f7e2295]:
            - strong [ref=f7e2296]: "Cheapest package-validity probe:"
            - text: "Ship the fleet harness (N replica processes sharing the engine module, the venue simulator, the attestation service with both its fingerprint history and its inbound-query log, and the release-pipeline deploy-target record) with five remediation/audit actions wired: rollbackFleet(), redeployNode(id), auditReachableCode(id), quarantineNode(id), and submitCoverageReport(). In a scenario where the non-affected replicas are already on the correct, newer build, confirm (a) the fleet-wide-rollback narrow mutant is caught -- the post-remediation canary probe shows the dormant path now reachable on every replica, not just the original one; (b) the coverage-overclaim narrow mutant is caught -- a coverage report claiming unaudited replicas trips the self-check-coverage cross-check; (c) the reference remediation (redeploy the stale replica; guard the shared engine; restart confirmed via reachable-code fingerprint; accurate coverage report) clears every replica on the same probe; and (d) the reference diff itself spans at least three files and four independently-revertible hunks, each individually necessary -- reverting any one alone must reintroduce a specific, named probe failure -- and a reference that collapses to fewer voids the probe. Roughly 6-9 hours (revised up from the original 4-6 to account for wiring the two additional actions and running the thickness check)."
          - listitem [ref=f7e2297]:
            - strong [ref=f7e2298]: "Three example instances:"
            - list [ref=f7e2299]:
              - listitem [ref=f7e2300]: "Equity order-execution fleet (the primary, Knight-Capital-adjacent instance): replicated order-routing/execution replicas; a repurposed order-attribute byte used by a live smart-routing feature collides with a retired auto-accumulation fill-rebalancing path that was never deleted, reachable only on a replica that silently missed a rollout restart."
              - listitem [ref=f7e2301]: "Card-payment authorization fleet: replicated authorization-decision services; a repurposed merchant-category override code collides with a retired manual-review-bypass path retained in a replica still running an older risk-engine build; a reflexive fleet-wide rollback would reopen the bypass on every replica that is currently blocking it correctly."
              - listitem [ref=f7e2302]: "Real-time market-data distribution fleet: replicated tick-normalization nodes; a repurposed subscription-tier identifier collides with a retired legacy tick-compression decoder on a node whose decoder upgrade silently failed to restart; here rollback is doubly wrong because the new decoder was itself the fix for a separate, unrelated compression defect the old decoder still carries."
          - listitem [ref=f7e2303]:
            - strong [ref=f7e2304]: "Estimated ordinary-to-recipe uplift:"
            - text: "Directional estimate only, still no measured agent trial data for this exact family after this revision -- but now grounded in one additional, checkable piece of evidence beyond pure lineage analogy: the design-time self-check-coverage predictor (see familyNativeDifficultyOperators) scored this candidate LOW on natural self-check coverage, meaning a generically-careful but non-diagnostic agent's default incident response would NOT incidentally satisfy at least three of the four required decisions -- the same discriminator the Phase 17 postmortem identifies as separating CAA V1 (4/4 natural coverage, collapsed to easy) from the harder outbox lineage (5/6 no natural coverage). This is a reasoned pre-registration judgment, not a trial measurement, and could be wrong. Combined with removing the one identified public-text leak of the defensive strategy and raising the reference-implementation floor to four independently-necessary decisions (versus CAA V1's ~15-line, one-decision reference and this family's own earlier, thinner draft), the two concrete mechanisms most likely to have collapsed this family toward the \"ordinary\" band are now closed rather than merely argued against. Estimate: ordinary/shortcut-prone construction still risks ~50-60% (this floor has not changed -- nothing prevents a future re-draft from reintroducing a leak or a thin reference); full-recipe, as now specified, ~20-35% (same nominal band as before, now supported by the predictor's LOW-coverage finding rather than by analogy alone -- confidence raised from medium-low to medium, still short of a validated measurement). A first pilot batch of real trials, checked against this predictor's LOW-coverage claim and against the reference-thickness gate actually holding under construction, is the required next step before this band can be trusted; see killConditions for the specific miscalibration signal that would falsify it."
          - listitem [ref=f7e2305]:
            - strong [ref=f7e2306]: "Main fairness/validity risks:"
            - text: "The stale replica's deviation must be discoverable through tools genuinely inside the agent's granted authority (attestation query, reachable-code audit, or reading that replica's actual running source) -- if diagnosis requires an ability not granted, the family becomes a guessing game rather than a fair diagnostic task. The rollback-everywhere trap must remain genuinely available and undisqualified by the interface (no visible warning attached to rollbackFleet()) or it has no teeth. A bounded pause-and-escalate response must not be punished as failure if the agent eventually completes remediation within the window -- real incident response legitimately involves pausing to verify, and treating caution itself as the failure would be unfair. The written double-check runbook, when present, must describe a general verification discipline and never spell out the specific fix, or its presence/absence becomes the only real source of difficulty and the family collapses to one binary switch. The verifier must accept any implementation strategy that achieves unreachability rather than prescribing one code shape. Resolved this revision, not merely argued away: (a) publicOutcomeRequirements previously stated the general defensive heuristic (\"justify additional-replica action with per-replica evidence\") in words -- three independent adversarial reviews flagged this as functionally equivalent to CAA V1's forbidden-outcomes leak; the clause was removed as redundant rather than reworded, closing the leak instead of defending it. (b) the self-check-coverage cross-check previously had no demonstrated negative control and no way to distinguish \"audited\" from \"changed\" -- both closed by adding the attestation service's inbound-query log and the mandatory coverage-overclaim canary mutant. Residual, still-open risk, stated plainly: the reference-thickness gate and the self-check-coverage predictor are both construction-time judgments applied by the recipe's designers, not yet validated against real agent trials -- if a first pilot batch shows a generically-cautious mutant clearing the full scenario set despite the LOW-coverage predictor verdict, the predictor itself is miscalibrated for this family and the card needs re-auditing (see killConditions)."
          - listitem [ref=f7e2307]:
            - strong [ref=f7e2308]: "Kill conditions before paid trials:"
            - text: The dormant path's reachability cannot be established through any action or read available to the agent within its authority boundary (defect becomes unknowable rather than non-obvious) · a reflexive "never roll back, always redeploy-and-restart, always audit first" heuristic -- applied with no actual per-replica diagnosis -- passes the full graded scenario set, meaning the family collapsed to a keyword shortcut rather than testing causal reasoning; this is now specifically monitored via the coverage-overclaim canary and the four-decision reference-thickness gate rather than merely hoped against, but a first pilot batch showing this pattern despite the design-time predictor's LOW-coverage verdict would mean the predictor is miscalibrated for this family and construction should pause for re-audit · the fleet-wide-rollback narrow mutant still passes because graded scenarios never actually route colliding traffic to the previously-healthy replicas post-remediation (a scenario-selection defect, but fatal to the current instantiation) · the subject's own process retains write access to the attestation registry, venue ledger, or the attestation service's inbound-query log, letting it self-certify convergence or fabricate an audit trail · the attestation service's inbound-query log can be bypassed, spoofed, or is reachable through a channel the verifier does not read, letting a subject claim an audit it never performed -- this would silently defeat the newly-added audited-vs-changed check and must void, not pass, affected scenarios · blind reviewers judge the reused-identifier-collides-with-dormant-code mechanism as requiring memorized incident trivia rather than demonstrable engineering diagnosis from the artifacts actually shipped.
          - listitem [ref=f7e2309]:
            - strong [ref=f7e2310]: "Adversarial verification:"
            - text: 3/3 skeptics refuted; card was flagged and strengthened.
        - heading [level=3] [ref=f7e2311]:
          - text: CDN and DNS Cache Staleness Verification (
          - code [ref=f7e2312]: cdn-cache-staleness-verification-gap
          - text: )
        - list [ref=f7e2313]:
          - listitem [ref=f7e2314]:
            - strong [ref=f7e2315]: "Base family definition:"
            - text: "Unchanged from the input family record (none of the three skeptic verdicts attacked the family definition itself, only the construction quality around it). Definition: \"Agent makes an authoritative change at an origin system (a DNS record or a CDN-fronted asset) and must correctly verify propagation despite intermediate caching layers that are contractually permitted to serve stale data until TTL- or purge-type-specific windows lapse, choosing the correct purge type and multi-tier verification sequence rather than treating one re-fetch as proof.\" Task shape: update an origin resource, issue a purge (soft/hard/tag/prefix) against a simulated multi-tier CDN and/or update a DNS record, under harness-enforced stale-serve windows, tier-revalidation semantics (EXPIRED vs MISS), and purge rate limits; the agent must choose a verification sequence that correctly distinguishes legally-stale from genuinely-failed propagation. Causal axis: stale-authority-replay-against-changed-state. Authority boundary: the origin (zone or origin server) is sole source of truth; caches hold delegated, time-bounded copies whose staleness is contractually legal, so authority to declare content live is bounded by confirming propagation at the correct tier, not by absence of an API error. Subject-inaccessible witness: the agent cannot inspect cache-node internal state directly, only whatever headers/values a probed tier returns, with no built-in freshness signal unless it deliberately applies documented status semantics. Natural scenario dimensions: TTL length; purge type (hard/soft/tag/prefix); single- vs multi-tier topology; plan-tier rate limits; verification method chosen. Why agents may fail: a single purge-then-refetch will, per documented semantics, still legitimately see stale content (false FAILED) or accept a still-caching tier's EXPIRED response as proof of a true MISS (false LIVE). Why fair: staleness rules (RFC 2181 TTL semantics, documented CDN purge-type behavior) are public, stable, and derivable from specification/vendor docs, requiring correct application of a documented cache contract rather than hidden internal knowledge. None of these clauses are altered by the construction recipe below; the recipe only supplies how a repairable, gradeable, cheat-resistant package gets built around this definition."
          - listitem [ref=f7e2316]:
            - strong [ref=f7e2317]: "Durable-outbox operator mapping:"
            - text: "RECONCILIATION NOTE (all three skeptic passes returned refuted=true): the panel converged on the same four concrete, textually-grounded gaps — (1) the planted defect was two ANDed sub-clauses folded into one loop, which is exactly the collapsible \"one decision\" shape the CAA postmortem (reports/PHASE-17-CAA-VALIDATION.md) warned against; (2) publicOutcomeRequirements enumerated three \"must never X/Y/Z\" clauses that map ~1:1 onto five of the six plausible-mistake mutants, functioning as a near-answer-key; (3) the only \"self-check-coverage predictor\" on offer was a future promise to run a few live solves and eyeball pass/fail — the same shape as the CAA smoke campaign this recipe is reacting against, not the structural, pre-trial predictor the postmortem's recommendation #1 actually asked for; (4) no mutant existed to prove the identity-preserving witness cross-check has a reachable failing branch, the same unfalsifiable-isolation-claim gap the postmortem found in two of CAA's seven Phase 16 controls. Per instruction, these are accepted and fixed structurally below (items 3 and 4, plus the witness clause, publicOutcomeRequirements, and scenarioSelectionStrategy), not re-argued."
        - paragraph [ref=f7e2318]: Mapping is against the 8 operators named in the prompt (data/hardness-operators.json) plus one additional measured operator found live in that file that is unusually on-point for this family (grade-the-obligation-from-the-external-party-log); the extra one is flagged as a bonus, not substituted for any of the 8.
