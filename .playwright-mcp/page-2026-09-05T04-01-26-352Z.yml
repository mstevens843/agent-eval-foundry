            - code [ref=f7e3870]: klavis-mcp-atlas-repo
            - text: "'s \"fixed data-snapshot dependency\" (an eval harness that \"return[s] erroneous results\" unless a specific export is pre-imported) and \"whole-trajectory HTTP retry replays already-executed side-effecting tool calls\" (the grading service's own retry loop can double-fire a write) both describe fragility in the"
            - emphasis [ref=f7e3871]: evaluation harness
