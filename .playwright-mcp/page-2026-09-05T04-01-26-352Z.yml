          - text: ", required"
          - strong [ref=f7e3770]: trivia rather than professional judgment
          - text: ", or was a"
          - strong [ref=f7e3771]: good mechanism that simply lost the capacity contest
          - text: for a slot. Each is treated below with the specific candidate and citation, not a blanket "rejected — insufficient evidence."
