        - heading "14.2 Benchmark governance and methodology, not a task shape" [level=3] [ref=f7e3838]
        - paragraph [ref=f7e3839]:
          - text: A large slice of the pool describes how a
          - emphasis [ref=f7e3840]: benchmark itself
