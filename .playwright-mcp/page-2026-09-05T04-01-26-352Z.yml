          - listitem [ref=f7e2250]:
            - text: "NEW: an automated lint over the literal"
            - code [ref=f7e2251]: publicOutcomeRequirements
            - text: text (extending
            - code [ref=f7e2252]: src/phase-16/contract-gate.ts
            - text: "'s existing"
            - code [ref=f7e2253]: FORBIDDEN_PHRASES
            - text: mechanism with family-specific tokens —
            - code [ref=f7e2254]: /\bevent\s*id\b/i
            - text: ","
            - code [ref=f7e2255]: /\bcreated\b/i
            - text: ","
