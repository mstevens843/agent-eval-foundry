        - paragraph [ref=f7e2150]:
          - text: "Isolation-mechanism claim corrected this revision. The prior draft cited \"the portfolio's now-standard §15-style verifier-isolation repair\" (container/process separation) as the enforcement mechanism; reports/adversarial-container-isolation-report.md shows this is NOT currently operational for any family in this repository — every bundle logs \"container smoke not run during deterministic bundle preparation\" because the docker daemon is unavailable in this environment. The claim now made is the one this portfolio has actually validated: the"
          - code [ref=f7e2151]: fs-sandbox
          - text: pattern (copied public bundle, hidden source, repository root inaccessible to the subject process), which reports/adversarial-isolation-report.md records at 0 leaks across 10 existing families. Container-level isolation remains a stated future upgrade, not a present guarantee, and the family's kill conditions have been updated accordingly (see
          - code [ref=f7e2152]: killConditions
          - text: ).
        - paragraph [ref=f7e2153]:
          - text: "To satisfy Phase 17 §12.5 (\"require a negative control for every isolation and non-leakage claim... any claim of the form X did not leak must ship a canary that trips the same detector, or it is not evidence\"), this family now ships a mandatory pre-flight negative control: a deliberately-leaky"
          - code [ref=f7e2154]: platform_sim
          - text: "facade variant that intentionally echoes one ledger field into a subject-readable path, run through the identical isolation check the real sidecar uses. The check must DETECT that facade as leaking before any real scenario is trusted. This is not a new, unproven mechanism — it instantiates the same control already built and validated elsewhere in this repository:"
          - code [ref=f7e2155]: C8-witness-isolation-with-canary
          - text: in
          - code [ref=f7e2156]: data/phase-17-package-controls.json
          - text: /
          - code [ref=f7e2157]: src/phase-17/package-controls.ts
          - text: ", recorded there as \"isolated=true; the deliberately leaky facade tripped the detector=true.\" This family reuses that exact control pattern against its own sidecar rather than asserting an isolation claim with no falsifier, which is what all three skeptic reviews correctly flagged as missing."
        - list [ref=f7e2158]:
          - listitem [ref=f7e2159]:
            - strong [ref=f7e2160]: "Fuzzer dimensions:"
            - text: Which event types collide in the out-of-order pair · gap size between the out-of-order deliveries · whether a manual resend is attempted and its timing relative to the automatic retry schedule (before/during/after) · number and type-composition of split-duplicate pairs · number of objects with concurrently in-flight deliveries (hypothesized controlling parameter, per
            - code [ref=f7e2161]: recompute-activation-concentration
            - text: "'s generalized lesson) · malformed/replay/signature-invalid deliveries as non-activation controls · NEW: whether the scenario is drawn from the majority subset required to jointly exercise all three decision surfaces (identity-type-collapse, freshness-precedence, retry-authority) versus a minority subset exercising only one or two, used to confirm the joint-difficulty claim in"
            - code [ref=f7e2162]: scenarioSelectionStrategy
            - text: .
          - listitem [ref=f7e2163]:
            - strong [ref=f7e2164]: "Narrow development mutants:"
            - code [ref=f7e2165]: dedupe-by-event-id
            - text: (dedupes solely on the event's own id — defeats the identity-type-collapse surface) ·
            - code [ref=f7e2166]: order-by-created
            - text: (applies whichever delivered event carries the larger created/receipt-order value — defeats the freshness-precedence surface) ·
            - code [ref=f7e2167]: resend-closes-incident
            - text: (treats a single 2xx to a manual resend as terminal — defeats the retry-authority surface). Each maps 1:1 to one of the three decision surfaces named in
            - code [ref=f7e2168]: familyNativeDifficultyOperators
            - text: ", and each must fail on a distinct verifier check line (confirmed at the"
            - code [ref=f7e2169]: cheapestPackageValidityProbe
            - text: stage), not the same shared assertion.
          - listitem [ref=f7e2170]:
            - strong [ref=f7e2171]: "Held-out mutants:"
            - code [ref=f7e2172]: receipt-order-trust
            - text: "(blunter freshness-surface variant: strict arrival order, no timestamp/id logic at all) ·"
            - code [ref=f7e2173]: type-blind-keying
            - text: "(blunter identity-surface variant: keys dedup on object id alone, wrongly collapsing distinct event types) · NEW:"
            - code [ref=f7e2174]: ledger-blind-resolve
            - text: "(blunter retry-authority-surface variant: closes an incident once N consecutive resend attempts return 2xx, counting only local attempts and never consulting the ledger — added this revision because the prior held-out set covered only two of the three decision surfaces, leaving retry-authority with no held-out validation)."
          - listitem [ref=f7e2175]:
            - strong [ref=f7e2176]: "Positive-work / cheat controls:"
            - text: "positive-work (reference consumer, full credit) · no-op (must fail the \"eventually reflected\" requirement) · always-refuse (must fail processing requirements; rig confirms this fails rather than vacuously passing) · unconditional-fresh (treats every delivered event as authoritative regardless of identity/type) · hardcoded-terminal-map (hardcodes terminal types without checking freshness) · self-attested-resolution (writes its own \"retries stopped\" record instead of consulting ground truth) · NEW:"
            - code [ref=f7e2177]: leaky-facade-canary
            - text: "(a rig-level, non-subject-facing control: a deliberately-leaky sidecar facade that must be caught by the isolation check itself, proving that check is falsifiable — see"
            - code [ref=f7e2178]: externalAuthorityOrWitness
            - text: ).
          - listitem [ref=f7e2179]:
            - strong [ref=f7e2180]: "Scenario-selection strategy:"
            - text: "Fuzz over event-type collision × gap size × resend timing × split-duplicate composition × concurrent-object count; keep points where the reference passes and at least one narrow mutant fails. Structural requirement, tightened this revision: every graded scenario must contain at least one out-of-order pair AND at least one split-duplicate pair (as before), and a MAJORITY of the graded set must additionally include a resend-during-active-retry case, so that all three decision surfaces (identity-type-collapse, freshness-precedence, retry-authority) are jointly exercised rather than only two of three — directly addressing the \"one decision undershoots a coin flip\" concern by compounding three independent ~50% surfaces rather than reusing one. Selection is hypothesized to concentrate around ≥2 concurrently in-flight objects/events, by analogy to the multi-worker concentration lesson. Held-out mutants ("
            - code [ref=f7e2181]: receipt-order-trust
            - text: ","
            - code [ref=f7e2182]: type-blind-keying
            - text: ","
            - code [ref=f7e2183]: ledger-blind-resolve
            - text: — now one per surface) are run only against previously-unseen parameter combinations to confirm the selected region generalizes.
