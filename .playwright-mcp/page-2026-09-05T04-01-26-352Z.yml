    - main [ref=f7e209]:
      - generic [ref=f7e210]:
        - heading "RESEARCH TRACK R1 — Task-Family Landscape, Foundry Scan, and Top-20 Portfolio" [level=1] [ref=f7e211]
        - paragraph [ref=f7e212]: "Generated 2026-09-04. This is a research and recommendation artifact only: no task packages were built, no paid agent trials were run, and no historical evidence was altered. The active Phase 18 (CAA V2) rebuild was not read as concluded and no Phase 18 file was modified."
        - heading "1. Executive verdict" [level=2] [ref=f7e213]
        - heading "Part 1 — Suspicious-Pattern Scan of the Scored Table" [level=1] [ref=f7e214]
        - paragraph [ref=f7e215]: "I checked the 20 reconciled families for six things: round-number clustering, uniformly-high scores, direction/magnitude of the ordinary→full-recipe probability gap, whether CAA V1 and durable-outbox calibration facts are actually used, and whether the \"two independent scorers reconciled\" apparatus is doing real work or just performing rigor. Several concrete, non-cosmetic problems turned up."
        - paragraph [ref=f7e216]:
          - strong [ref=f7e217]: A. Scores cluster in a narrow, flattering band, and duplicate exact totals recur implausibly often.
          - code [ref=f7e218]: opportunityScoreTotal
          - text: "across the 20 families: 43, 54, 57, 58, 59, 60, 60, 60, 61, 61, 62, 62, 64, 65, 65, 65.5, 69, 70, 71, 71. Sixteen of twenty (80%) land in a tight 57–71 window on what is nominally a ~100-point, 10-dimension rubric. Only"
          - code [ref=f7e219]: crm-pagination-locator-resilience
          - text: "(43) was allowed to fall meaningfully low, despite several other families carrying equally damning findings (see C). Worse, exact-total ties recur far more than independent per-dimension arguments should produce by chance: 60 appears 3×, 61 and 62 and 65 each appear 2×, 71 appears 2× ("
          - code [ref=f7e220]: payment-idempotency-ambiguous-retry
          - text: and
          - code [ref=f7e221]: rollback-reactivates-dormant-defect
          - text: — two structurally unrelated families landing on the identical sum).
          - code [ref=f7e222]: tenDistinctTaskProbability
          - text: and
          - code [ref=f7e223]: officialReviewProbability
          - text: "show the same pattern: almost everything sits in 0.55–0.85 and 0.30–0.55 respectively. This is the signature of regression toward a comfortable \"good opportunity\" default rather than genuine differentiation."
        - paragraph [ref=f7e224]:
          - strong [ref=f7e225]: B. The ordinary-vs-full-recipe probability spread is inverted or negligible in a large share of the roster — directly contradicting the project's own stated theory of hardening.
          - text: "Several reconciliation notes explicitly state the correct model (e.g., payment-idempotency: \"a correctly-built full recipe should show a LOWER accidental clean-pass rate than an ordinary build, not a higher one\"). Checking every family's normalized (ordinary − full-recipe) gap:"
        - list [ref=f7e226]:
          - listitem [ref=f7e227]:
            - strong [ref=f7e228]: Inverted (full-recipe easier than ordinary)
            - text: ":"
            - code [ref=f7e229]: worker-rebalance-partition-callback-dedup
            - text: 32%→62% (+30pp),
            - code [ref=f7e230]: trial-time-tool-shim-poisoning
            - text: 42%→63% (+21pp),
            - code [ref=f7e231]: rollback-reactivates-dormant-defect
            - text: 42%→45% (flat/+3pp),
            - code [ref=f7e232]: ui-action-replay-dom-mutation-timing
            - text: 15%→82% (+67pp, the most extreme value in the entire table).
          - listitem [ref=f7e233]:
            - strong [ref=f7e234]: Negligible gap (≤0.12)
            - text: ":"
            - code [ref=f7e235]: verifier-container-isolation-boundary
            - text: (10pp),
            - code [ref=f7e236]: clinical-bundle-partial-success-masking
            - text: (0.12),
            - code [ref=f7e237]: fuzzy-instruction-cross-server-tool-discovery
            - text: (0.10),
            - code [ref=f7e238]: long-horizon-multi-app-coordination
            - text: (0.11).
        - paragraph [ref=f7e239]:
          - text: That's 8 of 20 families (40%) failing to show the basic "hardening suppresses clean-pass" signal the whole framework is built on. The
          - code [ref=f7e240]: ui-action-replay-dom-mutation-timing
          - text: "case is particularly concerning: its own recipe card has to explain the inversion away by silently redefining"
