        - heading "13.5 Is $100,000 plausible for 1,000 tasks? No — and the gap is not close" [level=3] [ref=f7e3730]
        - paragraph [ref=f7e3731]:
          - text: At this cohort's own construction economics,
          - strong [ref=f7e3732]: 1,000 clean-5/6-or-6/6-failure tasks costs roughly $4.5M–$7.5M, not $100,000.
          - text: $100,000 buys somewhere between
          - strong [ref=f7e3733]: 13 and 22 validated tasks — 1.3% to 2.2% of the goal
          - text: — and that is the
          - emphasis [ref=f7e3734]: optimistic
          - text: "reading, since it assumes every card builds clean on the first attempt. It should not: all ten cards are currently 30/30 refuted, and their own reconciled"
          - code [ref=f7e3735]: officialReviewProbability
          - text: averages
          - strong [ref=f7e3736]: ~40%
          - text: ", meaning roughly 60% of these cards, as presently specified, are expected to fail even a"
          - emphasis [ref=f7e3737]: next
          - text: re-review. Revision labour to clear that bar is not inside
          - code [ref=f7e3738]: firstPackageBuildHours
          - text: at all, so the realistic reach sits at or below the low end of the 13–22 band — plausibly single digits once repair cycles are priced in.
        - paragraph [ref=f7e3739]:
          - text: "The gap cannot be closed by building more of the same ten families either: §11 caps recommended concentration at 20% of a build cohort per causal axis, and this portfolio already sits at 2x that cap on axis A (stale-witness-trust) alone. Reaching 1,000 requires sourcing new causal axes this section has no cost data for — so $4.5M–$7.5M is a"
          - strong [ref=f7e3740]: lower bound
          - text: "on continuing in this shape, not an estimate of the actual programme cost. This also lines up directionally with this same report's earlier §13 finding for a more mature, already-partially-shipped 34-family pool (~$2,000–2,050/task there): this cohort, starting from zero builds and a unanimous refutation, is earlier-stage and should cost"
          - emphasis [ref=f7e3741]: more
          - text: per task, not less — and it does, by roughly 2–4x.
        - heading "13.6 The dominant cost driver is construction labour, not trial spend" [level=3] [ref=f7e3742]
        - paragraph [ref=f7e3743]:
          - text: Every version of this math — cheap CAA V1 pricing or the heavier portfolio-measured mean, conservative or optimistic instance counts, $90 or $150 an hour — puts trial spend at
          - strong [ref=f7e3744]: $660–$1,460
          - text: against
          - strong [ref=f7e3745]: $48,240–$63,120
          - text: "of first-build construction hours: a 97:3 split. That is the identical ratio"
          - code [ref=f7e3746]: reports/budget-plan.md
          - text: "independently measured from real, already-run campaigns on a completely different set of families ($2,987 trials against $87,570 labour, 97% labour). Two unrelated inputs landing on the same ratio is the strongest evidence in this section:"
          - strong [ref=f7e3747]: $0.85 scaled to a thousand tasks is under $2,500; $120/hour scaled to the hours these families' own authors estimate is millions.
          - text: No amount of trial-cost optimization — cheaper models, shorter runs, more aggressive sequential stopping — touches a gap whose size is set by engineer-hours. The only lever that has ever moved the family count in this project's own budget model is
          - code [ref=f7e3748]: hoursPerFamily
          - text: .
        - paragraph [ref=f7e3749]:
          - emphasis [ref=f7e3750]:
