              - cell "Agent's webhook consumer must dedupe split-representation duplicate events, tolerate out-of-order delivery without regressing state using stale timestamps, and recognize that a manual resend does not cancel the platform's independent automatic retry schedule." [ref=f7e1533]
              - cell "A delivery sequence including an out-of-order pair and a split-duplicate pair arrives; agent must key dedup/order logic on object identity plus event type, not event id or created, and must not declare an incident closed on a single manual resend's 2xx, nor let a stale 'updated' event overwrite more current state." [ref=f7e1534]
