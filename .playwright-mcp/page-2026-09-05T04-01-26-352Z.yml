        - heading "6. External foundry and benchmark comparison" [level=1] [ref=f7e816]
        - paragraph [ref=f7e817]:
          - text: This section reports real investigation results on 15 distinct external projects across 12 investigated source units (some source units bundle more than one project — the program-repair survey covers Defects4J and BugSwarm separately; the open-discovery pass covers METR Task Standard, TheAgentCompany, and AppWorld separately). Every claim below is attributed to its
          - code [ref=f7e818]: sourceUnitId
          - text: . Where a fetch was partial, gated, or failed outright, that is stated plainly in the entry rather than filled in from assumption — several entries below (MCP-Bench, VOID, the open-discovery trio, and the "terminal-agent-lab" search) carry explicit depth caveats and should be weighted accordingly.
        - paragraph [ref=f7e819]:
          - text: "A methodological note before the per-project detail: the task brief for this section warns not to call a static corpus a foundry merely because it contains many tasks. Applying that test strictly changes several classifications from how the source projects describe themselves — most notably METR Task Standard and TheAgentCompany, which the open-discovery narrative summary calls \"true foundries,\" but for which the gathered evidence shows a manually-authored task corpus running against an enforced"
          - emphasis [ref=f7e820]: schema
          - text: ", not an automated path from raw source material to generated candidates. Those are reported below as authoring frameworks / runners, not generators, with the reasoning shown."
