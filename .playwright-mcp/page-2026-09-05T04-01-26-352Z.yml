              - cell [ref=f7e1795]:
                - text: Silent Scope Narrowing on Token Refresh (
                - code [ref=f7e1796]: oauth-refresh-scope-narrowing
                - text: )
              - cell "Agent refreshes an OAuth2 credential mid-task expecting unchanged authority, but the authorization server silently returns a narrower scope per RFC 6749; correct behavior requires parsing the refresh response's scope field and adjusting subsequent calls rather than assuming prior permissions still hold." [ref=f7e1797]
              - cell "Agent performs an authorized action, its token is refreshed mid-trajectory with a silently narrowed scope, and a later downstream action depending on the original scope must be detected as now-unauthorized via the response body rather than a late 403." [ref=f7e1798]
              - cell "authority-boundary-scope-violation" [ref=f7e1799]
              - cell "identity and access management / OAuth2 client integration engineering" [ref=f7e1800]
              - cell "boundary-oauth-refresh" [ref=f7e1801]
              - cell "fresh-external" [ref=f7e1802]
              - cell "The refreshed token's actual scope is authoritative over the agent's assumed scope; the server may narrow it without prominent warning per spec, so the client must read the response, not assume." [ref=f7e1803]
              - cell "The server-side decision to narrow scope is opaque; only the scope field in the refresh response and eventual call outcomes reveal it." [ref=f7e1804]
              - cell "which permission is narrowed; number of downstream calls depending on lost scope; proactive scope-parsing vs discovery-via-failure; single vs chained refreshes." [ref=f7e1805]
              - cell "Agents treat refresh success as full authority restored and skip the optional scope field, executing downstream calls under a false assumption and failing several steps later with a hard-to-diagnose late 403." [ref=f7e1806]
              - cell "The rule is explicit in RFC 6749 and load-bearing for any refresh implementation; correctly parsing a documented response field is core, non-obscure API-integration competence." [ref=f7e1807]
