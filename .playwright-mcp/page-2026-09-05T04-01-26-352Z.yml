          - text: fields in
          - code [ref=f7e2143]: src/phase-16/types.ts
          - text: "— and used purely as a RANKING signal during discovery review, never to accept or reject a contract. A candidate whose natural self-check trivially covers all three surfaces (the CAA V1 pattern: 4/4 covered) is down-ranked for further build spend before money is spent on a campaign, directly closing the gap Phase 17 §12.1 named as missing (\"the gate currently has no feature that would have separated them, and it ranked this candidate 85 out of 85\")."
