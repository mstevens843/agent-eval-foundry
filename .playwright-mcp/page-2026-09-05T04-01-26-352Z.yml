          - listitem [ref=f7e3872]:
            - code [ref=f7e3873]: foundry-toolathlon
            - text: "'s \"Authority-boundary bridging via credential substitution beneath the task\" (Klavis's socket/URL-rewriting \"hijacking\" to inject credentials transparently) and"
            - code [ref=f7e3874]: foundry-open-discovery
            - text: "'s \"Authority-boundary / permission-sandbox mis-specification\" (manually-declared per-task sandbox permissions) are both about how the"
            - emphasis [ref=f7e3875]: test rig
