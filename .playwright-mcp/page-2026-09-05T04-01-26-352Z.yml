          - listitem [ref=f7e3865]:
            - code [ref=f7e3866]: foundry-program-repair-survey
            - text: "'s three items (BugSwarm's 5.56% archived-CI reproduction rate, Defects4J's manual commit-isolation process, CI-pass/fail used as an unchecked ground-truth proxy) and"
            - code [ref=f7e3867]: foundry-incident-mining-survey
