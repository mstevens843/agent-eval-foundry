              - cell "fresh-external" [ref=f7e1586]
              - cell "The origin (authoritative DNS zone or origin server) is the sole source of truth; caches and edge tiers hold delegated, time-bounded copies whose staleness is contractually legal, not a defect, so the agent's authority to declare content live is bounded by confirming propagation at the correct tier, not by the absence of an API error." [ref=f7e1587]
              - cell "The agent cannot directly inspect every cache node's internal state; it only observes whatever response headers/values a given tier returns to a probe, with no built-in freshness signal unless it deliberately checks documented status semantics." [ref=f7e1588]
              - cell "TTL length; hard vs soft vs tag-based purge type; single-tier vs multi-tier topology; plan-tier rate limits; verification method chosen." [ref=f7e1589]
              - cell "An agent that purges once and immediately re-fetches once will, per documented semantics, still legitimately see stale content and wrongly conclude failure, or accept a still-caching tier's EXPIRED response as proof of a true MISS." [ref=f7e1590]
              - cell "The rules governing staleness (RFC 2181 TTL semantics, documented CDN purge-type behavior) are public, stable, and derivable by reading the relevant specification/vendor docs -- no hidden internal knowledge is required, only correct application of a documented cache contract." [ref=f7e1591]
