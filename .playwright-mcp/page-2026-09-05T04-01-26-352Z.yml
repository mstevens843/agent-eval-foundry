        - paragraph [ref=f7e2766]: "(10) Frozen hashes, isolated execution, blind labelling → unchanged: pinned runtime/image versions and fixture hashes, per-trial isolated execution, blind pass/fail/coverage labelling computed from daemon-observed facts. For this family operators 6 and 10 are the graded mechanism itself, which is correct for a family whose axis is verifier-trust-boundary-integrity."
        - list [ref=f7e2767]:
          - listitem [ref=f7e2768]:
            - strong [ref=f7e2769]: "Non-applicable operators:"
            - text: None of the ten operators are inapplicable outright, but three need reinterpretation rather than literal transplant. Operator 5 ("append-only ledger") does not fit as a literal business ledger; its family-native analogue is the container daemon's own introspection API plus its independent event stream, per mapping (5)/(6). Operator 6 is split in this revision into a per-run anti-forgery check (6) and a pre-trial predictive screen (6a) because the two answer different questions — "did this submission lie about what it exposed" versus "would a normal agent have caught this without being told" — and Phase 17's postmortem shows conflating them is exactly how a validity repair gets mistaken for a difficulty result. Operator 10 ("durable artifact capture") is not a hygiene wrapper here, because durable, correctly-scoped artifact capture is the substance of the task itself.
          - listitem [ref=f7e2770]:
            - strong [ref=f7e2771]: "Family-native difficulty operators:"
            - text: dual-independent-repair (the reference fix requires two structurally unrelated corrections in two different modules with no shared vocabulary — shared-resource freshness in the low-level client for D1, artifact-content provenance in the snapshot module for D2 — each individually necessary and neither sufficient alone; this is the operator that closes the single-decision-point thinness risk the v1 construction carried and that all three skeptic reviews flagged). boundary-authority-displacement (the guard's correctness depends on real daemon-level facts — resolved mount sources, filesystem provenance, timestamp ordering — that the candidate's own process cannot observe from inside itself). declared-surface-tension (the fix must narrow exposure to exactly the declared contract without breaking legitimate sidecar- or process-deliverable promotion; a brute-force lockdown is a distinguishable wrong answer, not a safe default). conjunctive-activation (each defect only manifests under a specific combination — shared resource name reused across two builds for D1, an artifact path resolving outside the container's own filesystem for D2 — never from a single obvious branch). non-local-witness (whether the repair works is verifiable only by an authority — the daemon, queried via its own independent event stream — external to and unforgeable by the candidate).
