        - heading "14.3 No subject-inaccessible witness, or a verifier confounded against its own stated crux" [level=3] [ref=f7e3879]
        - paragraph [ref=f7e3880]:
          - text: Three items in the pool are Terminal-Bench's
          - emphasis [ref=f7e3881]: own
          - text: "PR-review rejections of proposed tasks, and they are the cleanest available evidence for this exact failure mode:"
        - list [ref=f7e3882]:
          - listitem [ref=f7e3883]:
            - code [ref=f7e3884]: tb-rejected-prs-sample
            - text: "(carlini, PR #89): \"The archive admits two byte-for-byte equivalent decodings... These differ only by a transpose... Every failing trial produced exact transposes.\" No signal in the data disambiguates the \"correct\" answer from its mirror image — reward-0 would measure format-guessing luck, not competence."
          - listitem [ref=f7e3885]:
            - code [ref=f7e3886]: tb-rejected-prs-sample
            - text: "(ibercovich, PR #492): \"Two VeraPDF metadata gates form an unintended second crux... blocks agents independently of the MathML question.\" A reward-0 here cannot be attributed to the mechanism the task claims to test."
          - listitem [ref=f7e3887]:
            - code [ref=f7e3888]: tb-rejected-prs-sample
            - text: "(dwahdany, PR #676): \"roughly a third of trials appear to have had a broken environment, not a failing agent... GPU OOM from loading 12+ model backends on one H100.\" Indistinguishable from infrastructure flakiness — no witness isolates agent competence from environment reliability."
        - paragraph [ref=f7e3889]:
          - text: "The same disposition applies to two pool items outside that sample:"
          - code [ref=f7e3890]: klavis-mcpmark-repo
          - text: "'s LEGO"
          - code [ref=f7e3891]: transfer_parts
          - text: task, whose own stated requirements are in tension ("Log failed transfers with error messages" while also demanding "complete rollback on any failure... no partial updates possible" under standard transaction semantics — the grader's real expectation is not fully expressed in the instruction); and
          - code [ref=f7e3892]: incident-insurance-claims
          - text: ", where correct adjudication depends on a value judgment (\"existing beneficiary medical records were sufficient to support the medical necessity\") for which no crisp, mechanically-checkable oracle exists without simulating a full clinical-review corpus."
        - heading "14.4 Obscure trivia and unavailable knowledge" [level=3] [ref=f7e3893]
        - list [ref=f7e3894]:
          - listitem [ref=f7e3895]:
            - code [ref=f7e3896]: boundary-git-refs
            - text: "'s three items (reflog-dependent recovery, detached-HEAD identity collapse,"
            - code [ref=f7e3897]: git gc
            - text: "'s \"around 7,000 loose objects or more than 50 packfiles\" trigger threshold) require specific git-internals procedural knowledge rather than professional judgment, and all the state involved is subject-side — there is no external authority whose boundary is being tested."
          - listitem [ref=f7e3898]:
            - code [ref=f7e3899]: incident-legal-esignature
            - text: "'s three items depend on DocuSign-specific API trivia (\"REST API can create and modify authoritative copy flags but cannot export... Only the SOAP API provides operations necessary for exporting\") and niche legal vocabulary (\"authoritative copy,\" \"chattel paper\") not derivable from in-sandbox investigation."
          - listitem [ref=f7e3900]:
            - code [ref=f7e3901]: klavis-deep-swe-repo
            - text: "'s koota-ECS-rollback and langchain-coalescing items require memorizing one library's specific relation/trait semantics or its \"six call surfaces\" — passable only by prior familiarity with that exact codebase, not by professional reasoning."
          - listitem [ref=f7e3902]:
            - code [ref=f7e3903]: incident-supply-chain-npm
            - text: "'s three items (a social-engineered maintainer handoff, an AES-encrypted payload \"disguised as a test fixture,\" a malicious transitive dependency) require the subject to already distrust a governance action that looks completely legitimate on its face; nothing in a legitimate in-sandbox investigation distinguishes it from the many benign maintainer transfers that happen every day."
          - listitem [ref=f7e3904]:
            - code [ref=f7e3905]: tb-discussion-224
            - text: "'s \"GPT-5 liked to use nano for editing files, but then it opens it and can't use it... gets stuck in interactive mode\" is a vivid, well-evidenced trap, but it tests terminal ergonomics, not professional judgment, and carries no professional stakeholder or authority boundary at all."
        - heading "14.5 Single, real, named incidents that don't reduce to a buildable, fair task" [level=3] [ref=f7e3906]
        - paragraph [ref=f7e3907]:
          - code [ref=f7e3908]: incident-travel-overbooking
          - text: (a specific, named airline and flight number),
          - code [ref=f7e3909]: incident-saas-config-drift
          - text: (a specific multi-datacenter postmortem with figures like "954 divergent writes" and "200,000 webhook payloads... dropped"), and
          - code [ref=f7e3910]: incident-gaming-economy
          - text: (a shooter game's netcode exploit, sourced from a single corporate blog post with no code or protocol spec) are all richly documented but each requires either reproducing proprietary infrastructure at high fidelity or building a task transparently keyed to one identifiable real-world event — the latter reintroduces exactly the "obscure trivia / real-event recall" fairness problem this section exists to screen for, and the former is pure construction cost with no payoff beyond mechanisms the pool already demonstrates more cheaply elsewhere (stale-authority, retries).
        - heading "14.6 Good mechanism, no portfolio slot — a capacity cut, not a quality cut" [level=3] [ref=f7e3911]
        - paragraph [ref=f7e3912]:
          - code [ref=f7e3913]: foundry-tau-bench
          - text: "'s three items are the strongest counter-example to \"rejected means flawed\": the paper reports concrete, measured effects (\"removing policy text from the prompt dropped gpt-4o 22.4% on airline vs 4.4% on retail\"; weaker models \"called tools with non-existent user/product/order/item IDs at a rate of 2.08–6.34 per task\"). This is a thirteenth well-evidenced causal axis — natural-language policy compliance under compound, multi-item requests — that simply lost the allocation contest against the 11 axes that shipped. It was not built for reasons of program scope, not evidentiary weakness, and should be the first candidate reconsidered if the portfolio expands past 20."
        - paragraph [ref=f7e3914]:
          - code [ref=f7e3915]: tb-google-design-doc
          - text: "'s \"Tacit / expert-domain knowledge gap\" sits in the same honest-capacity-cut category but leans toward §14.4's trivia concern too (correctness depends on domain conventions like \"accounting treatment\" or \"a scientific fitting methodology\" the instruction cannot spell out without giving away the answer)."
        - heading "14.7 Where an axis legitimately stayed a singleton" [level=3] [ref=f7e3916]
        - paragraph [ref=f7e3917]: "Two selected axes produced only one family each, and the pool explains why without requiring an artificial rejection:"
        - list [ref=f7e3918]:
          - listitem [ref=f7e3919]:
            - strong [ref=f7e3920]:
              - code [ref=f7e3921]: pagination-partial-observation
            - text: had exactly one rich cluster (
            - code [ref=f7e3922]: incident-crm-pagination
            - text: "'s query-locator expiration, concurrency-limit exhaustion, and cross-page data drift), all three of which are folded into the single"
            - strong [ref=f7e3923]: CRM Bulk Pagination Under Live Concurrent Writes
            - text: family. No second materially distinct pagination cluster existed; the DOM-mutation-observer evidence is also partial-observation-adjacent but its dominant failure mode is temporal ordering, so it was allocated to
            - code [ref=f7e3924]: async-out-of-order-completion
            - text: instead.
          - listitem [ref=f7e3925]:
            - strong [ref=f7e3926]:
              - code [ref=f7e3927]: scope-expansion-collateral-damage
            - text: is anchored by
            - code [ref=f7e3928]: foundry-open-discovery
            - text: "'s AppWorld state-diff evidence (\"state-based unit tests... checking for unexpected changes, i.e., collateral damage\")."
            - code [ref=f7e3929]: foundry-osworld
            - text: "'s misclick-driven scope expansion and"
            - code [ref=f7e3930]: klavis-toolathlon-mvp-repo
            - text: "'s decoy-record discrimination are thinner instances of the same shape (single-fixture evidence versus AppWorld's general methodology) and were folded in as corroboration rather than promoted to a second family."
        - heading "15. Uncertainty and falsification conditions" [level=2] [ref=f7e3931]
        - heading "15. Uncertainty and falsification conditions" [level=2] [ref=f7e3932]
        - paragraph [ref=f7e3933]:
          - text: This section applies to the entire top-10 candidate portfolio and the 4-family cohort selected from it (
          - code [ref=f7e3934]: ui-action-replay-dom-mutation-timing
          - text: ","
          - code [ref=f7e3935]: cdn-cache-staleness-verification-gap
          - text: ","
          - code [ref=f7e3936]: narrow-assertion-reward-hacking
          - text: ","
          - code [ref=f7e3937]: state-diff-collateral-damage-verification
          - text: ). None of the four has run a single paid agent trial as of this writing — every probability below is a scorer-reconciled prior, not a measurement, and every prior in the cohort data itself is already marked with a range and, for two of four families, an explicit "low confidence" tag on
          - code [ref=f7e3938]: probabilityFullRecipe
          - text: . Treat everything in this section as pre-registration, not results.
        - heading "What would show the recipe does not transfer" [level=3] [ref=f7e3939]
        - paragraph [ref=f7e3940]: "\"The recipe\" here is a specific, falsifiable claim: that validity- and difficulty-construction operators already proven inside one family (durable-outbox's three-process ledger isolation and A2 terminal-state repair; access-token-scope-expansion's authority-boundary grading; CAA's origin-authority framing; ui-replay-browser-backed's Playwright harness) can be transplanted onto a new causal axis and produce a genuinely hard, fair package on the first build, without repeating the multi-round bypass-discovery cycle each donor family needed. Concrete signals that this fails:"
        - list [ref=f7e3941]:
          - listitem [ref=f7e3942]:
            - strong [ref=f7e3943]: A second validity-defect discovery cycle after Phase 1 begins.
            - text: Durable-outbox needed three rounds of bypass discovery (never-called-tool false-pass, monkeypatched ground truth, bypassable role isolation) before its ledger-isolation operator was trustworthy. If
            - code [ref=f7e3944]: state-diff-collateral-damage-verification
            - text: "'s full-world-diff grader or"
            - code [ref=f7e3945]: narrow-assertion-reward-hacking
            - text: "'s loose/strict-arm checker passes its cheap Phase-0 kill gate (the 10-15-record mini-world; the B6 probe triad on one hand-authored loose/strict pair) but a bypass is found only after real trials are spent, that is direct evidence the reused operator does not generalize to a new grader topology and each new grader shape needs its own from-scratch adversarial audit — i.e., the operator vocabulary in"
            - code [ref=f7e3946]: data/hardness-operators.json
            - text: is not actually portable, only its provenance is.
          - listitem [ref=f7e3947]:
            - strong [ref=f7e3948]: ≥3 of 4 cohort families reach a clean sweep (≥5/6) after clearing Phase 0.
            - text: CAA V1 passed all 72 registered probe cells and scored 85/85 on the contract gate and still returned 4/4 clean solves (VALID-BUT-EASY). Phase 0 in the
            - code [ref=f7e3949]: sequentialTrialSpendPlan
            - text: exists specifically to catch this before paid trials. If most of the cohort survives Phase 0 and then clean-sweeps in Phase 1 anyway, the failure is not just in the four families — it is in the kill-gate design itself, meaning the track's cheap-filtering method does not transfer either.
          - listitem [ref=f7e3950]:
            - strong [ref=f7e3951]:
              - code [ref=f7e3952]: ui-action-replay-dom-mutation-timing
              - text: clears cleanly using only the reused mutants.
            - text: "Its own cheapest kill gate is explicit: add the one new fixture to the existing"
            - code [ref=f7e3953]: ui-replay-browser-backed
            - text: harness and run 2-3 zero-shot agents using only the pre-existing selector-drift/stale-handle/aria-busy mutants. If they pass, the family's incremental-gap claim is falsified in an afternoon, and — more importantly for the track — it shows the foundry's one replicated local capability signal (5/5 and 219/864-scenario failures in
            - code [ref=f7e3954]: ui-action-record-replay
            - text: /
            - code [ref=f7e3955]: ui-replay-live-dom
            - text: ", the only two SHIP families) is mutant-specific dressing rather than a load-bearing async-DOM-completion reasoning gap, and further siblings in that lineage should not be funded."
          - listitem [ref=f7e3956]:
            - strong [ref=f7e3957]:
              - code [ref=f7e3958]: cdn-cache-staleness-verification-gap
              - text: clears cleanly even after the trail-based grader is built.
            - text: "Its Stage-1 kill gate (single-turn, no-tool recall probe across 3-5 models) is the cheap falsifier; but the expensive falsifier is the one worth watching — if the family still clears cleanly with trail-based, tier-by-tier grading (the direct fix for CAA V1's diagnosed \"no self-check-coverage predictor\" flaw) and no recitable forbidden-outcomes text, that would be the single most consequential result the track could produce: it would mean CAA V1's easiness was"
            - emphasis [ref=f7e3959]: not
            - text: explained by its three diagnosed construction flaws, and the whole "trust origin over stale delegated copy" causal axis should be retired from the portfolio rather than repeatedly re-built under new names.
          - listitem [ref=f7e3960]:
            - strong [ref=f7e3961]: The reused operator moves the solve rate less than the one existing local measurement of operator effect.
            - text: The unpublished, locally-derived A2 differential (control 2/6 solved vs. treatment 3/6 solved, i.e., a one-trial swing out of six from inserting a single explicit terminal-state sentence) is the only measured local data point on how much a targeted, fair repair moves a solve rate. If the cdn family's trail-grader or the reward-hacking family's strict-arm checker produce a swing smaller than or statistically indistinguishable from that one-in-six baseline, the recipe's marginal difficulty contribution is within a noise floor already observed once, not a reproducible lever.
          - listitem [ref=f7e3962]:
            - strong [ref=f7e3963]: A validity defect on any single trial.
            - text: Per the pre-registered never-repair rule, one
            - code [ref=f7e3964]: VALIDITY_DEFECT
            - text: blind-label stops spend on that family immediately, regardless of trials remaining — that package is retired under its hash, permanently, exactly as the 245-check durable-outbox artifact's coverage defect was retained as evidence rather than deleted.
        - heading "What evidence would justify scaling toward 1,000" [level=3] [ref=f7e3965]
        - paragraph [ref=f7e3966]: "None of the following exists yet for this cohort; each is a specific, checkable bar, not a vibe:"
        - list [ref=f7e3967]:
          - listitem [ref=f7e3968]:
            - strong [ref=f7e3969]: Realized, not estimated, build hours.
            - text: "The four families are budgeted at 22h / 30h / 36h / 75h (163h total) specifically because each leans on reused infrastructure rather than building from zero. That estimate is itself a claim under test. Scaling is justified only if realized hours land near budget across at least 6 built families (not 1-2, which could be reuse-favorable outliers) — i.e., a demonstrated marginal cost, when recipe-reuse is the dominant share of scope, of roughly ≤15-20h per family. This is directly measurable the moment the cohort is actually built: compare logged hours to the 163h estimate."
          - listitem [ref=f7e3970]:
            - strong [ref=f7e3971]: Within-family replication.
            - text: Nothing in this foundry — not durable-outbox, not CAA, not ui-action-record-replay — has ever shown that difficulty is a property of a family rather than of one package. If ≥2 of the 4 cohort families reach a stable, blind-labeled
            - code [ref=f7e3972]: CAPABILITY_FAILURE
            - text: verdict within the 6-trial cap, a second, independently-built package inside that
            - emphasis [ref=f7e3973]: same
            - text: family must also reproduce the capability failure before any claim of "this causal axis is hard" extends past the one package tested.
          - listitem [ref=f7e3974]:
            - strong [ref=f7e3975]: A genuine human-solvability data point.
            - text: Human-solvability evidence is 0 pass / 13 fail / 9 n/a across the entire 22-family foundry. Absent a human trial, "agents fail" cannot be distinguished from "the task is unfair or effectively unsolvable" — the same standard that disqualified four TB tasks in this track's own rejection criteria (a 0/30 solve rate is not by itself evidence of a good task). At least one of the four cohort families needs a human-solvability attempt before its result counts toward a scaling case.
          - listitem [ref=f7e3976]:
            - strong [ref=f7e3977]: Coverage of the rest of the top-10, not just the cohort.
            - text: Seven of the ten ranked candidates —
            - code [ref=f7e3978]: webhook-out-of-order-state-overwrite
            - text: ","
            - code [ref=f7e3979]: rollback-reactivates-dormant-defect
            - text: ","
            - code [ref=f7e3980]: clinical-bundle-partial-success-masking
            - text: ","
            - code [ref=f7e3981]: sql-identifier-injection-scope-expansion
            - text: ","
            - code [ref=f7e3982]: verifier-container-isolation-boundary
            - text: ","
            - code [ref=f7e3983]: fuzzy-instruction-cross-server-tool-discovery
            - text: ","
            - code [ref=f7e3984]: multi-day-state-carryforward-drift
            - text: — have no cohort slot, no kill gate, and no recipe overlay defined in this round. Scaling arithmetic toward 1,000 cannot be estimated honestly while 70% of even the pre-filtered top-10 shortlist is unplanned; a scaling recommendation needs kill-gate designs and build-hour estimates for those seven before the portfolio-level cost model means anything.
          - listitem [ref=f7e3985]:
            - strong [ref=f7e3986]: Zero fatal findings on an adversarial audit of a shipped cohort package
            - text: ", at the same depth applied to durable-outbox (which surfaced three false-pass bypasses) and CAA (which surfaced the recitable-trap and no-coverage-predictor flaws) — a cohort family that has never been adversarially audited cannot be cited as scaling evidence no matter how many clean capability-failure trials it accumulates."
        - heading "Mandatory pre-trial conditions" [level=3] [ref=f7e3987]
        - paragraph [ref=f7e3988]:
          - text: "Two of the four cohort families depend entirely on grader integrity for their result to mean anything:"
          - code [ref=f7e3989]: state-diff-collateral-damage-verification
          - text: "'s full-world-diff verifier must distinguish a lazy-bulk-call mutant from a reference solution's legitimate intended cascades, and"
          - code [ref=f7e3990]: narrow-assertion-reward-hacking
          - text: "'s loose/strict-arm checker pair must discriminate a scripted hollow artifact from a genuinely different-but-correct one. Given this repo's own history of two independent engines scoring 113/113 against a checker that was never actually exercised (durable-outbox's never-called-tool and monkeypatched-ground-truth bypasses),"
          - strong [ref=f7e3991]: no Phase-1 trial should be spent on either family until its Phase-0 discrimination check has actually run and been recorded
          - text: — not assumed, not skipped because the design "looks like" the durable-outbox pattern it was adapted from.
        - heading "Principal uncertainties in this cohort" [level=3] [ref=f7e3992]
        - list [ref=f7e3993]:
          - listitem [ref=f7e3994]:
            - strong [ref=f7e3995]:
              - code [ref=f7e3996]: narrow-assertion-reward-hacking
              - text: "'s source is a community discussion and rubric proposal"
            - text: (tb-discussion-224, tb-rubric-proposal), not a measured incident. Its causal-axis distinctness is asserted, not demonstrated against any per-trial base rate anywhere in this repo or externally.
          - listitem [ref=f7e3997]:
            - strong [ref=f7e3998]: The state-diff family's kill-gate design was proposed independently by two scorers
            - text: ", which reconciliation treated as corroboration — but neither proposal has been run. Convergent guesses are not evidence the mutant/reference pair actually behaves as designed."
          - listitem [ref=f7e3999]:
            - strong [ref=f7e4000]:
              - code [ref=f7e4001]: ui-action-replay-dom-mutation-timing
              - text: "'s cited primary source units do not exist anywhere in the discovery corpus or source ledgers"
            - text: — a live provenance gap that must be closed before this family could pass a ship-gate provenance review, independent of any trial outcome.
          - listitem [ref=f7e4002]:
            - strong [ref=f7e4003]: CAA Phase 18 is in-flight and untrialed.
            - text: The cdn-cache retest's calibration anchor is Phase 17 alone (n=4, one campaign). No Phase 18 result exists yet to cross-check whether CAA V1's diagnosed flaws, once fixed, actually raise difficulty — the cdn family is currently the
            - emphasis [ref=f7e4004]: only
            - text: test of that hypothesis anywhere in the program.
          - listitem [ref=f7e4005]:
            - strong [ref=f7e4006]:
              - code [ref=f7e4007]: ui-action-replay-dom-mutation-timing
              - text: is not in the ranked top-10
            - text: "— it was added to the cohort for evidentiary reasons (the only candidate anchored to the foundry's one replicated local capability gap) despite scoring outside the top-10 composite ranking. This is a real, unresolved tension for any scaling decision: prioritizing by score and prioritizing by strongest existing evidence do not currently point at the same set of families."
          - listitem [ref=f7e4008]:
            - strong [ref=f7e4009]:
              - text: All four
              - code [ref=f7e4010]: probabilityFullRecipe
              - text: estimates carry wide ranges
            - text: (e.g., 28%, range 10-45%, explicitly flagged low-confidence), reflecting reconciled scorer judgment, not data. Zero of the four families has run a trial; treat every number in this section's cohort data as a bet the Phase-0/Phase-1 plan exists specifically to resolve cheaply, not as a forecast to be defended.
