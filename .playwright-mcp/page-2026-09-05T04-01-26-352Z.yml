              - 'cell "stale-authoritative-state-reconciliation / stale-replica-authority-consistency: an instance of \"agent holds a cached, lagged, or non-authoritative view of state/authority and must reconcile against current true state rather than trusting the stale view,\" shared with this portfolio''s deployment-model-alias-rollout-drift, model-alias-drift-sentinel, delegated-wallet-scope-reconciliation, stale-crm-ticket-automation, caa-revalidation, and the retry-budget-carryover (failover-to-replica) candidate. This is the first instance grounded specifically in live Postgres physical streaming replication and recovery-conflict semantics rather than failover, caching, or alias-rollout semantics -- a materially distinct concrete mechanism within an already well-populated conceptual family, which tempers its noveltyPortfolioContribution score." [ref=f7e1840]'
            - row [ref=f7e1841]:
              - cell "14" [ref=f7e1842]
              - cell [ref=f7e1843]:
                - text: Multi-Day State Carryforward Drift (
                - code [ref=f7e1844]: multi-day-state-carryforward-drift
                - text: )
              - cell "A single trajectory simulates extended, multi-day professional work where later steps depend on state correctly carried forward from many earlier steps; a deterministic verifier inspects only the final end-state, so any single dropped or drifted piece of upstream context propagates silently to failure." [ref=f7e1845]
              - cell "Instruction frames a long chain of dependent operations over simulated extended time in a rich, multi-component environment; agent must plan and execute without intermediate checkpoint feedback, with some steps requiring genuine cross-domain expert judgment." [ref=f7e1846]
              - cell "long-horizon-planning-execution-monitoring" [ref=f7e1847]
              - cell "cross-domain terminal professional work (office/scientific/engineering/sysadmin)" [ref=f7e1848]
              - cell "tb-contribution-call, tb-google-design-doc, foundry-tua-bench" [ref=f7e1849]
              - cell "fresh-external" [ref=f7e1850]
              - cell "The agent's authority is scoped to the full multi-step task; the verifier is binary against the fully carried-forward final state with no partial credit for locally-correct-looking intermediate steps." [ref=f7e1851]
              - cell "No intermediate checkpoint signal is available during execution; whether earlier state was correctly carried forward is only knowable at the final verifier." [ref=f7e1852]
              - cell "number of dependent stages simulated; richness of the multi-component environment; required domain expertise; execution time budget." [ref=f7e1853]
              - cell "Reported gaps directly attribute failure to long-horizon planning, execution monitoring, and error recovery, with a substantial score jump (documented ~27 points) from extending the time budget alone." [ref=f7e1854]
              - cell "Full scope and rules are communicated up front; difficulty comes from sustaining correct execution over many steps, not hidden information." [ref=f7e1855]
              - cell "58/100" [ref=f7e1856]
              - 'cell "0.33% (range 0.2-0.45%, confidence: medium)" [ref=f7e1857]'
              - 'cell "0.15% (range 0.05-0.25%, confidence: medium)" [ref=f7e1858]'
              - cell "0.38%" [ref=f7e1859]
              - cell "0.75%" [ref=f7e1860]
              - cell "40h first / 10h marginal" [ref=f7e1861]
              - cell "Reuse an existing terminal harness already in this repo (e.g. the package-check/trials scaffolding) to build a minimal 4-6 stage, single-or-dual-domain prototype with exactly one clearly load-bearing state value that must be threaded through every stage, a deterministic end-state verifier, and zero intermediate checkpoints. Run one ordinary-quality frontier-model trial. If it cleanly reaches the correct final state -- especially by re-deriving the answer from the initial brief or late exploration rather than genuinely carrying the value through each stage -- that falsifies both the assumed difficulty premise and the anti-shortcut assumption cheaply, before any full multi-day cross-domain content is authored." [ref=f7e1862]
              - 'cell "Both independent scorers converged on the same core threat unprompted: because the verifier inspects only the final end-state with no forced checkpointing, it cannot distinguish an agent that genuinely tracked and carried state across every stage from one that reconstructed the correct final answer some other way (re-reading/re-deriving from the initial brief, or exploiting redundant cues left in the environment). If that shortcut path exists, pass/fail stops measuring long-horizon planning-execution-monitoring at all and instead just measures whether the terminal state is guessable -- silently invalidating the family''s central causal claim. This risk must be treated as load-bearing for the construction recipe (not just a nice-to-have), since it was independently identified twice." [ref=f7e1863]'
              - cell "long-horizon-planning-execution-monitoring" [ref=f7e1864]
