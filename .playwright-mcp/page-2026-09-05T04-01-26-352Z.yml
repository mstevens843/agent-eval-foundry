                - text: )
              - cell "When exposed to hundreds-to-thousands of tool schemas across many aggregated servers and applications -- including near-mirror bot/user identity pairs -- degraded context handling leads an agent to select a plausible-but-wrong tool, server, or identity variant, completing an action that looks right but never touches the intended system or acts under the intended authority." [ref=f7e1893]
              - cell "A workflow spans several real applications each contributing many similarly-named or similarly-prefixed tools (search_, list_, bot_ vs user_); with the full surface loaded, the agent must select the correct server, tool, and identity per step across a multi-turn workflow, graded by checking actual system-of-record authorship/state rather than superficial call success." [ref=f7e1894]
              - cell "tool-selection-failure" [ref=f7e1895]
              - cell "multi-application agent-tooling platform design (MCP aggregation)" [ref=f7e1896]
              - cell "klavis-klavis-repo" [ref=f7e1897]
