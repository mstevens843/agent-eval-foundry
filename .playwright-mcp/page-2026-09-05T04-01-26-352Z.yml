          - listitem [ref=f7e2616]:
            - strong [ref=f7e2617]: "Family-native difficulty operators:"
            - text: FHIR batch-vs-transaction contract literacy (outer 200 on a
            - code [ref=f7e2618]: batch
            - text: "bundle certifies only that the batch was processed, not that any entry committed) · multi-shape per-entry outcome classification (201 created / 200 matched-existing / synchronous 4xx reject / 202 async-pending resolved later) · identity reconciliation by client-supplied business identifier rather than server-assigned id · idempotent, chunk-safe retry construction that cannot duplicate an already-committed resource · terminal-vs-retryable rejection classification carrying a genuine escalation obligation · restart-durable reconciliation that re-derives commitment from the exchange instead of trusting local process state · consistent aggregation across multiple chunks when a batch exceeds the exchange's per-call entry limit · signal-precedence discipline: a confirmed terminal outcome for a business identifier must outrank any later, weaker, or duplicate signal about that identifier, rather than the naive-but-common \"most recent signal wins\" rule · correct attribution of an asynchronous completion to its originating submission cycle even when that completion resolves after a later cycle has already begun."
          - listitem [ref=f7e2619]:
            - strong [ref=f7e2620]: "Multi-file codebase sketch:"
            - text: "clinical-gateway/ (subject, ~1,600 lines): src/gateway/bundleBuilder.ts, httpClient.ts, entryOutcome.ts; src/reconcile/report.ts, retry.ts, resume.ts, decisionLog.ts (new); src/store/localQueue.ts; src/cli.ts; POLICY.md (published, agent-visible: reject-reason terminal/retryable taxonomy, conditional-create identifier contract, chunking limit). tests/ (the four visible suites under visibleTestStrategy — unchanged in count, gap widened). mock-hie/ (harness fixture): a persistent FHIR-facade resource store, a batch/transaction endpoint with real outer/inner status semantics, an async job-status endpoint, a duplicate/out-of-order completion replay hook (new), and an isolated, hash-chained append-only audit/notification log the subject container cannot reach. verifier/ (separate process/container): queries the store and audit log directly, checks the hash chain, replays report.json against independently derived truth, runs the b6-style rig-integrity checks, and applies the three-baseline self-check-coverage predictor described under privateVerifierArchitecture."
          - listitem [ref=f7e2621]:
            - strong [ref=f7e2622]: "Public outcome requirements:"
            - text: "Stated as domain literacy plus outcome obligations, never as a description of the bug: (i) the exchange follows the standard batch-bundle contract — the outer HTTP status of a"
            - code [ref=f7e2623]: batch
            - text: "response reflects that the batch was processed, not that every entry succeeded; per-entry results and, where the exchange defers a decision, an async job reference are carried in the response bundle. (ii) After each reconciliation cycle the report must state, per business identifier the gateway attempted to send, whether that resource is now retrievable from the exchange. (iii) An identifier not yet retrievable must be resubmitted exactly once it is safe to do so; an identifier already retrievable must never be resubmitted in a way that creates a second resource for it. (iv) The report and retry decisions must always reflect the exchange's current, confirmed state for each identifier rather than a stale or superseded view of it — this obligation holds no matter what interrupts or reorders the gateway's view of a cycle (a stop-and-restart, a multi-chunk batch, or an asynchronous result completing after a later cycle has begun), and once an identifier's outcome is confirmed it is authoritative: no later signal may silently overturn it. (v) A rejection documented in POLICY.md as permanent must be escalated, not retried; one documented as transient must be retried. None of this names which entries fail in a given run, that a restart, chunking limit, or out-of-order async completion will be injected, or which of several plausible code paths a given scenario's defect actually lives in. (Revision note: clause (iv) was reworded from an earlier draft that singled out \"restart between submission and reconciliation\" as a standalone trigger tracking the planted defect's exact symptom; it now folds restart, chunking, and async-completion timing into one general confirmed-state-is-authoritative principle, per the project's own standing distinction that fairness requires the graded rule stated, not the specific wrong implementation named.)"
          - listitem [ref=f7e2624]:
