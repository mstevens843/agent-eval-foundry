                - text: )
              - cell "Agent walks a large CRM record set via repeated paginated calls while other users or automations concurrently modify the same object; it must detect locator/cursor expiration, handle mid-run rate-limit exhaustion, and reconcile record drift across pages without silently truncating or duplicating the final set." [ref=f7e1749]
              - cell "A bulk export/audit/update task requires paging through hundreds of records; the harness expires the cursor mid-walk, trips a rate limit, or shifts membership across pages via concurrent writes, and correctness is judged on the final reconciled completeness/accuracy claim -- the agent must determine what was already safely processed before resuming." [ref=f7e1750]
