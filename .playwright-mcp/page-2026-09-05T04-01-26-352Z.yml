        - paragraph [ref=f7e2754]: Both D1 and D2 must be fixed for the full scenario battery to pass; each activates on a disjoint fixture subset (D1 needs a shared resource name reused across two builds in one run, D2 needs a declared path that resolves outside the container's own filesystem), so neither is discoverable or fixable by inspecting a single call site, and fixing one leaves the other's fixtures failing. This is the second, independent, comparably-difficult decision Phase 17's recommendation 3 asked for — not a second cosmetic variation on the same idea, and not the same anti-pattern the family's own axis already names.
        - paragraph [ref=f7e2755]:
