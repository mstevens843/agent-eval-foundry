        - paragraph [ref=f7e3463]:
          - strong [ref=f7e3464]: "Sequential trial spend plan:"
          - text: "Phase 0 (near-zero cost, run in parallel across all 4 families before any paid agent trial): execute each family's cheapestKillGate. For narrow-assertion-reward-hacking, this reuses the existing Hardened v2 recipe's B6 probe triad. For ui-action-replay-dom-mutation-timing, it's a single-fixture add to the already-working ui-replay-browser-backed harness plus 2-3 zero-shot agent reads. For cdn-cache-staleness-verification-gap, it's a single-turn, no-harness LLM-recall check across 3-5 models. For state-diff-collateral-damage-verification, it's a hand-built 10-15-record mini-world run once against reference and mutant solutions. Any family whose kill gate fails (agent trivially passes via recall, or the verifier fails to discriminate reference vs. mutant) is dropped from the cohort now, before a single dollar of real trial budget is spent, and its failure is logged under its current package hash -- never patched and re-tested under the same hash."
        - paragraph [ref=f7e3465]: "Phase 1 (paired trial, cheapest-surviving-family-first): for each family that survives Phase 0, spend build hours in ascending order of expectedBuildHours (narrow-assertion-reward-hacking 22h -> ui-action-replay-dom-mutation-timing 30h -> cdn-cache-staleness-verification-gap 36h -> state-diff-collateral-damage-verification 75h), so the cheapest, highest-confidence builds validate the sequential-spend procedure itself before the most expensive build (state-diff, with its bespoke per-instance cascade-allowlist authoring) is committed. For each family in that order: build the package once, freeze it under a content hash, then run exactly one Codex trial and one Claude trial (2 total) against the frozen package."
        - paragraph [ref=f7e3466]: "Blind-labeling: before anyone sees which engine produced which trajectory, an independent rater blind-labels each of the 2 outcomes as CLEAN_PASS, CAPABILITY_FAILURE (agent reasoned but got the mechanism wrong), or VALIDITY_DEFECT (leaking hint, ambiguous spec, verifier bypass, non-deterministic harness) -- engine identity and prior expectations are withheld from the rater until labeling is complete, mirroring this portfolio's own reader-review discipline."
        - paragraph [ref=f7e3467]: "Expansion rule (one trial at a time, target = 5-of-6 remaining achievable): treat 6 trials as the maximum budget per family (matching this portfolio's standard Phase-14-style early-stop convention) with a working target of achieving a genuine, non-clean-majority signal -- i.e., NOT reproducing an easy 5/6 or 6/6 clean sweep (that outcome is itself a kill signal per this repo's own pre-registered convention, exactly as it was for CAA V1). After the initial 2-trial pair: if 0 or 1 of the first 2 are CLEAN_PASS, add exactly one more trial (alternating engine) and re-check; continue one trial at a time only while a genuinely discriminating outcome (neither a clean sweep nor a total-failure sweep) remains mathematically reachable within the 6-trial cap. Stop immediately, without spending the remaining budget, the moment either (a) enough CLEAN_PASSes have already accumulated that even all-remaining-fails cannot avoid a >=5/6 clean-majority result (the family is too easy, kill), (b) enough failures have accumulated that a genuine capability-gap read is already established and further trials would only add cost without changing the verdict, or (c) any single trial is blind-labeled VALIDITY_DEFECT -- a validity defect stops spend on that family immediately regardless of trial count remaining, since no amount of additional trials can rescue a package whose grading itself is untrustworthy."
        - paragraph [ref=f7e3468]: "Never-repair rule: if a VALIDITY_DEFECT or an unwanted clean-sweep is found, the current package (reference solution, verifier, scenario set) is retired as-is under its existing content hash -- it is never edited and re-run against the same or new trials. All trials already run against it are retained as permanent evidence tagged to that hash (matching how this repo retained the superseded 245-check durable-outbox artifact's results as a documented coverage-defect finding rather than deleting them when the 267-check fix shipped). Any fix is built as a distinct new package version under a new hash, and that new version restarts Phase 1 from trial 1 -- it does not inherit or extend the old package's trial count toward the 5/6 target."
        - paragraph [ref=f7e3469]: "Sequencing across the 4-family cohort: because state-diff-collateral-damage-verification carries the highest build cost (75h) and the least automatable construction step (hand-authored cascade allowlists), its Phase 1 spend is deliberately sequenced last, after the cheaper three families' Phase-0/Phase-1 results have confirmed the blind-labeling and stopping procedure works as intended on lower-stakes builds."
        - heading "13. $100,000 implications" [level=2] [ref=f7e3470]
        - heading "Section 13 — $100,000 budget implications" [level=1] [ref=f7e3471]
        - heading "13. $100,000 budget implications" [level=2] [ref=f7e3472]
        - heading "13.1 What a trial costs, and why the anchor figure is cheaper than it should be trusted to stay" [level=3] [ref=f7e3473]
        - paragraph [ref=f7e3474]:
          - text: Phase 17's CAA V1 campaign is the only complete, priced trial campaign this project has run against a freshly-discovered candidate, so it is the right precedent to anchor to — but it needs one correction before it is used as a rate. The campaign ran 4 trials and stopped immediately under the S1 rule (all four were clean solves, so 5/6-or-6/6 failure was already arithmetically dead). Of those 4, only the 2 Anthropic attempts carry a price ($0.4328 + $0.4131 =
          - strong [ref=f7e3475]: $0.8460
          - text: ); the 2 OpenAI/Codex attempts are recorded
          - code [ref=f7e3476]: "costUsd: null"
          - text: because Codex reports token usage, not a dollar figure.
          - strong [ref=f7e3477]: The "$0.85 for four trials" figure is therefore a floor on two of the four attempts, not a measured total
          - text: — the true four-trial cost is unknown but almost certainly higher, plausibly $1.20–$1.70 if the unpriced pair costs anywhere near the priced pair.
        - paragraph [ref=f7e3478]:
          - text: "It is also cheap for a reason that should give pause: it is the trial cost of a"
          - strong [ref=f7e3479]: 15-line, one-decision reference that turned out too easy
          - text: — exactly the outcome this mission is trying to avoid, not an example of a package earning its keep. Cheap trials and clean solves come from the same mechanism (agents converge fast, the harness stops early); a package that actually produces a 5/6-or-6/6
          - emphasis [ref=f7e3480]: failure
          - text: pattern needs more attempts before that pattern is even visible, and this project's own campaign ledger (
          - code [ref=f7e3481]: reports/budget-plan.md
          - text: ","
          - code [ref=f7e3482]: data/measured-trial-costs.json
          - text: ) prices real trials on heavier, multi-surface packages — the kind these ten families are, with external ledgers, sidecars, and canaries rather than a bare function — at a mean of
          - strong [ref=f7e3483]: $9.62/trial
          - text: (median $7.74), with an effective
          - strong [ref=f7e3484]: $16.83 per counted run
          - text: and
          - strong [ref=f7e3485]: $57.72 per counted failure
          - text: once wasted/superseded runs are amortized in. That is the working rate used below; CAA V1's $0.21–$0.42-per-attempt figure is kept only as the authenticated floor for how cheap a trial
          - emphasis [ref=f7e3486]: can
          - text: be when a package is trivial.
