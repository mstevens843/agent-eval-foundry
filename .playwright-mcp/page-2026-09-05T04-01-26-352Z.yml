        - paragraph [ref=f7e3375]: "Three families reach materially above the portfolio floor because their own cards specify genuinely separate codebases per instance, not just relabeled ones: the narrow-assertion family's order-reservation, billing-exporter, and PII-redaction instances have different domains, different embedded defects, and different witness types (a ledger daemon, a golden differential oracle, and an audit-bucket scan, respectively); the fuzzy-instruction family's three catalogs differ in dependency-graph shape (a width-2 branch, an N-way per-patient fan-out, and a join-then-conditional-dispatch chain); the carryforward-drift family's three domains differ in which synthesis rule is graded (proration, calibration-factor recomputation, compound two-field consistency). The other seven families' three \"instances\" are, by their own text, the same decision surfaces and the same file skeleton with different domain nouns, so they are held at 1 (conservative) and credited only a packaging allowance, not a task-count allowance, at optimistic."
