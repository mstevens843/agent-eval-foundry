        - paragraph [ref=f7e408]: "SHIP GATE (reports/ship-gate-report.md): 37 gates (9 blocking, 5 schema-enforced, 23 advisory), no scoring/weighting/override -- a family ships only if every blocking gate passes. Only 2 of 22 families currently SHIP: ui-action-record-replay and ui-replay-live-dom. The other 20 are NOT-READY, blocked mainly by difficulty-evidenced (no real agent trial has failed this family for a capability-attributed reason: 2 pass / 20 fail). Six of those twenty are ALSO blocked by not-already-solved (every counted trial passed cleanly -- i.e. currently too easy): access-token-scope-expansion, caa-revalidation, dao-descendant, deployment-rollback-recompute, prompt-injection-containment, trading-reconciliation-recompute. Human-solvability evidence is essentially absent everywhere (0 pass / 13 fail / 9 n/a). family-diversity.md: 16 distinct mechanisms across the 22 families, 95 expected axes (81 measured / 14 estimated -- estimated axis counts are author guesses, not evidence)."
