        - list [ref=f7e410]:
          - listitem [ref=f7e411]: "The corrected 267-check artifact (commit c0e04eb, 24 scenarios / 15 schedules) produced 6 of 6 clean reward-zero frontier trials: 3/3 Codex (gpt-5.6-sol, xhigh) and 3/3 Opus (claude-opus-5, max effort). Confirmed via results/34-cc267-standard-matrix.md and spot-checked reward.txt files. This is a REPLICATED measurement: 12 clean trials across two independent operator runs, 0 solves both times (INHERITED-EVIDENCE.md sec 1.1)."
          - listitem [ref=f7e412]: An earlier 245-check artifact was "solved" by one engine (fh-claude-3) that still contained the identical ACKED to REVOKED bug -- it passed only because the earlier hidden-schedule family sampled the wrong parameter value (key_index != 0), not because the bug was fixed. This is documented in results/33-coverage-correction.md as a coverage/selection defect, explicitly NOT a capability solve.
          - listitem [ref=f7e413]: The ACKED-state rule is classified A2 (demanding-but-fair, derivable in 2 citations at inference depth 1) in docs/DEFECT-TAXONOMY.md sec A4, correcting an earlier, retracted A1 (unfair/underspecified) classification. Do not describe this as "an ambiguity that made the task unfair" -- describe it as a derivable rule whose derivation work carries real cognitive load, per the taxonomy's own correction.
          - listitem [ref=f7e414]: "THE A2-REPAIRED DIFFERENTIAL (control = unmodified SEMANTICS.md; treatment = SEMANTICS.md plus one inserted sentence \"ACKED and REVOKED are terminal: neither has an outgoing transition\") is an UNTRACKED, gitignored local experiment at tasks/dao-a2-control and tasks/dao-a2-treatment, run 2026-09-02, and is NOT narrated in any markdown file in the source repo. We pulled the raw numbers ourselves directly from each trial's result.json/reward.txt this session (treating opus-1b reruns as the counted trial in place of two cancelled opus-1 CancelledError runs): control = 2 of 6 solved (4/6 reward-zero); treatment = 3 of 6 solved (3/6 reward-zero). Cite this explicitly as \"derived by this research from raw trial artifacts, not narrated by the source project\" -- it is genuinely new data, not a previously-published finding."
          - listitem [ref=f7e415]: "Three earlier verifier bypasses (results/15-outbox-verifier-audit.md) were found and fixed before the 6/6 result: an engine that never called the tool scored 113/113 reward 1; an engine that monkeypatched the harness's in-process ground truth also scored 113/113; Postgres role-based ledger isolation was trivially bypassable (trust auth for all roles). The fix was a three-process split (tool_server owns the ledger as root; run_one is the only process that imports subject engine code; collect never imports engine code) specifically to prevent a subject from forging or reading ground truth."
          - listitem [ref=f7e416]:
            - text: All 9 main-branch commits in the source repo are authored by the current user (mstevens843,
            - link "mathewstevens7457@gmail.com" [ref=f7e417] [cursor=pointer]:
              - /url: mailto:mathewstevens7457@gmail.com
            - text: ); no LICENSE file exists; the task's own README ties its design to the author's own production systems (SolPulse trading platform, Agentic multi-wallet signer). We could not independently verify "not copied from a searchable upstream" beyond the absence of any upstream reference in the repo.
        - paragraph [ref=f7e418]: "CAA LINEAGE:"
        - list [ref=f7e419]:
          - listitem [ref=f7e420]: "Phase 17 (reports/PHASE-17-CAA-VALIDATION.md): verdict VALID-BUT-EASY. The registered first-stage campaign returned 4 of 4 clean solves, zero reward-zero, across both provider families, despite passing all 72 registered probe cells and 12 package controls (scored 85/85 on the contract gate). Diagnosed causes: the reference implementation is roughly 15-20 lines with one decision point (subject.run(view, caa) in about twenty lines per data/phase-18-construction-comparison.json); the forbidden-outcomes text literally named the historical anti-pattern in words, so agents simply avoided it; the contract gate had no self-check-coverage predictor despite the eventual 4/4 clean-solve outcome."
          - listitem [ref=f7e421]:
            - text: "Phase 18 (CAA V2) is ACTIVE, IN-FLIGHT, UNTRIALED as of this research: a multi-file Go certificate service (/app/certd) with out-of-order concurrent authority responses, an append-only external audit log, and container-isolated verification, explicitly built against the Phase 17 postmortem. It self-declares a process deviation (built before scenario selection, mutant bank, reader review, or subject trial). DO NOT report Phase 18 as concluded, and do not read or reference specific numeric predictions from it as if they were measured outcomes -- describe it only as \"in progress\" and do not touch any data/phase-18-"
