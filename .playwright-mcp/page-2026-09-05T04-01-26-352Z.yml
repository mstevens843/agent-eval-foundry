                - text: )
              - cell "Agent makes an authoritative change at an origin system (a DNS record or a CDN-fronted asset) and must correctly verify propagation despite intermediate caching layers that are contractually permitted to serve stale data until TTL- or purge-type-specific windows lapse, choosing the correct purge type and multi-tier verification sequence rather than treating one re-fetch as proof." [ref=f7e1581]
              - cell "Agent updates an origin resource then issues a purge (soft, hard, tag, or prefix) against a simulated multi-tier CDN and/or updates a DNS record; the harness enforces the documented stale-serve window, tier-revalidation semantics (EXPIRED vs MISS), and purge rate limits, and the agent must choose a verification sequence that correctly distinguishes legally-stale from genuinely failed propagation." [ref=f7e1582]
