          - text: /
          - code [ref=f7e2121]: selfCheckCoverage
          - text: functions are reused verbatim; only new
          - code [ref=f7e2122]: GradedRule
          - text: "data is added) into three family-specific rules, one per decision surface:"
        - list [ref=f7e2123]:
