        - heading "6.2 Per-project detail" [level=2] [ref=f7e958]
        - heading [level=3] [ref=f7e959]:
          - text: 6.2.1 CLI-Universe —
          - code [ref=f7e960]: foundry-cli-universe
        - list [ref=f7e961]:
          - listitem [ref=f7e962]:
            - strong [ref=f7e963]: "Repo / pinned state:"
            - text: No GitHub URL was surfaced; the citable artifact is arXiv:2606.22883v1 ("Towards Verifiable Task Synthesis Engine for Terminal Agents," submitted 2026-06-22, 17 authors led by Zhanbo Hua and Yifan Yao), plus the released dataset name CLI-Universe-6K.
          - listitem [ref=f7e964]:
            - strong [ref=f7e965]: "Classification:"
            - text: "True"
            - strong [ref=f7e966]: foundry
            - text: — a synthesis engine, not a fixed task bank. Its own output is training data (SFT for Qwen3 8B/14B/32B), evaluated externally on Terminal-Bench 2.0 (32B reaches 33.4%).
          - listitem [ref=f7e967]:
            - strong [ref=f7e968]: "Production unit:"
            - text: one blueprint → one Dockerized environment → one hint-guided solver trajectory, generated by teacher model Kimi-K2.6 and cross-checked with DeepSeek-V4-Pro.
          - listitem [ref=f7e969]:
            - strong [ref=f7e970]: "Source provenance:"
            - text: candidates sampled across a 4-axis taxonomy (domain, skill type, capability, engineering pillar), then grounded via "evidence-guided deep research" over real repos, docs, issues, tutorials, and examples.
          - listitem [ref=f7e971]:
            - strong [ref=f7e972]: "Task-generation method:"
            - text: "candidates needing unavailable tools or with conflicting constraints are discarded at the grounding step. This step is shown empirically to raise difficulty: grounded/refined tasks require 3.45× more solver turns and drop pass rate by 13.3 points versus unrefined candidates — a rare"
            - emphasis [ref=f7e973]: quantified
            - text: difficulty-construction signal, not an assumed one.
          - listitem [ref=f7e974]:
            - strong [ref=f7e975]: "Verifier design:"
            - text: a three-stage, formally enforced gate — (1) rubric-gated test construction (correctness/determinism/edge-case rubrics, validated at 91% pass rate against official Terminal-Bench 2 solutions), (2) hint-conditional filtering (kept only if hint-free solve fails and hint-guided solve succeeds, removing trivial tasks), (3) fail-to-pass checking (tests fail pre-solution, pass post-solution).
          - listitem [ref=f7e976]:
            - strong [ref=f7e977]: "Filtering / difficulty estimation:"
            - text: ~two-thirds of candidates discarded overall (33.6% end-to-end retention). Blueprint acceptance is reviewed by both human and LLM judges, with rubric-based revision lifting acceptance from 72%→91% (human) and 75%→93% (LLM) — an explicit, quantified review loop rather than one pass/fail gate.
          - listitem [ref=f7e978]:
            - strong [ref=f7e979]: "Evidence of prospective yield:"
            - text: strong. The refinement-vs-unrefined turn/pass-rate delta and the 33.6% retention rate are both forward-measured construction statistics, and the downstream 32B model's 33.4% on an
            - emphasis [ref=f7e980]: external
            - text: benchmark (Terminal-Bench 2.0) is an out-of-sample transfer signal, not a retrospective cherry-pick.
          - listitem [ref=f7e981]:
            - strong [ref=f7e982]: "Semantic-duplication handling:"
            - text: not addressed in the gathered evidence beyond axis-based sampling diversity; no explicit near-duplicate/embedding-dedup step is described.
          - listitem [ref=f7e983]:
            - strong [ref=f7e984]: "Cost / throughput:"
            - text: no $/task or tasks-per-hour figures were captured in this pass.
          - listitem [ref=f7e985]:
            - strong [ref=f7e986]: "Techniques worth adopting:"
            - text: the fail-to-pass + hint-conditional double gate (equivalent in spirit to this project's own
            - code [ref=f7e987]: reference-passes
            - text: /
            - code [ref=f7e988]: baselines-blocked
            - text: gates, but adds the
            - emphasis [ref=f7e989]: hint-conditional
            - text: triviality filter this project's gate table doesn't have); the quantified refinement-difficulty delta (3.45× turns, −13.3 pts) as a template for how to
            - emphasis [ref=f7e990]: report
            - text: that a grounding/refinement step increased difficulty, rather than merely asserting it; the dual human+LLM blueprint-acceptance loop with tracked before/after rates.
          - listitem [ref=f7e991]:
            - strong [ref=f7e992]: "Limitations / unsupported claims:"
            - text: no repository was locatable, so pinned code state cannot be verified independently of the paper's own self-report; semantic-duplication and cost/throughput are simply absent from what was gathered, not confirmed absent from the system.
        - heading [level=3] [ref=f7e993]:
          - text: 6.2.2 TUA-Bench —
          - code [ref=f7e994]: foundry-tua-bench
        - list [ref=f7e995]:
          - listitem [ref=f7e996]:
            - strong [ref=f7e997]: "Repo / pinned state:"
            - text: github.com/facebookresearch/TUA-Bench; arXiv:2606.28480; project site tuabench.ai.
          - listitem [ref=f7e998]:
            - strong [ref=f7e999]: "Classification:"
            - text: a
            - strong [ref=f7e1000]: filtered/curated benchmark corpus
            - text: running on the Harbor runner (same orchestration as Terminal-Bench), not a generative foundry — it does not synthesize novel tasks from raw source material at scale. It does have a real, non-trivial
            - emphasis [ref=f7e1001]: construction
            - text: pipeline for two of its 120 tasks, which is worth crediting separately from "static corpus."
          - listitem [ref=f7e1002]:
            - strong [ref=f7e1003]: "Production unit:"
            - text: each of 120 tasks runs in an isolated, resettable Linux container (Docker/Podman) via Harbor, with a deterministic setup script and an in-environment automatic verifier returning a scalar reward (tolerance thresholds, e.g. 1% relative, for simulations; LLM-as-judge for some subjective outputs; artifacts collected from
            - code [ref=f7e1004]: /app/artifacts
            - text: ).
          - listitem [ref=f7e1005]:
            - strong [ref=f7e1006]: "Source provenance:"
            - text: "two tracks. \"Everyday\" (100 tasks): converted from OSWorld's 369 GUI tasks by rewriting instructions for a terminal setting. \"Professional\" (20 tasks): co-designed with PhD-level domain experts (biology, medical physics, architectural/mechanical engineering) from an initial pool of 25."
          - listitem [ref=f7e1007]:
            - strong [ref=f7e1008]: "Task-generation method:"
            - text: everyday track — human-verify for input/gold mismatches after conversion, then run the converted candidates through three frontier models (GPT-5.5, Claude Opus 4.7, Gemini 3.1 Pro), five trials each, and keep only the 100 with the
            - emphasis [ref=f7e1009]: lowest
            - text: solvability. Professional track — filter the 25-candidate pool down to 20, removing ambiguous instructions, overly-simple solutions, and verifier mismatches.
          - listitem [ref=f7e1010]:
            - strong [ref=f7e1011]: "Verifier design:"
            - text: Harbor-based automatic verifier per task, mixing deterministic tolerance checks and LLM-as-judge for subjective outputs.
          - listitem [ref=f7e1012]:
            - strong [ref=f7e1013]: "Filtering / difficulty estimation:"
            - text: difficulty-aware selection
            - emphasis [ref=f7e1014]: is
            - text: the construction method for the everyday track — a benchmark explicitly built by selecting for tasks that already fail most frontier trials, directly analogous to a "not-already-solved" style gate.
          - listitem [ref=f7e1015]:
            - strong [ref=f7e1016]: "Evidence of prospective yield:"
            - text: "strong for the selection method itself (it is the yield mechanism), and separately confirmed post hoc: best frontier agent (Claude Code + Opus 4.8, max reasoning) scores only 65.8%, and the paper reports \"near-horizontal red bands\" of tasks failing nearly all model/scaffold/effort configurations — task-intrinsic difficulty, not agent-specific weakness. A 27.1-point score gain from extending the time budget 150s→2400s further points to long-horizon planning/monitoring/recovery as the dominant failure axis."
          - listitem [ref=f7e1017]:
            - strong [ref=f7e1018]: "Semantic-duplication handling:"
            - text: not addressed in the gathered evidence.
          - listitem [ref=f7e1019]:
            - strong [ref=f7e1020]: "Cost / throughput:"
            - text: no $/task or throughput figures captured.
          - listitem [ref=f7e1021]:
            - strong [ref=f7e1022]: "Techniques worth adopting:"
            - text: the solvability-filtered curation pattern itself — run every candidate through multiple frontier models × multiple trials
            - emphasis [ref=f7e1023]: before
            - text: admitting it, keep only the lowest-solvability subset — is a direct, cheap analog to this project's own difficulty-evidence requirement, and could be applied as a pre-filter ahead of full family build. The extended-time-budget ablation (150s→2400s) is a clean, reusable way to separate "task-intrinsic difficulty" from "agent ran out of time."
          - listitem [ref=f7e1024]:
            - strong [ref=f7e1025]: "Limitations / unsupported claims:"
            - text: the paper's own framing of "task-intrinsic difficulty" rests on cross-configuration invariance, which is real evidence but does not by itself rule out a shared blind spot across all tested frontier models/scaffolds; the professional track's expert co-design process is described only at a summary level (no detail on how ambiguity was operationalized before human filtering).
        - heading [level=3] [ref=f7e1026]:
          - text: 6.2.3 Terminal-Bench / Harbor —
          - code [ref=f7e1027]: foundry-terminal-agent-lab
        - list [ref=f7e1028]:
          - listitem [ref=f7e1029]:
            - strong [ref=f7e1030]: "Evidence-quality note:"
            - text: no repo or organization literally named "terminal-agent-lab" exists; the investigator substituted the closest genuine match. This substitution should be treated as a locator mismatch, not a confirmed identification of a project by that name.
          - listitem [ref=f7e1031]:
            - strong [ref=f7e1032]: "Repo / pinned state:"
            - text: canonical repo moved from
            - code [ref=f7e1033]: laude-institute/terminal-bench
            - text: to
            - code [ref=f7e1034]: harbor-framework/terminal-bench
            - text: ; produced by the Laude Institute with Stanford, Snorkel AI joining for v2.0.
          - listitem [ref=f7e1035]:
            - strong [ref=f7e1036]: "Classification:"
            - text: a
            - strong [ref=f7e1037]: task-authoring framework + runner
            - text: ", not a generative foundry — task creation is manual per author against an enforced schema; Harbor supplies the container/reward-file contract and CI checks, not task synthesis."
          - listitem [ref=f7e1038]:
            - strong [ref=f7e1039]: "Production unit:"
            - text: a task directory containing
            - code [ref=f7e1040]: instruction.md
            - text: (spec),
            - code [ref=f7e1041]: task.toml
            - text: "(metadata: resource limits, network mode, timeouts, verifier mode),"
            - code [ref=f7e1042]: environment/Dockerfile
            - text: (isolated container),
            - code [ref=f7e1043]: solution/solve.sh
            - text: (oracle solution),
            - code [ref=f7e1044]: tests/test.sh
            - text: (verifier emitting a numeric reward to
            - code [ref=f7e1045]: /logs/verifier/reward.txt
            - text: ).
          - listitem [ref=f7e1046]:
            - strong [ref=f7e1047]: "Source provenance:"
            - text: professional-domain realism across scientific computing, ML training, security, sysadmin, and data-science CLI workflows; 89 curated Terminal-Bench-2.0 tasks at roughly 3 reviewer-hours each per earlier search results (not independently re-verified in this pass).
          - listitem [ref=f7e1048]:
            - strong [ref=f7e1049]: "Task-generation method:"
            - text: "none in the automated sense — authors write each task by hand. CI-enforced (formal) requirements: the reward file must exist and be numeric; the oracle solution script must be executable and must drive"
            - code [ref=f7e1050]: reward=1
            - text: under
            - code [ref=f7e1051]: harbor run -a oracle
            - text: "; the Dockerfile must install stated dependencies; solution and test paths must agree. Recommended-but-unenforced: rich"
            - code [ref=f7e1052]: task.toml
            - text: metadata, clear
            - code [ref=f7e1053]: instruction.md
            - text: ", troubleshooting notes, pytest or \"Reward Kit\" for multi-criterion/LLM-judge scoring. Mere convention: which specific test framework or reward granularity a task uses."
          - listitem [ref=f7e1054]:
            - strong [ref=f7e1055]: "Verifier design:"
            - text: container-based, running either "shared" (inside the agent's own workdir) or "separate" (an isolated grading container), with declared network modes (public/no-network/allowlist) bounding reachability.
          - listitem [ref=f7e1056]:
            - strong [ref=f7e1057]: "Filtering / difficulty estimation:"
            - text: a documented "Adversarial Exploit Agent" review step specifically probes whether a task's verifier can be satisfied via an unintended shortcut before acceptance — an explicit, named safeguard against weak verification, though no aggregate pass/reject rate for this step was captured.
          - listitem [ref=f7e1058]:
            - strong [ref=f7e1059]: "Evidence of prospective yield:"
            - text: partial — the Adversarial Exploit Agent check is real evidence of a forward-looking acceptance gate, but no quantified yield/attrition statistic (e.g., % of authored tasks rejected) was found in what was fetched.
          - listitem [ref=f7e1060]:
            - strong [ref=f7e1061]: "Semantic-duplication handling:"
            - text: not addressed in the gathered evidence.
          - listitem [ref=f7e1062]:
            - strong [ref=f7e1063]: "Cost / throughput:"
            - text: ~3 reviewer-hours per task (89 TB2.0 tasks), from earlier search results — not independently re-confirmed here.
          - listitem [ref=f7e1064]:
            - strong [ref=f7e1065]: "Techniques worth adopting:"
            - text: the Adversarial Exploit Agent as a named, dedicated pre-publication step whose sole job is to try to game the verifier — directly comparable to, and worth cross-checking against, this project's own adversarial-audit reports; the documented agent-failure taxonomy (Disobey Task Specification, Premature Termination, Reasoning-Action Mismatch, Context Loss, Step Repetition, Weak Verification) is a ready-made checklist for mechanism design.
          - listitem [ref=f7e1066]:
            - strong [ref=f7e1067]: "Limitations / unsupported claims:"
            - text: Harbor's own docs state the
            - emphasis [ref=f7e1068]: only
            - text: CI-enforced verifier requirement is that
            - code [ref=f7e1069]: test.sh
            - text: emit a numeric reward file — the semantic strength of any given check is left entirely to the task author, so "verified" here means schema-valid, not necessarily hard-to-game, which is precisely why the paper needed a separate Adversarial Exploit Agent step.
        - heading [level=3] [ref=f7e1070]:
          - text: 6.2.4 MCP-Bench —
          - code [ref=f7e1071]: foundry-mcp-bench
        - list [ref=f7e1072]:
          - listitem [ref=f7e1073]:
            - strong [ref=f7e1074]: "Evidence-quality note:"
            - text: the arXiv PDF's byte stream could not be decompressed locally; the paper-level quotes below came through a secondary, search-mediated fetch rather than a directly-verified full-text read. The GitHub README fetch was thin on methodology specifics. Treat this entry as
            - strong [ref=f7e1075]: partial depth
            - text: .
          - listitem [ref=f7e1076]:
            - strong [ref=f7e1077]: "Repo / pinned state:"
            - text: github.com/Accenture/mcp-bench; paper arXiv:2508.20453.
          - listitem [ref=f7e1078]:
            - strong [ref=f7e1079]: "Classification:"
            - text: a genuine
            - strong [ref=f7e1080]: generator
            - text: — synthetic tasks over real, live infrastructure (28 MCP servers, 250 tools spanning finance, travel, biomedical research, geospatial mapping, academic search, crypto, nutrition).
          - listitem [ref=f7e1081]:
            - strong [ref=f7e1082]: "Production unit:"
            - text: one natural-language task instance requiring an agent to discover, select, and chain tools across 1, 2, or 3 servers (single/multi-server splits).
          - listitem [ref=f7e1083]:
            - strong [ref=f7e1084]: "Source provenance:"
            - text: real, live MCP servers and their tool schemas.
          - listitem [ref=f7e1085]:
            - strong [ref=f7e1086]: "Task-generation method:"
            - text: a pipeline first mines real tool-dependency chains (how one tool's output plausibly feeds another's input), an LLM synthesizes tasks along those chains, and outputs are quality-filtered (kept only if scoring ≥9.0/10 solvability and ≥5.0/10 utility). A distinguishing step converts tasks into "fuzzy" variants that strip explicit tool names/steps so agents must infer tools from conversational cues alone.
          - listitem [ref=f7e1087]:
            - strong [ref=f7e1088]: "Verifier design:"
            - text: rule-based checks (tool-name validity, schema compliance, execution success, dependency compliance) combined with LLM-as-judge scoring (o4-mini) across task completion, tool-usage rationale, and planning effectiveness — explicitly required to be "grounded solely in observable evidence from the task definition, final solution, and execution trace," with prompt-order shuffling and 5-pass averaging to reduce judge variance/bias, validated against human annotation agreement.
          - listitem [ref=f7e1089]:
            - strong [ref=f7e1090]: "Filtering / difficulty estimation:"
            - text: difficulty is constructed via server count (1–3) and workflow topology (linear, parallel, hybrid compositions of tool calls), on top of the solvability/utility quality filter.
          - listitem [ref=f7e1091]:
            - strong [ref=f7e1092]: "Evidence of prospective yield:"
            - text: real but incomplete — across 20 frontier LLMs, dependency-awareness and parallelism-efficiency scores rarely exceed 0.30, and performance degrades sharply as server count rises (more steeply for weaker models); weaker models take 17+ execution rounds versus 6–8 for strong ones. However, no candidate-pool-size-to-retained-task attrition rate was captured, so the
            - emphasis [ref=f7e1093]: construction-side
            - text: yield (how many synthesized candidates get discarded) is unknown from this pass.
          - listitem [ref=f7e1094]:
            - strong [ref=f7e1095]: "Semantic-duplication handling:"
            - text: not addressed beyond the solvability/utility quality thresholds; no explicit near-duplicate detection step was found.
          - listitem [ref=f7e1096]:
            - strong [ref=f7e1097]: "Cost / throughput:"
            - text: not captured.
          - listitem [ref=f7e1098]:
            - strong [ref=f7e1099]: "Techniques worth adopting:"
            - text: the fuzzy-variant transformation (deliberately stripping explicit tool names/steps to force inference from context) is a cheap, reusable difficulty knob applicable to any tool-calling task family in this project; the judge-bias controls (grounded-in-trace-only rubric, prompt-order shuffling, 5-pass averaging, validated against human agreement) are a concrete template if this project ever adds LLM-judge scoring to a verifier.
          - listitem [ref=f7e1100]:
            - strong [ref=f7e1101]: "Limitations / unsupported claims:"
            - text: given the PDF-parsing failure, the specific numeric quotes above should be treated as coming from a secondary source rather than a directly-verified primary read; no discussion of authority/permission boundaries was found in what was retrieved, so this benchmark's applicability to this project's authority-boundary mechanism family is unconfirmed, not disconfirmed.
        - heading [level=3] [ref=f7e1102]:
          - text: 6.2.5 Toolathlon (and Toolathlon-mvp) —
          - code [ref=f7e1103]: foundry-toolathlon
        - list [ref=f7e1104]:
          - listitem [ref=f7e1105]:
            - strong [ref=f7e1106]: "Evidence-quality note:"
            - text: depth achieved was "readme-only."
          - listitem [ref=f7e1107]:
            - strong [ref=f7e1108]: "Repo / pinned state:"
            - text: hkust-nlp/Toolathlon (ICLR 2026 submission, arXiv:2510.25726), current release labeled "Toolathlon-Verified." Klavis-AI/Toolathlon-mvp is confirmed to be a separate, downstream reference implementation, not a fork or alternate benchmark — its own README states it is "a self-contained, minimal example for running Toolathlon benchmark tasks end-to-end using the Klavis AI Sandbox API and the OpenAI Agents SDK," explicitly built to be replaced by users' own agent infra.
          - listitem [ref=f7e1109]:
            - strong [ref=f7e1110]: "Classification:"
            - text: a manually curated
            - strong [ref=f7e1111]: benchmark corpus + execution-based verifier suite
            - text: ", not a generative foundry — tasks are described as \"manually sourced or crafted,\" not synthesized from source material by an automated pipeline."
          - listitem [ref=f7e1112]:
            - strong [ref=f7e1113]: "Production unit:"
            - text: one task spanning 32 real applications and 604 tools (Google Calendar, Notion, WooCommerce, Kubernetes, BigQuery, Canvas LMS, email/dovecot, etc.), requiring ~20 tool-call turns on average and up to 5,400s execution time.
          - listitem [ref=f7e1114]:
            - strong [ref=f7e1115]: "Source provenance:"
            - text: real applications with realistic, non-trivial initial states (e.g., "Canvas courses with dozens of students," "real financial spreadsheets").
          - listitem [ref=f7e1116]:
            - strong [ref=f7e1117]: "Task-generation method:"
            - text: manual sourcing/crafting of 108 tasks; the "Verified" release label denotes a review/alignment pass on prompts, ground truths, and evaluators before final release — an explicit multi-stage review process, but not algorithmic generation.
          - listitem [ref=f7e1118]:
            - strong [ref=f7e1119]: "Verifier design:"
            - text: execution-based — "each task is strictly verifiable through dedicated evaluation scripts," not subjectively judged.
          - listitem [ref=f7e1120]:
            - strong [ref=f7e1121]: "Filtering / difficulty estimation:"
            - text: not described beyond the review/alignment pass implied by "Verified."
          - listitem [ref=f7e1122]:
            - strong [ref=f7e1123]: "Evidence of prospective yield:"
            - text: real difficulty evidence, though retrospective rather than construction-time — best model (Claude-4.5-Sonnet) scores only 38.6% success at 20.2 turns average; best open-weight model scores 20.1%.
          - listitem [ref=f7e1124]:
            - strong [ref=f7e1125]: "Semantic-duplication handling:"
            - text: not addressed in the gathered evidence.
          - listitem [ref=f7e1126]:
            - strong [ref=f7e1127]: "Cost / throughput:"
            - text: the up-to-5,400s-per-task execution ceiling is a real throughput constraint; no $ cost figure was found.
          - listitem [ref=f7e1128]:
            - strong [ref=f7e1129]: "Techniques worth adopting:"
            - text: the Klavis-AI wrapper's credential-injection ("hijacking") pattern — network socket patching, URL rewriting, file-open redirection to transparently swap hardcoded local credentials for remotely-issued sandbox secrets — is a reusable technique for running a fixed task suite against different credential/authority backends without touching task code, relevant to any family in this project that currently hardcodes authority objects.
          - listitem [ref=f7e1130]:
            - strong [ref=f7e1131]: "Limitations / unsupported claims:"
            - text: the "strictly verifiable... not judged subjectively" claim for the core Toolathlon suite is the source's own self-report and was not independently checked against a sample eval script; with only a README read (no paper full-text fetch), the review/alignment methodology behind "Verified" is not detailed beyond the label itself.
        - heading [level=3] [ref=f7e1132]:
          - text: 6.2.6 SWE-bench and derivatives —
          - code [ref=f7e1133]: foundry-swe-bench
        - list [ref=f7e1134]:
          - listitem [ref=f7e1135]:
            - strong [ref=f7e1136]: "Evidence-quality note:"
            - text: the OpenAI blog post announcing SWE-bench Verified returned HTTP 403 directly and had no reachable archive.org mirror; its content was read via a third-party quotation rather than the primary page. Treat those specific figures as secondhand.
          - listitem [ref=f7e1137]:
            - strong [ref=f7e1138]: "Repo / pinned state:"
            - text: Jimenez, Yang, Wettig et al., ICLR 2024; swebench.com/original.html and swebench.com/verified.html as canonical pages.
          - listitem [ref=f7e1139]:
            - strong [ref=f7e1140]: "Classification:"
            - text: a canonical
            - strong [ref=f7e1141]: foundry
            - text: — real GitHub mining, automated filtering, an execution-based verifier, and measured outcomes across many models.
          - listitem [ref=f7e1142]:
            - strong [ref=f7e1143]: "Production unit:"
            - text: one GitHub issue + its resolving PR, packaged as a per-commit Docker environment, graded by a test-based verifier.
          - listitem [ref=f7e1144]:
            - strong [ref=f7e1145]: "Source provenance:"
            - text: 12 popular Python repositories, mined for ~90,000 candidate PRs.
          - listitem [ref=f7e1146]:
            - strong [ref=f7e1147]: "Task-generation method:"
            - text: attribute filtering (merged, resolves a linked issue, modifies test files) followed by execution filtering — install the repo, apply the PR's test patch, apply the gold code patch, and confirm at least one test flips fail-to-pass in a per-commit Docker environment — yielding 2,294 final tasks (≈2.5% of the initial 90,000 candidates).
          - listitem [ref=f7e1148]:
            - strong [ref=f7e1149]: "Verifier design:"
            - text: purely test-based. FAIL_TO_PASS tests (avg 9.1/instance) must newly pass; PASS_TO_PASS tests (median 51/instance) must stay passing. The agent receives only the issue text; the tests are held out.
          - listitem [ref=f7e1150]:
            - strong [ref=f7e1151]: "Filtering / difficulty estimation:"
            - text: the execution-filter pipeline is itself a scope-narrowing filter as much as a quality filter — it systematically favors PRs with clean, isolable, test-verifiable diffs. A later critique showed this skews the released Verified split to 85.8% single-file vs. ~50% multi-file in SWE-bench's own training PRs, with top-system resolve rates collapsing on the multi-file remainder (from roughly 55–60% down to 8–25%).
          - listitem [ref=f7e1152]:
            - strong [ref=f7e1153]: "Evidence of prospective yield:"
            - text: "strongly quantified at two layers: (1) construction attrition, ~90,000 candidates → 2,294 tasks; (2) OpenAI's independent human review (93 Python developers annotating 1,699 samples on a 0–3 severity scale) found 38.3% of issue statements underspecified and 61.1% contained tests that could unfairly reject valid alternative solutions, discarding 68.3% of samples overall to reach the 500-task Verified set — after which GPT-4o's measured pass rate rose from 16% to 33.2% on the same underlying difficulty. This is direct evidence that automated GitHub-mined filtering alone does not guarantee a fair, unambiguous verifier."
          - listitem [ref=f7e1154]:
            - strong [ref=f7e1155]: "Semantic-duplication handling:"
            - text: not addressed explicitly; each task is tied to a unique repo+issue+PR, which structurally limits duplication risk, but no active dedup step is described.
          - listitem [ref=f7e1156]:
            - strong [ref=f7e1157]: "Cost / throughput:"
            - text: the ~2.5% candidate-to-task retention rate is itself the clearest quantified throughput figure among all 15 projects surveyed.
          - listitem [ref=f7e1158]:
            - strong [ref=f7e1159]: "Techniques worth adopting:"
            - text: the fail-to-pass / pass-to-pass split as a template for "did the fix work and did it break anything else"; more importantly, the OpenAI Verified re-annotation is a strong, adoptable model for periodically auditing an existing verifier suite for issue-underspecification and test-overfit rather than trusting an automated pipeline's first pass indefinitely.
          - listitem [ref=f7e1160]:
            - strong [ref=f7e1161]: "Limitations / unsupported claims:"
            - text: the construction pipeline's own cleanliness requirements (isolable diff, applies without conflict, deterministic fail-to-pass transition) implicitly select for narrow single-file changes, undersampling the cross-file coordination topology where agents actually fail most — a structural bias worth naming explicitly if this project ever adopts a similar attribute+execution filter for its own real-source-material families.
        - heading [level=3] [ref=f7e1162]:
          - text: 6.2.7 OSWorld —
          - code [ref=f7e1163]: foundry-osworld
        - list [ref=f7e1164]:
          - listitem [ref=f7e1165]:
            - strong [ref=f7e1166]: "Repo / pinned state:"
            - text: github.com/xlang-ai/OSWorld; Xie et al., NeurIPS 2024, arXiv:2404.07972. Confirmed via a live task-config JSON pulled directly from the repo (
            - code [ref=f7e1167]: evaluation_examples/examples/chrome/030eeff7-b492-4218-b312-701ec99ee0cc.json
            - text: ), not just the paper's paraphrase.
          - listitem [ref=f7e1168]:
            - strong [ref=f7e1169]: "Classification:"
            - text: a
            - strong [ref=f7e1170]: human-labor foundry
            - text: "— a real path from source material to candidate to multi-round QC to executable verifier to measured outcome, but the candidate-generation step is human authorship, not automated synthesis. It should not be conflated with a static corpus: the authoring and QC process is itself a real, labor-intensive pipeline."
          - listitem [ref=f7e1171]:
            - strong [ref=f7e1172]: "Production unit:"
            - text: one of 369 tasks (268 single-app + 101 cross-app), run against a real Ubuntu/Windows/macOS VM snapshot, scored by a per-task Python "evaluator" — not an LLM judge.
          - listitem [ref=f7e1173]:
            - strong [ref=f7e1174]: "Source provenance:"
            - text: tutorials, forums, and how-to sites, sourced by 9 CS-student authors over ~1,800 hours.
          - listitem [ref=f7e1175]:
            - strong [ref=f7e1176]: "Task-generation method:"
            - text: each candidate task was cross-checked by two other authors for feasibility/ambiguity/source-alignment, then independently re-attempted by two non-authoring authors as acceptance QC, plus ~400 further hours fixing issues across four review rounds — an enforced multi-reviewer bar, not self-certification.
          - listitem [ref=f7e1177]:
            - strong [ref=f7e1178]: "Verifier design:"
            - text: "the schema pulled directly from the repo shows: an"
            - code [ref=f7e1179]: instruction
            - text: ", a"
            - code [ref=f7e1180]: config
            - text: launch step that spawns the target app, and an
            - code [ref=f7e1181]: evaluator
            - text: block naming a getter function that extracts final-state artifacts (files, a Chrome preference flag, accessibility-tree text) plus a rule/exact-match check against an expected value. The same example's
            - code [ref=f7e1182]: postconfig
            - text: blurs UI focus, sleeps, force-kills Chrome, relaunches it with a debug port, and sleeps again
            - emphasis [ref=f7e1183]: before
            - text: reading state — the verifier does not trust raw post-episode state and must actively force a settle/flush before it is checkable. Reward is scalar 0–1 with partial credit, or credit for correctly flagging one of 30 deliberately infeasible tasks.
          - listitem [ref=f7e1184]:
            - strong [ref=f7e1185]: "Filtering / difficulty estimation:"
            - text: constructed post hoc from measured human completion time (Easy <60s, Medium 60–180s, Hard >180s), with human success falling from 85% to 50% across bands.
          - listitem [ref=f7e1186]:
            - strong [ref=f7e1187]: "Evidence of prospective yield:"
            - text: the authors' own GPT-4V failure analysis on 550 sampled failures found >75% were mouse-click/grounding errors producing repetitive misclick loops and "environmental noise" (stray pop-ups, unrelated apps opened), plus a knowledge "mismatch dilemma" leaving agents stuck with no recovery path — a real, model-run difficulty signal, though evaluated on one older model generation (GPT-4V) rather than current frontier models.
          - listitem [ref=f7e1188]:
            - strong [ref=f7e1189]: "Semantic-duplication handling:"
            - text: not addressed explicitly in the gathered evidence.
          - listitem [ref=f7e1190]:
            - strong [ref=f7e1191]: "Cost / throughput:"
            - text: ~1,800 authoring hours + ~400 QC hours for 369 tasks ≈ 6 labor-hours/task — a real, quotable labor-cost figure, distinct from a dollar figure.
          - listitem [ref=f7e1192]:
            - strong [ref=f7e1193]: "Techniques worth adopting:"
            - text: the verifier's forced-settle
            - code [ref=f7e1194]: postconfig
            - text: pattern (blur → sleep → kill process → relaunch with debug access → sleep →
            - emphasis [ref=f7e1195]: then
            - text: read state) is directly relevant to any family in this project where an agent's action commits asynchronously and naive post-episode state reads could race a not-yet-flushed effect; the "flag one of N deliberately infeasible tasks" credit mechanism is a reusable technique for testing whether agents recognize an unsolvable task rather than hallucinating a completion.
          - listitem [ref=f7e1196]:
            - strong [ref=f7e1197]: "Limitations / unsupported claims:"
            - text: the paper explicitly flags agent safety/irreversibility risk and states it is mitigated only via VM sandboxing — i.e., the authors themselves do not claim a stronger safety mechanism exists.
        - heading [level=3] [ref=f7e1198]:
          - text: 6.2.8 τ-bench —
          - code [ref=f7e1199]: foundry-tau-bench
        - list [ref=f7e1200]:
          - listitem [ref=f7e1201]:
            - strong [ref=f7e1202]: "Repo / pinned state:"
            - text: github.com/sierra-research/tau-bench (original Sierra repo; a successor τ²-bench/tau2-bench now supersedes it but was not the fetch target here — do not conflate the two).
          - listitem [ref=f7e1203]:
            - strong [ref=f7e1204]: "Classification:"
            - text: a
            - strong [ref=f7e1205]: semi-automated foundry
            - text: — GPT-4-assisted generation plus human iterative refinement plus an automated state-diff reward, not a static corpus. It is not a Terminal-Bench source, so the formal/recommended/convention CI split used above doesn't directly apply.
          - listitem [ref=f7e1206]:
            - strong [ref=f7e1207]: "Production unit:"
            - text: one user–agent–tool dialogue task with exactly one valid ground-truth database outcome.
          - listitem [ref=f7e1208]:
            - strong [ref=f7e1209]: "Source provenance:"
            - text: manually designed DB schema, APIs, and policy documents "inspired by real-world counterparts" (customer service).
          - listitem [ref=f7e1210]:
            - strong [ref=f7e1211]: "Task-generation method:"
            - text: three stages — (1) manual domain design, (2) GPT-4-assisted synthetic data generation, (3) manual task annotation where authors iteratively rewrote user instructions, running trial agents and polishing until "no ambiguities exist," so each task lands on a unique valid ground-truth outcome.
          - listitem [ref=f7e1212]:
            - strong [ref=f7e1213]: "Verifier design:"
            - text: reward
            - code [ref=f7e1214]: r = r_action × r_output
            - text: .
            - code [ref=f7e1215]: r_action
            - text: checks the
            - emphasis [ref=f7e1216]: final DB state
            - text: against the unique ground truth (not the action trajectory taken to get there);
            - code [ref=f7e1217]: r_output
            - text: checks the agent conveyed required information to the user. The paper frames this explicitly as trading slow, careful task annotation for fast, faithful evaluation.
          - listitem [ref=f7e1218]:
            - strong [ref=f7e1219]: "Filtering / difficulty estimation:"
            - text: "difficulty correlates with the number of required ground-truth write actions. Two domains: τ-retail (500 users/50 products/1000 orders, 115 tasks, 7 write/8 read tools) and τ-airline (500 users/300 flights/2000 reservations, 50 tasks, 6 write/7 read tools)."
          - listitem [ref=f7e1220]:
            - strong [ref=f7e1221]: "Evidence of prospective yield:"
            - text: real, model-run failure analysis in three buckets — wrong-argument/hallucinated-ID tool calls (complex DB reasoning), policy non-compliance/wrong decisions (
            - deletion [ref=f7e1222]: 25%; removing policy text from the prompt dropped gpt-4o 22.4% on airline vs. 4.4% on retail), and partial resolution of compound multi-part requests (
            - text: 19%). The
            - code [ref=f7e1223]: pass^k
            - text: metric further shows reliability collapses under repeated semantically-identical trials even when single-shot success looks decent — evidence this project's own emphasis on repeated-trial reliability (not just single-pass success) is well-founded.
          - listitem [ref=f7e1224]:
            - strong [ref=f7e1225]: "Semantic-duplication handling:"
            - text: not addressed in the gathered evidence.
          - listitem [ref=f7e1226]:
            - strong [ref=f7e1227]: "Cost / throughput:"
            - text: not quantified; the "slow annotation for fast evaluation" tradeoff is stated qualitatively only.
          - listitem [ref=f7e1228]:
            - strong [ref=f7e1229]: "Techniques worth adopting:"
            - text: authority is bounded entirely through natural-language policy docs the agent must self-enforce (e.g., "exchange/modify order tools can only be called once"), with no mechanical enforcement beyond the final-state check — this is a clean, minimal-infrastructure way to test policy-compliance under compound requests, directly applicable to this project's approval-boundary/authority families; the
            - code [ref=f7e1230]: pass^k
            - text: reliability metric is a strong candidate for adoption wherever this project currently reports only single-trial pass rates.
          - listitem [ref=f7e1231]:
            - strong [ref=f7e1232]: "Limitations / unsupported claims:"
            - text: whole-state-equality grading means any single dropped sub-goal in a compound request zeroes the trial (no partial credit) — a design choice worth naming as a limitation if this project's own families want partial-credit grading for compound tasks.
        - heading [level=3] [ref=f7e1233]:
          - text: 6.2.9–6.2.10 Defects4J and BugSwarm —
          - code [ref=f7e1234]: foundry-program-repair-survey
        - list [ref=f7e1235]:
          - listitem [ref=f7e1236]:
            - strong [ref=f7e1237]: "Evidence-recovery note:"
            - text: WebFetch's summarizer could not parse either paper's raw PDF byte stream, but the binaries were saved to disk and read in full via the Read tool, yielding complete primary-source text rather than snippets for both papers. This is a useful access-method fallback worth remembering for future PDF-only sources.
        - paragraph [ref=f7e1238]:
          - strong [ref=f7e1239]: Defects4J
          - text: "(Just, Jalali, Ernst, ISSTA 2014):"
        - list [ref=f7e1240]:
          - listitem [ref=f7e1241]:
            - strong [ref=f7e1242]: "Classification:"
            - text: a
            - strong [ref=f7e1243]: foundry
            - text: — real developer-commit mining, automated + manual filtering, and a verified bug/fix task as output.
          - listitem [ref=f7e1244]:
            - strong [ref=f7e1245]: "Production unit:"
            - text: one isolated bug/fix pair with a fail-to-pass test, checked under a pinned JVM/build system.
          - listitem [ref=f7e1246]:
            - strong [ref=f7e1247]: "Source provenance:"
            - text: real developer commits.
          - listitem [ref=f7e1248]:
            - strong [ref=f7e1249]: "Task-generation / filtering:"
            - text: three explicit, formally enforced acceptance requirements — (1)
            - emphasis [ref=f7e1250]: source-code relatedness
            - text: ": commit is developer-labeled a bug fix and touches only source, excluding build/config/doc/test-only changes; (2)"
            - emphasis [ref=f7e1251]: reproducibility
            - text: ": the fixed version has ≥1 test passing on-fix/failing on-bug under a pinned JVM/build system, with tests already failing on the fixed version stripped first to avoid pre-existing/flaky noise contaminating the oracle; (3)"
            - emphasis [ref=f7e1252]: isolation
            - text: ": the diff contains no unrelated features or refactorings."
          - listitem [ref=f7e1253]:
            - strong [ref=f7e1254]: "Verifier design:"
            - text: candidate identification and reproducibility checking are automated; isolation is manually reviewed and hand-edited, because "developers routinely bundle unrelated changes into commits they label 'bug fix'" — an explicitly named risk in the paper itself.
          - listitem [ref=f7e1255]:
            - strong [ref=f7e1256]: "Evidence of prospective yield:"
            - text: the three-gate criteria are described, but no dataset-size/attrition numbers (candidates in → bugs accepted) were captured in this pass.
          - listitem [ref=f7e1257]:
            - strong [ref=f7e1258]: "Techniques worth adopting:"
            - text: the explicit, named "isolation" review step — manually checking that a labeled bug-fix commit doesn't smuggle in unrelated refactors — is directly relevant anywhere this project sources tasks from real commits or PRs and assumes the diff is scoped to the stated problem.
          - listitem [ref=f7e1259]:
            - strong [ref=f7e1260]: "Limitations:"
            - text: isolation review is manual and does not scale automatically; the paper is explicit that this is a known, accepted cost of the design rather than a solved problem.
        - paragraph [ref=f7e1261]:
          - strong [ref=f7e1262]: BugSwarm
          - text: "(Tomassi et al., ICSE 2019, arXiv:1903.06725):"
        - list [ref=f7e1263]:
          - listitem [ref=f7e1264]:
            - strong [ref=f7e1265]: "Classification:"
            - text: a
            - strong [ref=f7e1266]: foundry
            - text: — CI-log mining with automated reproducibility filtering — but with severe, precisely quantified attrition and a self-flagged verifier-proxy weakness.
          - listitem [ref=f7e1267]:
            - strong [ref=f7e1268]: "Production unit:"
            - text: one archived Travis-CI fail→pass build-log transition, re-executed in a reconstructed Docker container.
          - listitem [ref=f7e1269]:
            - strong [ref=f7e1270]: "Source provenance:"
            - text: real Travis-CI build logs.
          - listitem [ref=f7e1271]:
            - strong [ref=f7e1272]: "Task-generation method:"
            - text: mines fail→pass build-log transitions, reconstructs the environment as a Docker container, and calls a pair "reproducible" only if reproduced log attributes (pass/fail counts, failing-test names) match the archive across 5 repeated runs (otherwise labeled "flaky").
          - listitem [ref=f7e1273]:
            - strong [ref=f7e1274]: "Verifier design:"
            - text: 5×-repeated-run log-attribute matching against the archived record.
          - listitem [ref=f7e1275]:
            - strong [ref=f7e1276]: "Evidence of prospective yield:"
            - text: "precisely quantified, though the source text itself is internally inconsistent about the denominator and this inconsistency is reported rather than resolved: of 447,490 mined pairs, 101,265 are stated to have \"survived filtering as attemptable,\" while a separate figure in the same summary states \"we successfully reproduced 3,091 out of 55,586 attempted pairs\" (5.56%). Both figures are as stated in the source; 3,091 against the full 447,490 mined pairs is ≈0.69% end-to-end yield, and against the 101,265 \"attemptable\" figure is ≈3.05%. A manual audit of 100 unreproducible failures attributed causes roughly 30% to missing/incompatible dependencies and 30% to stale URLs/network drift."
          - listitem [ref=f7e1277]:
            - strong [ref=f7e1278]: "Semantic-duplication handling:"
            - text: not addressed.
          - listitem [ref=f7e1279]:
            - strong [ref=f7e1280]: "Cost / throughput:"
            - text: the yield figures above are themselves the clearest quantified throughput/attrition data point among all projects surveyed in this section — directly comparable to this project's own funnel-attrition reporting style (e.g., the 12→6→4→1 funnel in
            - code [ref=f7e1281]: PHASE-16-DISCOVERY-V3.md
            - text: ).
          - listitem [ref=f7e1282]:
            - strong [ref=f7e1283]: "Techniques worth adopting:"
            - text: the explicit acknowledgment that "fail-pass" alone does not prove a genuine fix — the paper states plainly that "the supposed fix could simply delete or revert the buggy code or disable any failing tests" — is a direct analog to this project's own
            - code [ref=f7e1284]: mutants-caught-by-intended-check
            - text: concern, and worth citing as external confirmation that a shallow pass/fail transition is an unreliable ground-truth proxy on its own.
          - listitem [ref=f7e1285]:
            - strong [ref=f7e1286]: "Limitations / unsupported claims:"
            - text: the replay-against-drifted-environment failure mode (dependency and URL drift causing non-reproduction years later) is a structural risk for any benchmark that pins external state rather than fully vendoring it — worth flagging for this project's own packages if any external dependencies are referenced rather than pinned/vendored.
        - heading [level=3] [ref=f7e1287]:
          - text: 6.2.11 VOID (Verica Open Incident Database) —
          - code [ref=f7e1288]: foundry-incident-mining-survey
        - list [ref=f7e1289]:
          - listitem [ref=f7e1290]:
            - strong [ref=f7e1291]: "Evidence-quality note:"
            - text: WebFetch returned an empty JS shell for this React/Softr-built site; content was instead read via Playwright browser navigation + accessibility snapshot. The full 2024 Report PDF is gated behind an email-capture form and was
            - strong [ref=f7e1292]: not read directly
            - text: "— only the report landing page's summarized key findings were captured. Depth achieved: partial."
          - listitem [ref=f7e1293]:
            - strong [ref=f7e1294]: "Repo / pinned state:"
            - text: thevoid.community (community-stewarded successor to the original Verica-run VOID).
          - listitem [ref=f7e1295]:
            - strong [ref=f7e1296]: "Classification:"
            - text: explicitly
            - strong [ref=f7e1297]: not
            - text: a foundry, generator, benchmark corpus (in the task sense), or runner. It is a
            - strong [ref=f7e1298]: raw evidence corpus
            - text: — real incident narratives plus a hand-coded metadata taxonomy — with no task-generation step, no verifier, and no production unit. It should be read only as upstream source material for future mechanism/task design, not compared directly against the other 14 entries as a benchmark.
          - listitem [ref=f7e1299]:
            - strong [ref=f7e1300]: "Production unit:"
            - text: none.
          - listitem [ref=f7e1301]:
            - strong [ref=f7e1302]: "Source provenance:"
            - text: ~2,000 public software incident reports from ~660 organizations — tweets, status-page updates, conference talks, and full company postmortems.
          - listitem [ref=f7e1303]:
            - strong [ref=f7e1304]: "Task-generation method:"
            - text: "N/A. Per its own About page: \"nearly all the information comes directly verbatim from the report artifacts themselves, along with a set of metadata that we've collected based on the report contents\" — raw narrative preserved, fixed metadata schema hand-coded on top (impact-category taxonomy: Accident, Cascading failure, Connection issues, Data loss, Degraded service/performance, Full production outage, Increased errors, Increased latency, Lost developer time, Near miss, Non-production outage, Partial production outage, Scheduled maintenance, Security, Unknown, Other)."
          - listitem [ref=f7e1305]:
            - strong [ref=f7e1306]: "Verifier design:"
            - text: N/A.
          - listitem [ref=f7e1307]:
            - strong [ref=f7e1308]: "Filtering / difficulty estimation:"
            - text: N/A — the project explicitly rejects single-root-cause framing, stating organizations are "ditching Root Cause Analysis" and treating MTTR as an unreliable, gameable metric, favoring analysis of multiple interacting contributing factors per incident instead.
          - listitem [ref=f7e1309]:
            - strong [ref=f7e1310]: "Evidence of prospective yield:"
            - text: N/A — not a task-production pipeline.
          - listitem [ref=f7e1311]:
            - strong [ref=f7e1312]: "Semantic-duplication handling:"
            - text: N/A.
          - listitem [ref=f7e1313]:
            - strong [ref=f7e1314]: "Cost / throughput:"
            - text: N/A.
          - listitem [ref=f7e1315]:
            - strong [ref=f7e1316]: "Techniques worth adopting:"
            - text: not a technique to adopt directly, but a genuine
            - emphasis [ref=f7e1317]: source
            - text: worth mining — the 2024 Report's key finding that automation "frequently becomes a contributing factor in incidents without the capability to resolve these incidents independently" (via retry storms, interference with automated logs/data, unexpected component interactions expanding the incident's surface area, or misconfigurations), and that automation failures often leave situations "more complex and challenging to resolve than those the automation was designed to handle," is real, professionally-grounded justification for task shapes around automation-triggered scope expansion and authority-envelope exceedance — patterns this project already targets in its permission-boundary and rollback families.
          - listitem [ref=f7e1318]:
            - strong [ref=f7e1319]: "Limitations / unsupported claims:"
            - text: the full 2024 Report was not read (gated behind email capture), so only its landing-page summary of "key findings" is reflected above; treat any more granular statistics from that report as unverified until the underlying document is actually retrieved.
        - heading [level=3] [ref=f7e1320]:
          - text: 6.2.12 AgentChaos —
          - code [ref=f7e1321]: foundry-fault-injection-survey
        - list [ref=f7e1322]:
          - listitem [ref=f7e1323]:
            - strong [ref=f7e1324]: "Repo / pinned state:"
            - text: arXiv:2608.06790 (Tan, Sun, Shi et al., submitted 2026-08-07).
          - listitem [ref=f7e1325]:
            - strong [ref=f7e1326]: "Classification:"
            - text: a
            - strong [ref=f7e1327]: generator/harness
            - text: for fault injection — not a standalone foundry with its own novel tasks. It perturbs existing verified benchmarks (HumanEval(+), MBPP(+), MMLU-Pro, MATH-500, SWE-bench Pro) rather than sourcing and verifying new ones. No Terminal-Bench-style formal/recommended/convention split applies.
          - listitem [ref=f7e1328]:
            - strong [ref=f7e1329]: "Production unit:"
            - text: one fault-injected replay of an existing benchmark item, run through one of five multi-agent architectures (AutoGen, MAD, MapCoder, EvoMAC, Mini-SE).
          - listitem [ref=f7e1330]:
            - strong [ref=f7e1331]: "Source provenance:"
            - text: existing published benchmarks, perturbed at the shared LLM-API HTTP layer with no source-code changes to the underlying benchmark or agent.
          - listitem [ref=f7e1332]:
            - strong [ref=f7e1333]: "Task-generation method:"
            - text: a fault taxonomy of crash (error, timeout), omission (empty, truncate), and value (corrupt, schema-mismatch) faults, applied to either
            - code [ref=f7e1334]: content
            - text: or
            - code [ref=f7e1335]: tool_call
            - text: fields, combined with injection policies (single/persistent/intermittent/burst) and position — yielding 65 configurations tested across the five architectures and five underlying benchmarks.
          - listitem [ref=f7e1336]:
            - strong [ref=f7e1337]: "Verifier design:"
            - text: two layers — a trigger-confirmation check ("the execution trace contains at least one fault event"), which discards untriggered tasks
            - emphasis [ref=f7e1338]: before
            - text: computing pass@1 "to filter untriggered tasks and avoid underestimating fault impact," and the underlying benchmark's own native pass@1 (test-case execution or ground-truth match).
          - listitem [ref=f7e1339]:
            - strong [ref=f7e1340]: "Filtering / difficulty estimation:"
            - text: difficulty is constructed by which fault type/policy/position is applied and which architecture receives it, not by a difficulty-estimation step on the underlying tasks themselves.
          - listitem [ref=f7e1341]:
            - strong [ref=f7e1342]: "Evidence of prospective yield:"
            - text: "strong, and directly relevant to architecture-level (not just task-level) difficulty construction: pipeline systems (MapCoder) degrade catastrophically — up to an 83.87% pass@1 drop when a fault hits the first call — because \"a fault propagates through all downstream stages without recovery,\" whereas iterative systems (EvoMAC) self-correct across refinement rounds and are the most robust. Existing fault-diagnosis methods are weak (≤53% type accuracy, ≤56% step accuracy), and the most harmful fault type (truncation) is also the hardest to detect."
          - listitem [ref=f7e1343]:
            - strong [ref=f7e1344]: "Semantic-duplication handling:"
            - text: N/A — this is fault-injection over existing tasks, not novel-task generation.
          - listitem [ref=f7e1345]:
            - strong [ref=f7e1346]: "Cost / throughput:"
            - text: 65 configurations × 5 architectures across 5 benchmark families; no $ cost given.
          - listitem [ref=f7e1347]:
            - strong [ref=f7e1348]: "Techniques worth adopting:"
            - text: the HTTP-layer response-interception approach (no source-code changes needed to the agent or benchmark) is a low-friction way to inject stale-cache, corrupted-argument, or schema-mismatch faults into any existing family in this project without modifying the family's own code; the trigger-confirmation discipline (discard untriggered tasks before scoring, to avoid silently underestimating fault impact) is directly reusable as a sanity check whenever this project injects an environmental fault into a scenario and needs to confirm the fault actually fired before counting the trial.
          - listitem [ref=f7e1349]:
            - strong [ref=f7e1350]: "Limitations / unsupported claims:"
            - text: the paper explicitly flags its own limitation — scoring by pass@1 alone "captures overall performance degradation but not partial correctness or output quality," and no human review is used, so nuanced near-miss behavior is invisible to this design.
        - heading [level=3] [ref=f7e1351]:
          - text: 6.2.13–6.2.15 METR Task Standard, TheAgentCompany, AppWorld —
          - code [ref=f7e1352]: foundry-open-discovery
        - list [ref=f7e1353]:
          - listitem [ref=f7e1354]:
            - strong [ref=f7e1355]: "Evidence-quality note:"
            - code [ref=f7e1356]: taskdev.metr.org/specification/
            - text: returned HTTP 403 and was not used; depth achieved overall is partial. The source's own narrative summary calls all three "true foundries... qualifying them as true foundries rather than fixed static benchmarks" — this section applies the task brief's stricter test instead and reports where that characterization does and doesn't hold up against the specific evidence gathered.
        - paragraph [ref=f7e1357]:
          - strong [ref=f7e1358]: METR Task Standard
          - text: "(github.com/METR/task-standard; metr.org blog, 2024-02-29):"
        - list [ref=f7e1359]:
          - listitem [ref=f7e1360]:
            - strong [ref=f7e1361]: "Classification:"
            - text: a
            - strong [ref=f7e1362]: task-authoring framework + runner
            - text: ", not a generative foundry — task creation against the standard is manual per author; the standard itself is a schema/contract plus a harness that checks conformance, structurally identical in role to Harbor/Terminal-Bench above. It is used to build METR's own ~200 task families (HCAST, RE-Bench, etc.), but no evidence was gathered describing an automated source-to-candidate generation step."
          - listitem [ref=f7e1363]:
            - strong [ref=f7e1364]: "Production unit:"
            - text: one
            - code [ref=f7e1365]: TaskFamily
            - text: class instance conforming to the standard.
          - listitem [ref=f7e1366]:
            - strong [ref=f7e1367]: "Task-generation method:"
            - text: N/A (manual authoring against a spec).
          - listitem [ref=f7e1368]:
            - strong [ref=f7e1369]: "Verifier design:"
            - text: formally enforced by the harness — a
            - code [ref=f7e1370]: TaskFamily
            - text: class must define
            - code [ref=f7e1371]: standard_version
            - text: ","
            - code [ref=f7e1372]: get_tasks()
            - text: ","
            - code [ref=f7e1373]: get_instructions()
            - text: ", and"
            - code [ref=f7e1374]: score()
            - text: ; these are checked before running.
            - code [ref=f7e1375]: install()
            - text: ","
            - code [ref=f7e1376]: start()
            - text: ","
            - code [ref=f7e1377]: get_aux_vm_spec()
            - text: ", and pytest task-tests are recommended but optional."
          - listitem [ref=f7e1378]:
            - strong [ref=f7e1379]: "Filtering / difficulty estimation:"
            - text: not evidenced in this pass.
          - listitem [ref=f7e1380]:
            - strong [ref=f7e1381]: "Authority/permission design (relevant to this project):"
            - text: structural — agents run as an unprivileged "agent" user with no root access; a per-task
            - code [ref=f7e1382]: get_permissions()
            - text: gates internet access.
          - listitem [ref=f7e1383]:
            - strong [ref=f7e1384]: "Evidence of prospective yield:"
            - text: not evidenced in this pass (spec page 403'd; no aggregate pass-rate or attrition data captured).
          - listitem [ref=f7e1385]:
            - strong [ref=f7e1386]: "Limitations / unsupported claims:"
            - text: METR's own docs admit unresolved "warts" — insufficient determinism guarantees and network-sandboxing gaps for auxiliary VMs, where firewall holes must be manually declared per task. This is a real, self-reported limitation worth noting for any project (including this one) considering aux-VM-style task execution.
          - listitem [ref=f7e1387]:
            - strong [ref=f7e1388]: "Techniques worth adopting:"
            - text: the minimal, formally-enforced class contract (
            - code [ref=f7e1389]: get_tasks
            - text: /
            - code [ref=f7e1390]: get_instructions
            - text: /
            - code [ref=f7e1391]: score
            - text: ) as a portable pattern for keeping a task-authoring interface small and CI-checkable, separate from the (larger, optional) authoring-quality recommendations.
        - paragraph [ref=f7e1392]:
          - strong [ref=f7e1393]: TheAgentCompany
          - text: "(GitHub, NeurIPS 2025 Datasets & Benchmarks):"
        - list [ref=f7e1394]:
          - listitem [ref=f7e1395]:
            - strong [ref=f7e1396]: "Classification:"
            - text: a
            - strong [ref=f7e1397]: benchmark corpus + simulated-environment runner
            - text: with a genuinely rigorous verifier — not confirmed as a generative foundry by the evidence gathered, since task creation was not described as automated generation from source material (it reads as curated/authored).
          - listitem [ref=f7e1398]:
            - strong [ref=f7e1399]: "Production unit:"
            - text: one of 175 long-horizon tasks, packaged as a Docker image running real GitLab, Plane, ownCloud, and RocketChat, plus LLM-driven NPC colleagues.
          - listitem [ref=f7e1400]:
            - strong [ref=f7e1401]: "Verifier design:"
            - text: each task ships an encrypted
            - code [ref=f7e1402]: eval.py
            - text: with checkpoint-based partial credit, mixing deterministic checks for objective criteria and LLM-based evaluators for subjective assessment.
          - listitem [ref=f7e1403]:
            - strong [ref=f7e1404]: "Evidence of prospective yield:"
            - text: real and strong at the outcome level — the top model (Gemini 2.5 Pro) autonomously completed only 30.3% of tasks — though this is a fixed-corpus result, not a construction-time attrition statistic.
          - listitem [ref=f7e1405]:
            - strong [ref=f7e1406]: "Techniques worth adopting:"
            - text: the "primary result-based evaluation plus subcheckpoint verification tracking intermediate progress" pattern — deterministic checks for objective criteria, LLM-judged checks for subjective ones, combined into partial credit — is directly relevant to any long-horizon, multi-service family in this project where a single pass/fail check would obscure partial progress.
          - listitem [ref=f7e1407]:
            - strong [ref=f7e1408]: "Limitations / unsupported claims:"
            - text: the encrypted
            - code [ref=f7e1409]: eval.py
            - text: design was not independently inspected (README-level evidence only), so its actual robustness against gaming is unverified from this pass.
        - paragraph [ref=f7e1410]:
          - strong [ref=f7e1411]: AppWorld
          - text: "(arXiv:2407.18901):"
        - list [ref=f7e1412]:
          - listitem [ref=f7e1413]:
            - strong [ref=f7e1414]: "Classification:"
            - text: the closest of the three to a genuine
            - strong [ref=f7e1415]: generator/foundry
            - text: ", since the evidence explicitly states an actual generation multiplier — but the generation"
            - emphasis [ref=f7e1416]: mechanism
            - text: itself (templated? parameterized? combinatorial?) is not detailed in what was gathered, so this classification is offered with an explicit thinness caveat.
          - listitem [ref=f7e1417]:
            - strong [ref=f7e1418]: "Production unit:"
            - text: one of 750 tasks generated from 250 scenarios, inside a controllable simulated world of 9 apps, 457 APIs, and ~100 synthetic users.
          - listitem [ref=f7e1419]:
            - strong [ref=f7e1420]: "Verifier design:"
            - text: state-based unit tests that explicitly check for "collateral damage" (unintended state changes beyond the stated goal) alongside goal completion, allowing different valid ways of completing a task.
          - listitem [ref=f7e1421]:
            - strong [ref=f7e1422]: "Filtering / difficulty estimation:"
            - text: "\"normal\" vs. \"challenge\" difficulty tiers, mechanism for tiering not detailed in evidence gathered."
          - listitem [ref=f7e1423]:
            - strong [ref=f7e1424]: "Evidence of prospective yield:"
            - text: not quantified in this pass beyond the tiering label.
          - listitem [ref=f7e1425]:
            - strong [ref=f7e1426]: "Techniques worth adopting:"
            - text: the collateral-damage-aware state diff (checking the
            - emphasis [ref=f7e1427]: entire
            - text: world state, not just the target field, so an agent that completes the goal while mutating unrelated records still fails) is a strong, directly reusable pattern for any family in this project with a shared, stateful multi-tool environment — it is essentially a generalization of this project's own scope-expansion mechanism, implemented as a verifier design rather than a scored mechanism category.
          - listitem [ref=f7e1428]:
            - strong [ref=f7e1429]: "Limitations / unsupported claims:"
            - text: the specific task-generation mechanism behind "750 tasks from 250 scenarios" was not captured at implementation-level detail; do not assume a particular generation method (e.g., parameter substitution vs. LLM synthesis) without a direct source read.
        - separator [ref=f7e1430]
        - heading "6.3 Techniques worth adopting (cross-cutting)" [level=2] [ref=f7e1431]
        - list [ref=f7e1432]:
          - listitem [ref=f7e1433]:
            - strong [ref=f7e1434]: Solvability-filtered curation before admission
            - text: (TUA-Bench,
            - code [ref=f7e1435]: foundry-tua-bench
            - text: "): run every candidate through multiple frontier models × multiple trials and keep only the lowest-solvability subset. This is a cheap, forward-looking pre-filter this project could run ahead of full family build, complementary to its existing"
            - code [ref=f7e1436]: mechanism_probe
            - text: step.
          - listitem [ref=f7e1437]:
            - strong [ref=f7e1438]: Fail-to-pass + hint-conditional double gate
            - text: (CLI-Universe,
            - code [ref=f7e1439]: foundry-cli-universe
            - text: "): requiring both a pre/post test-state flip"
            - emphasis [ref=f7e1440]: and
            - text: a hint-free-fails/hint-guided-succeeds check removes trivial tasks that a single fail-to-pass gate would admit.
          - listitem [ref=f7e1441]:
            - strong [ref=f7e1442]: Named adversarial pre-publication check
            - text: (Terminal-Bench,
            - code [ref=f7e1443]: foundry-terminal-agent-lab
            - text: "): a dedicated \"try to game the verifier via unintended shortcut\" step before a task ships, distinct from and complementary to this project's own adversarial-audit reports."
          - listitem [ref=f7e1444]:
            - strong [ref=f7e1445]: Forced state-settle before verification
            - text: (OSWorld,
            - code [ref=f7e1446]: foundry-osworld
            - text: "): explicitly blur/sleep/kill/relaunch/sleep before reading final state, for any task where an agent's action may commit asynchronously."
          - listitem [ref=f7e1447]:
            - strong [ref=f7e1448]: Collateral-damage / full-state-diff verification
            - text: (AppWorld,
            - code [ref=f7e1449]: foundry-open-discovery
            - text: "): score against the entire environment state, not just the target field, so unintended side effects outside the task's stated scope are caught automatically — a generalizable implementation of this project's own scope-expansion mechanism."
          - listitem [ref=f7e1450]:
            - strong [ref=f7e1451]: Fault injection at the HTTP layer with trigger-confirmation
            - text: (AgentChaos,
            - code [ref=f7e1452]: foundry-fault-injection-survey
            - text: "): inject faults without touching agent or benchmark source code, and discard any trial where the fault didn't actually fire before scoring it — avoids silently underestimating fault impact."
          - listitem [ref=f7e1453]:
            - strong [ref=f7e1454]: Periodic independent verifier audit
            - text: (SWE-bench Verified re-annotation,
            - code [ref=f7e1455]: foundry-swe-bench
            - text: "): treat an automated filtering pipeline's first-pass verifier suite as provisional and subject it to human re-annotation for issue-underspecification and test-overfit, rather than trusting it indefinitely."
          - listitem [ref=f7e1456]:
            - strong [ref=f7e1457]:
              - code [ref=f7e1458]: pass^k
              - text: reliability metric
            - text: (τ-bench,
            - code [ref=f7e1459]: foundry-tau-bench
            - text: "): report reliability under repeated, semantically-identical trials, not just single-shot pass rate."
          - listitem [ref=f7e1460]:
            - strong [ref=f7e1461]: Credential-injection wrapper pattern
            - text: (Klavis-AI/Toolathlon-mvp,
            - code [ref=f7e1462]: foundry-toolathlon
            - text: "): swap hardcoded authority objects for remotely-issued ones transparently at the network/file layer, useful for running a fixed suite against different authority backends without touching task code."
          - listitem [ref=f7e1463]:
