        - heading "5.15 External-system reconciliation" [level=2] [ref=f7e772]
        - paragraph [ref=f7e773]:
          - text: The Notion/
          - code [ref=f7e774]: normalize_*
          - text: "error-stripping bug (5.14) is itself the central external-system reconciliation failure: real vendor error state (a 404 from Notion's live API) is lost at the tool-normalization boundary before it ever reaches the agent or any downstream grader that inspects returned content [klavis-klavis-issues, klavis-klavis-prs]."
          - code [ref=f7e775]: Toolathlon-mvp
          - text: "documents a second, structurally different reconciliation seam: because its tasks were authored for a monolithic local environment (hardcoded"
          - code [ref=f7e776]: localhost
          - text: ports, local credential file paths), the benchmark runner transparently monkeypatches
          - code [ref=f7e777]: socket.getaddrinfo
          - text: ","
          - code [ref=f7e778]: requests
          - text: /
          - code [ref=f7e779]: aiohttp
          - text: ", and"
          - code [ref=f7e780]: builtins.open
          - text: /
          - code [ref=f7e781]: os.stat
          - text: for its own local preprocess/evaluation subprocesses — but explicitly
          - emphasis [ref=f7e782]: not
          - text: for the agent's own MCP tool calls, which go directly to Klavis-issued URLs unmodified. Any gap in this patched surface silently breaks setup or grading through no action of the agent, and the seam between what the harness redirects and what the agent's actions actually touch is a reconciliation hazard specific to how the benchmark, not the agent, resolves environment identity [klavis-toolathlon-mvp-repo].
