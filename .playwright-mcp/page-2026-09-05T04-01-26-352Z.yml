            - text: "Visible tests exercise each event type's happy-path handler once, and redeliver one event with the exact same event id to confirm idempotent no-op behavior — both pass. This is realistic: it is the first idempotency test any team writes, and per this project's own prior evidence (a merged discovery-track candidate on the same axis notes \"the natural test delivers the same event twice back to back and cannot fail\"). The gap is structural and unchanged by this revision: no visible test reorders two different event types for the same object, none constructs a split-duplicate pair with two distinct ids, and none exercises a manual resend concurrent with a still-pending automatic retry — so the suite cannot see any of the three graded decision surfaces."
          - listitem [ref=f7e2114]:
            - strong [ref=f7e2115]: "Private verifier architecture:"
            - text: A separate verifier process reads only the root-owned
            - code [ref=f7e2116]: platform_sim
            - text: sidecar's true object-transition timeline and delivery/ack ledger, plus the subject's captured CLI/state artifacts — never the subject's self-reported state. Grading is interval-based on the state side and obligation-based on the incident side, unchanged from the prior draft.
        - paragraph [ref=f7e2117]:
          - text: NEW this revision — a real self-check-coverage predictor, generalizing
