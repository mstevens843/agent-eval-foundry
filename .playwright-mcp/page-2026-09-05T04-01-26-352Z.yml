        - paragraph [ref=f7e2222]: "Remaining risks, updated:"
        - list [ref=f7e2223]:
          - listitem [ref=f7e2224]:
            - text: The identity-plus-event-type keying rule must be fully derivable from the object/event schema genuinely shipped to the subject, not from information withheld only to the verifier — unchanged concern, now easier to check since
