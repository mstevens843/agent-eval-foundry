        - paragraph [ref=f7e2757]: (5) External authoritative state / ledger analogue → deliberately not a literal ledger; see externalAuthorityOrWitness. The daemon's own introspection API plus its independent event stream is this family's non-ledger witness.
        - paragraph [ref=f7e2758]: (6) Separate outcome-measuring verifier, per-run anti-forgery report → a meta-verifier runs outside and independently of the candidate pipeline, against a real daemon. For each fixture it (a) invokes the candidate pipeline, (b) independently queries the daemon's own event stream and inspect API — identifying "the verifier container" itself by daemon-reported creation order and timestamp relative to the daemon-witnessed agent-teardown event, never by a name or id the candidate's own code hands it — for the verifier container's actual mount table, resolved bind sources, and image layer digests, and (c) requires the candidate's own reported outcome, plus a mandatory structured self-check-coverage report (which surfaces were exposed, confirmation of teardown-before-start, and confirmation that every shared-name resource and every declared artifact path was independently re-verified for freshness/provenance) to agree with those independently observed daemon facts. A shallow patch that passes by luck without an accurate self-report is flagged as a coverage failure distinct from a correctness failure. This is the anti-forgery mechanism; it is deliberately NOT the pre-trial predictor described next, and the two are no longer conflated.
        - paragraph [ref=f7e2759]:
          - text: (6a) Pre-trial self-check-coverage predictor (construction gate, computed and recorded BEFORE any trial spend — this is the actual Phase 17 recommendation 1 artifact, not a relabeling of 6). Modeled directly on this repository's own
          - code [ref=f7e2760]: src/screens/self-check-coverage.ts
