    - generic [ref=f2e83]:
      - heading "What People Are Saying About the VOID" [level=2] [ref=f2e85]
      - generic [ref=f2e87]:
        - generic [ref=f2e89]:
          - generic [ref=f2e91]:
            - paragraph [ref=f2e93]: Reading that companies are ditching Root Cause Analysis in the same report as we get a fantastic analysis of MTTR fallacies really gave me, a professional pessimist, optimism for the future.
            - generic [ref=f2e94]:
              - heading "Clint Byrum" [level=5] [ref=f2e95]
              - generic [ref=f2e96]: Staff Engineer, Spotify
          - generic [ref=f2e98]:
            - paragraph [ref=f2e100]: "If you loved Accelerate and the DORA Report, this will be right up your alley: a long-overdue, open-sourced data dump of real outages. Yours. Ours. Companies big and small have contributed their outage reports to seed this repo of what really happens when things goes sideways."
            - heading "Honeycomb" [level=5] [ref=f2e102]
          - generic [ref=f2e104]:
            - paragraph [ref=f2e106]: The VOID report is the first industry-wide analysis of the state of software reliability today—in fact, it is the closest thing we have to a 'State of the Union' address. Everyone who designs and operates software systems should read it.
            - generic [ref=f2e107]:
              - heading "Laura Nolan" [level=5] [ref=f2e108]
              - generic [ref=f2e109]: Engineer, Stanza Systems
          - generic [ref=f2e111]:
            - paragraph [ref=f2e113]: The VOID project is one of the most significant steps we can take as an industry to improve our operations and safety. This report sets up solid bases for many organizations and practitioners to turn their outage review practices towards more impactful and learning-centric views.
            - generic [ref=f2e114]:
              - heading "Fred Hebert" [level=5] [ref=f2e115]
              - generic [ref=f2e116]: Staff SRE, Honeycomb
          - generic [ref=f2e118]:
            - paragraph [ref=f2e120]: The VOID report is an outstanding broad view of patterns in incidents across many organizations. I'm looking forward to the database growing and lending itself to even more research and insights.
            - generic [ref=f2e121]:
              - heading "Štěpán Davidovič" [level=5] [ref=f2e122]
              - generic [ref=f2e123]: Senior Staff SRE, Google
          - generic [ref=f2e125]:
            - paragraph [ref=f2e127]: "The VOID report challenges the “Old View” in what many technology organizations deem as the gold standard for incidents, such as: duration of incidents, MTTR, and Root Cause Analysis. Instead, we can embrace a “New View” that includes learning from incidents beyond just fixing them, deeper and broader incident analysis, humans as the superpower of systems, and an increased focus on successes versus failures when analyzing incidents."
            - generic [ref=f2e128]:
              - heading "Chad Todd" [level=5] [ref=f2e129]
              - generic [ref=f2e130]: SRE Manager, Crowdstrike
          - generic [ref=f2e132]:
            - paragraph [ref=f2e134]: If you aren't recording and publishing incidents because you want to look good, then you are more likely to have a much bigger failure. This report raises some interesting questions, how can we measure near-misses, and can we find a better metric than Mean Time To Repair (MTTR) given the complex partial failure modes we see? I encourage everyone to publish more, include near misses in your incident reports, and to help everyone else build a safer world as a result.
            - generic [ref=f2e135]:
              - heading "Adrian Cockcroft" [level=5] [ref=f2e136]
              - generic [ref=f2e137]: Partner, OrionX & Tech Advisor
          - generic [ref=f2e139]:
            - paragraph [ref=f2e141]: The VOID report marks a remarkable advancement in how our community will look at and fix incidents moving forward. Upon seeing the emerging key findings of the report, Jeli was excited to support this research across these large datasets. Through extrapolating the key findings of the report, we are all able to build more resilient systems with greater collaboration.
            - generic [ref=f2e142]:
              - heading "Nora Jones" [level=5] [ref=f2e143]
              - generic [ref=f2e144]: CEO, Jeli
          - generic [ref=f2e146]:
            - paragraph [ref=f2e148]: The VOID Report is one of those rare and delightful moments of active thought. It takes a given subject matter, in this case claims about incidents in software, as serious and worthy of in-depth consideration. And through a close examination it finds that something doesn't quite make sense. That critique provides an opening for thought, and the sloughing off of received dogma. It's a wonderful example of critical thinking.
            - generic [ref=f2e149]:
              - heading "Nick Travaglini" [level=5] [ref=f2e150]
              - generic [ref=f2e151]: Technical CSM, Honeycomb
          - generic [ref=f2e153]:
            - paragraph [ref=f2e155]: As SREs we spend a lot of time thinking about incidents, trying to learn from them and understand our world better. The VOID report gives us well-researched data so we can see clearer, and help our organizations learn from our peers across the industry.
            - generic [ref=f2e156]:
              - heading "Amy Tobey" [level=5] [ref=f2e157]
              - generic [ref=f2e158]: Senior Principal Engineer, Equinix
          - generic [ref=f2e160]:
            - paragraph [ref=f2e162]: The VOID report represents a great step forward for the IT industry. It is both a demonstration that numerous organizations are transforming their approach to post-incident learning, and an inspiring call for others to recognize the importance of this New Way of looking at incidents. I love the rigorous critique of MTTR, as well as the practical alternatives suggested by the report.
            - generic [ref=f2e163]:
              - heading "David Leigh" [level=5] [ref=f2e164]
              - generic [ref=f2e165]: Distinguished Engineer, IBM
          - generic [ref=f2e167]:
            - paragraph [ref=f2e169]: Reading that companies are ditching Root Cause Analysis in the same report as we get a fantastic analysis of MTTR fallacies really gave me, a professional pessimist, optimism for the future.
