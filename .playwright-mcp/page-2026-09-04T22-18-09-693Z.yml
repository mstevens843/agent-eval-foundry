    - generic [ref=f2e24]:
      - heading "2024 VOID Report" [level=1] [ref=f2e25]
      - paragraph [ref=f2e26]: Our understanding and beliefs about automation have rapidly evolved towards an AI-dominated industry. These beliefs are partly driven by the notion that AI can address the limitations of traditional automation. The VOID has proven to be a valuable data source on how automation impacts software incidents, challenging prevailing myths about duration, severity, and MTTR. We aim to illuminate the discrepancies between our expectations of automation and its reality, offering insights on narrowing this gap.
      - link "Download" [ref=f2e28] [cursor=pointer]:
        - /url: "#custom-code1"
    - generic [ref=f2e33]:
      - heading "Key Results" [level=2] [ref=f2e35]
      - generic [ref=f2e36]:
        - generic [ref=f2e38]:
          - img "Automation Plays Multiple Roles in Incidents" [ref=f2e39]
          - heading "Automation Plays Multiple Roles in Incidents" [level=6] [ref=f2e40]
          - paragraph [ref=f2e41]: Although automation is primarily developed to remove tasks from human oversight and alert us only when issues arise, it frequently becomes a contributing factor in incidents without the capability to resolve these incidents independently. In many cases, automation assumes various roles within a single incident.
        - generic [ref=f2e43]:
          - img "Automation Can Unexpectedly Make Things Worse" [ref=f2e44]
          - heading "Automation Can Unexpectedly Make Things Worse" [level=6] [ref=f2e45]
          - paragraph [ref=f2e46]: Not only does automation contribute to an incident, but occasionally it “behaves” in ways that make incidents worse. This can take the form of retry storms, interference with access to automated logs/data, unexpected interactions with other components that expand the surface area of the incident, misconfigurations, etc.
        - generic [ref=f2e48]:
          - img "Human Intervention Remains Essential" [ref=f2e49]
          - heading "Human Intervention Remains Essential" [level=6] [ref=f2e50]
          - paragraph [ref=f2e51]: Our findings illustrate how automation, while designed to minimize human involvement, often necessitates human intervention when it fails to function as expected. These situations are usually more complex and challenging to resolve than those the automation was designed to handle.
    - paragraph [ref=f2e58]:
      - generic [ref=f2e61]:
