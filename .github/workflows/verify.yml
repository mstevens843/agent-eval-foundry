name: verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FOUNDRY_REQUIRE_CONTAINER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm secret-scan
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - name: Fast pure tier
        run: pnpm test:pure
      - name: Required local runtime setup
        run: |
          docker pull node:22-alpine
          docker pull golang:1.25-bookworm
          docker build --provenance=false -t foundry-portfolio-runtime:v1 tasks/portfolio-runtime
          docker run --rm --pull=never --network=none node:22-alpine true
      - name: All maintained tests, no silent skips
        run: pnpm test
      - name: Required native and browser production, inert execution and recipient proof
        run: pnpm test:integration .local/ci-integration
      - name: Registry and report reproduction
        run: pnpm verify
      - name: Build and inspect intended source snapshot without ambient dist
        run: pnpm verify:candidate .local/ci-candidate
      - name: Preserve tier summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-verification-summaries
          path: |
            .local/test-runs/*/summary.json
            .local/ci-integration/progress.json
          if-no-files-found: warn
